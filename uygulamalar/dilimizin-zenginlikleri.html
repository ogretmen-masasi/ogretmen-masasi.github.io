syon karar tutanağı için)`,`Tahta kalemi`],durationMinutes:40,steps:{preparation:`Zümre başkanı, MEB Uygulama Kılavuzu'nun 5. sayfasında belirtilen kurul yapısına göre müdür yardımcısı ile görüşerek toplantı gündemini ve öğrenci temsilcisi kriterlerini belirler.`,introduction:`Dakika 00 - 08: Edebiyat dersinde tahtaya "Söz Mülkünün Muhafızları: Dilimizin Zenginlikleri" yazılır. Öğretmen: "Kelimeler bir milletin hafıza kartlarıdır. Bu yıl sadece edebiyat işlemeyeceğiz; bin yıllık söz varlığımızın dedektifleri olacağız." sözleriyle derse başlar.`,execution:`Dakika 08 - 25: Akıllı tahtada yıllık eylem planı açılır. Ekim ayından Haziran ayına kadar yapılacak etkinlikler (Dîvânu Lugâti't-Türk haritası, Tabu, yapay zekâ, Safahat afişi, Veysel tahlili) takvim üzerinde gösterilir. Sınıftan gönüllü komisyon temsilcisi adayları belirlenir.`,reinforcement:`Dakika 25 - 35: Seçilen öğrenci temsilcisine görev tanımı açıklanır. Sınıf edebiyat panosuna "Haftanın Sözü ve Kitabı" köşesinin tasarımı planlanır.`,conclusion:`Dakika 35 - 40: Komisyon tutanağı imzalanır; karar metni ve yıllık çalışma planı okul idaresine teslim edilir.`},exampleData:{title:`Okul Yürütme Komisyonu Resmî Karar Şablonu`,description:`Zümre karar defterine ve okul panosuna işlenecek hazır tutanak metni:`,type:`general`,cards:[{title:`Komisyon Başkanı`,subtitle:`Müdür Yardımcısı`,content:`Görev: Okul içi faaliyetlerin yıllık takvime uygunluğunu, zümreler arası iş birliğini ve e-Okul Sosyal Etkinlik Modülü veri girişlerini denetler.`},{title:`Zümre Temsilcileri`,subtitle:`Türk Dili ve Edebiyatı Öğretmenleri`,content:`Görev: Sınıf içi etkinlikleri, sözlük tahlillerini, hazır kelime kartlarını uygular ve okul içi yarışma jürisini oluşturur.`},{title:`Öğrenci Temsilcileri`,subtitle:`9, 10, 11 ve 12. Sınıf Şube Temsilcileri`,content:`Görev: Sınıf panolarının güncellenmesi, akranlar arasında kelime avının duyurulması ve yarışma katılımının teşvik edilmesini sağlar.`}]},printableWorksheet:{title:`DİLİMİZİN ZENGİNLİKLERİ PROJESİ OKUL YÜRÜTME KOMİSYONU KARAR TUTANAĞI`,subtitle:`2026 - 2027 Eğitim Öğretim Yılı Resmî Kuruluş Belgesi`,instructions:`Aşağıdaki tutanak zümre toplantısında doldurularak Okul Yürütme Komisyonu dosyasında muhafaza edilir.`,studentHeader:!1,contentHtmlOrText:`T.C. MİLLÎ EĞİTİM BAKANLIĞI

GÜNDEM MADDELERİ:
1. MEB 2026-2027 Dilimizin Zenginlikleri Projesi Uygulama Kılavuzu'nun incelenmesi.
2. Okul Yürütme Komisyonunun oluşturulması.
3. Yıllık eylem planı takviminin sınıflarda uygulanma esaslarının kararlaştırılması.

1. Kılavuz gereğince okul komisyonumuz; Müdür Yardımcısı başkanlığında, TDE Zümre Öğretmenleri ve her kademeden birer öğrencinin katılımıyla kurulmuştur.

3. Yapılan tüm faaliyetler fotoğraflandırılarak haftalık faaliyet raporu düzenlenecek ve e-Okul sistemine işlenecektir.

k eserindeki gerçek kadim kelimelerin etimolojisi, 11. yüzyıl bağlamı ve günümüz Türkçesiyle Türk dünyası haritasında canlandırılması.`,objective:`Türkçenin ilk sözlüğü olan Dîvânu Lugâti't-Türk’ün önemini kavrar; 11. yüzyıl söz varlığının günümüz Türkçesiyle ve coğrafyasıyla bağını kurarak canlı harita oluşturur.`,eOkul:{alan:`Dil ve Konuşma Becerileri`,kategori:`Söz Varlığı ve Edebiyat`,etkinlikTuru:`Atölye ve Canlı Harita Tasarımı`,kazanimMetni:`Dîvânu Lugâti't-Türk’te yer alan sözcüklerin etimolojik kökenlerini ve Türk coğrafyasındaki tarihî yayılımını analiz eder.`},materials:[`Etkileşimli akıllı tahta (Dilsiz Türk Dünyası haritası açılır)`,`Standart A4 kâğıdı (Öğrenci çalışma fişleri için)`,`Tahta kalemi ve yapışkan not kâğıtları (post-it)`,`Kültür Portalı ve TDK Dîvânu Lugâti't-Türk çevrim içi kaynağı`],durationMinutes:40,steps:{preparation:`Ders öncesinde akıllı tahtaya Kaşgarlı Mahmud’un çizdiği ilk dünya haritası ve modern dilsiz Avrasya Türk Dünyası haritası yansıtılır. Balasagun, Kaşgar ve Ötüken merkezleri işaretlenir.`,introduction:`Dakika 00 - 06: Öğretmen tahtaya Kaşgarlı Mahmud'un şu meşhur hadis-i şerif naklini yazar: "And içerek öğrendim ki ulu Tanrı devlet güneşini Türk burçlarında doğdurdu..." Öğretmen: "Kaşgarlı Mahmud, at sırtında 15 yıl boy boy gezerek Türkçenin ilk sözlüğünü ve coğrafya haritasını yazdı. Bugün o kelimelerin haritasını çıkarıyoruz." der.`,execution:`Dakika 06 - 22: Sınıf 4'er kişilik masalara ayrılır. Her gruba aşağıdaki çalışma kâğıdında yer alan 3 ana Karahanlı kavramı (ERDEM, SAV, KUT) verilir. Öğrenciler 11. yüzyıl Dîvân savlarındaki orijinal dizeyi günümüz Türkçesiyle karşılaştırır.`,reinforcement:`Dakika 22 - 32: Grup sözcüleri tahtaya çıkarak kelimelerini haritada Kaşgar ve Balasagun noktalarına yapıştırır. "Erdem başı til" ifadesinin günümüz felsefesiyle bağı sınıfta tartışılır.`,conclusion:`Dakika 32 - 40: Tahtadaki canlı harita fotoğraflanır; fişler sınıf panosuna "1074'ten Günümüze Kelime Köprümüz" başlığıyla asılır.`},exampleData:{title:`Dîvânu Lugâti't-Türk Özgün Kelime Fişleri`,description:`Kaşgarlı Mahmud’un eserinden birebir taranmış kadim maddeler:`,type:`general`,cards:[{title:`Erdem (ئەردەم)`,subtitle:`Dîvân Cilt I, Sayfa 106`,content:`11. Yüzyıl Anlamı: Edep, terbiye, hüner, fazilet, ahlak ve mertlik.`,subContent:`Örnek Dîvân Savı: "Erdem başı til" (Erdemin başı, faziletin temeli dildir).`},{title:`Sav (ساو)`,subtitle:`Dîvân Cilt III, Sayfa 441`,content:`11. Yüzyıl Anlamı: Atasözü, hikmetli söz, mesaj, haber.`,subContent:`Örnek Dîvân Savı: "Aç ne yemez, tok ne demez." (Aç ayırt etmeden yer, tok düşünmeden konuşur).`},{title:`Kut (قوت)`,subtitle:`Dîvân Cilt I, Sayfa 320`,content:`11. Yüzyıl Anlamı: İlahi baht, saadet, uğur ve devleti adaletle yönetme gücü.`,subContent:`Günümüz Bağı: "Kutlu", "Kutsal", "Kutlama" kelimelerinin yaşayan ana köküdür.`}]},printableWorksheet:{title:`DÎVÂNU LUGÂTİ'T-TÜRK CANLI HARİTA VE ETİMOLOJİ ÇALIŞMA KÂĞIDI`,subtitle:`11. Yüzyıl Karahanlı Türkçesinden Günümüze Kelime Köprüsü`,instructions:`Aşağıdaki soruları ve çözüm kutularını Kaşgarlı Mahmud'un eseri doğrultusunda cevaplayınız.`,studentHeader:!0,contentHtmlOrText:`ÖĞRENCİNİN ADI SOYADI: .................................................... SINIF: ........ NO: ........

1. KELİME ANALİZİ: ERDEM (ئەردەم)
   • Eserdeki Anlamı: Edep, ahlak, hüner, fazilet, yiğitlik.
   • Eserde Geçen Sav: "Erdem başı til."
   • Soru: Kaşgarlı Mahmud bu atasözünde erdemin başı olarak neden "dil"i görmüştür?
     Cevabınız: ....................................................................................................................

2. KELİME ANALİZİ: SAV (ساو)
   • Eserdeki Anlamı: Atasözü, bilgece söz, ileti, haber.
   • Soru: "Sav" sözcüğü günümüz hukuk terminolojisindeki "savcı" ve "savunma" kavramlarına nasıl evrilmiştir?
     Cevabınız: ....................................................................................................................

3. KELİME ANALİZİ: KUT (قوت)
   • Eserdeki Anlamı: İlahi lütuf, talih, saadet, devlet kurma yetisi.
   • Görev: Günümüzde "kut" kökünden türeyen 3 farklı kelimeyi ve bunların cümle içindeki kullanımını yazınız:
     1) ............................................................................................................................
     2) ............................................................................................................................
     3) ............................................................................................................................`},answerKey:{title:`Dîvânu Lugâti't-Türk Öğretmen Çözüm ve Cevap Anahtarı`,subtitle:`Akademik ve Etimolojik Değerlendirme Kılavuzu`,solutions:[{questionOrItem:`1. Soru: Kaşgarlı Mahmud erdemin başı olarak neden "dil"i görmüştür?`,correctAnswer:`Dil, insanın iç dünyasını, ahlakını ve aklını dışa vuran en temel araçtır. Sözünü terbiye edemeyen insan, erdemli ve faziletli bir şahsiyet inşa edemez. "Kişinin değeri dilinin altında gizlidir" anlayışıyla birebir örtüşür.`,pedagogicalExplanation:`Öğrencinin dil ile ahlak arasındaki doğrudan ilişkiyi kurması beklenir.`,tdkOrSourceReference:`Dîvânu Lugâti't-Türk, Cilt I, s. 106; Besim Atalay çevirisi.`},{questionOrItem:`2. Soru: "Sav" sözcüğünün günümüz hukuk kavramlarına ("savcı", "savunma") evrilmesi:`,correctAnswer:`"Sav", eski Türkçede bir iddia, ileri sürülen tez ve bildirilen haberdir. Hukukta savcı, kamu adına iddiayı ileri süren kişidir; savunma ise bu iddiaya karşı sunulan sözdür. Kök anlamı olan "söz/iddia" anlamını koruyarak terimleşmiştir.`,pedagogicalExplanation:`Kelimelerin soyuttan hukuki terime dönüşme sürecini gösterir.`,tdkOrSourceReference:`TDK Güncel Türkçe Sözlük & Doğan Aksan, Anlambilim.`},{questionOrItem:`3. Görev: "Kut" kökünden türeyen 3 kelime ve cümle:`,correctAnswer:`1) Kutlu: "Yeni eğitim yılımız kutlu olsun." 2) Kutsal: "Vatan toprağı milletimiz için kutsaldır." 3) Kutlamak: "Öğrencimizin başarısını hep birlikte kutladık."`,pedagogicalExplanation:`Öğrencinin kök ve ek türetme mekanizmasını doğru kavraması gerekir.`,tdkOrSourceReference:`TDK Türk Dil Bilgisi & Kubbealtı Lugatı.`}],teacherEvaluationCriteria:[`Kelimelerin Karahanlı dönemi bağlamı ile günümüz bağlamının doğru ilişkilendirilmesi`,`Sav kavramının atasözü manasının açıkça belirtilmesi`,`Harita üzerindeki coğrafi yerleşimin doğru yapılmış olması`]},specialEdNotes:`Özel eğitim öğrencilerine kelimelerin yazılı olduğu büyük puntolu fişler verilir; haritaya raptiyeleme veya tahtaya yapıştırma görevi bu öğrencilere tevdi edilir.`,officialWarnings:`Kaşgarlı Mahmud’un 1074 tarihli eserinin orijinal haritasında doğunun yukarıda, batının aşağıda olduğu öğrencilere özellikle hatırlatılmalıdır.`,isClassroomActivity:!0,sampleReportSummary:`Dîvânu Lugâti't-Türk Canlı Harita Çalışması kapsamında öğrencilerimiz Kaşgarlı Mahmud’un abide eserindeki kadim kelimeleri araştırmış; kelimelerin günümüz Türkçesindeki karşılıkları ve coğrafi yayılımları harita üzerinde görselleştirilerek sınıf panosunda sergilenmiştir.`},{id:`ekim-3`,code:`3.2`,month:`Ekim`,weekLabel:`3. Hafta (19 - 23 Ekim 2026)`,title:`"Anlamını Bul" Panosu ve Dijital Kelime Avı`,category:`Sözlük Okuma ve Dijitalleşme`,startDate:`19.10.2026`,endDate:`23.10.2026`,targetAudience:`9, 10, 11 ve 12. Sınıf Öğrencileri`,responsible:`Türk Dili ve Edebiyatı Zümresi`,summary:`Okul ilan panosuna ve etkileşimli tahtaya yerleştirilen yönlendirici ipuçlarıyla haftanın kelimelerinin keşfedilmesi, TDK sözlüğünden tespiti ve sınıf kelime duvarı oluşturulması.`,objective:`Öğrencilerin bağlamdan hareketle kelime anlamı tahmin etme, TDK sözlüklerinden doğrulama ve kelimeleri cümle içinde kullanma becerilerini geliştirmek.`,eOkul:{alan:`Dil ve Edebiyat`,kategori:`Söz Varlığı Geliştirme`,etkinlikTuru:`Pano ve Dijital Kelime Çalışması`,kazanimMetni:`Metin bağlamında anlamı bilinmeyen kelimelerin anlamını TDK sözlüklerinden araştırarak doğru bağlamda kullanır.`},materials:[`Etkileşimli akıllı tahta (TDK Sözlük arama sayfası açık)`,`Renkli yapışkan notlar (post-it) veya A4 şerit kâğıtlar`,`Tahta kalemi`,`Sınıf veya koridor panosu`],durationMinutes:40,steps:{preparation:`Öğretmen ders öncesinde panoya veya tahtanın sol köşesine "HAFTANIN GİZEMLİ KELİMELERİ" başlığı altında sadece yönlendirici ipuçlarını yazar.`,introduction:`Dakika 00 - 07: Öğretmen tahtadaki ilk ipucunu okur: "Bir şahsın veya eserin benzerlerinden apayrı, kural dışı ve üstün tutulması durumu nedir?" Öğrencilerden tahminler alınır.`,execution:`Dakika 07 - 25: Öğretmen kelimenin ilk harfini açar: "M _ _ _ _ _ _ A". Öğrenciler akıllı tahtadan veya cep telefonlarından sözlük.gov.tr adresine girerek "MÜSTESNA" kelimesine ulaşır. Ardından ikinci kelime "DİRAYET" ve üçüncü kelime "VAKUR" için aynı av başlatılır.`,reinforcement:`Dakika 25 - 35: Her öğrenci bulduğu kelimelerden en az ikisini kullanarak kendi hayatından veya okuduğu bir kitaptan özgün bir cümle kurar ve renkli post-it kâğıdına yazar.`,conclusion:`Dakika 35 - 40: Yazılan kâğıtlar tahtadaki "Kelime Duvarı"na yapıştırılır; en ahenkli cümle alkışlanarak haftanın cümlesi seçilir.`},exampleData:{title:`Haftanın "Kelime Avı" Hedef Kartları`,description:`Öğrencilerin sözlükte arayıp keşfedeceği gerçek kelimeler:`,type:`general`,cards:[{title:`Müstesna (مستثنى)`,subtitle:`Arapça Kökenli Sıfat`,content:`TDK Tanımı: Bir bütünün veya kuralın dışında tutulan, benzerlerinden üstün, kural dışı, ayrıcalıklı.`,sampleSentence:`"Onun Türk edebiyatındaki zarif ve sade üslubu her zaman müstesnadır."`},{title:`Dirayet (درايت)`,subtitle:`Arapça Kökenli İsim`,content:`TDK Tanımı: Bir işi kavrayıp üstesinden gelebilme yeteneği, kavrayış gücü, zekâ ve dirayetli olma.`,sampleSentence:`"Zorluklar karşısında gösterdiği dirayet ve sabır, tüm gençlere ilham kaynağı oldu."`},{title:`Vakur (وقور)`,subtitle:`Arapça Kökenli Sıfat`,content:`TDK Tanımı: Ağırbaşlı, onurlu, temkinli ve vakar sahibi duruş.`,sampleSentence:`"Haksız ithamlar karşısında daima vakur bir sükûneti muhafaza etti."`}]},printableWorksheet:{title:`"ANLAMINI BUL" KELİME AVI ÖĞRENCİ ÇALIŞMA KÂĞIDI`,subtitle:`TDK Güncel Türkçe Sözlük Taraması`,instructions:`Aşağıdaki ipuçlarını okuyarak aranan kelimeyi bulunuz; TDK anlamını ve kurduğunuz özgün cümleyi ilgili alana yazınız.`,studentHeader:!0,contentHtmlOrText:`ÖĞRENCİNİN ADI SOYADI: .................................................... SINIF: ........ NO: ........

nce:`10, 11 ve 12. Sınıf Öğrencileri`,responsible:`Türk Dili ve Edebiyatı Öğretmeni`,summary:`Klasik Türk edebiyatı eserlerinden unutulmaya yüz tutmuş veya anlam daralmasına/genişlemesine uğramış kelimelerin etimolojik kazısının yapılması ve QR kodlu panoya dönüştürülmesi.`,objective:`Edebî metinlerdeki kelimelerin tarihî değişimini inceleyerek dilin yaşayan bir varlık olduğunu kavramak; karekod destekli dijital sergi oluşturmak.`,eOkul:{alan:`Kültür ve Sanat`,kategori:`Edebi İnceleme`,etkinlikTuru:`Kelime Arkeolojisi ve Sergi`,kazanimMetni:`Klasik metinlerde yer alan kelimelerin tarihî anlam değişimlerini ve edebî sanatlardaki işlevlerini çözümler.`},materials:[`Etkileşimli akıllı tahta (İnternet bağlantısı ile ücretsiz QR kod üretici)`,`A4 kâğıdı ve renkli kartonlar`,`TDK Yeni Tarama Sözlüğü veya Kubbealtı Lugatı`,`Tahta kalemi`],durationMinutes:40,steps:{preparation:`Öğretmen Orhun Yazıtları'ndan günümüze anlam değişmesine uğramış 3 anahtar kelimeyi (YAVUZ, EMEK, UCUZ) tahtaya yazar.`,introduction:`Dakika 00 - 06: "Bir kelime zamanla kötü bir anlamdan iyi bir anlama dönebilir mi?" sorusuyla ders açılır. Yavuz Sultan Selim'in adındaki 'yavuz' sözcüğünün 1300 yıl önce ne anlama geldiği sorulur.`,execution:`Dakika 06 - 25: Öğrenciler dağıtılan çalışma kâğıdındaki kelimelerin tarihî kazısını yapar. Yavuz kelimesinin Orhun Yazıtları'nda "kötü, fena, yaramaz" anlamına geldiğini, zamanla "yiğit, mert, güçlü" manasına evrildiğini incelerler.`,reinforcement:`Dakika 25 - 35: Akıllı tahtada bu kelimelerin araştırma notları için ücretsiz bir QR kod oluşturulur ve hazırlanan A4 kâğıtlarının köşesine yapıştırılır.`,conclusion:`Dakika 35 - 40: Kartlar okul panosuna asılır; diğer sınıfların teneffüslerde telefonlarıyla QR kodları okutarak sergiye ulaşması sağlanır.`},exampleData:{title:`Tarihî Anlam Değişimi Kazı Kartları`,description:`Etimolojik kazısı yapılan gerçek Türkçe sözcükler:`,type:`general`,cards:[{title:`Yavuz (Eski Türkçe: Yabız)`,subtitle:`8. Yüzyıl Orhun Abideleri`,content:`Eski Anlam: Kötü, fena, yaramaz, güçsüz, sefil.`,subContent:`Anlam İyileşmesi: Zamanla korkusuz, gözü pek, celalli, yiğit ve yenilmez anlamına yükselmiştir.`},{title:`Emek (Eski Türkçe: Emgek)`,subtitle:`Uygur ve Karahanlı Metinleri`,content:`Eski Anlam: Eziyet, cefa, zahmet, keder, işkence.`,subContent:`Anlam İyileşmesi: Alın teri, bir işi başarmak için sarf edilen saygın bedeni ve fikrî çabaya dönüşmüştür.`},{title:`Ucuz (Eski Türkçe: Uçuz)`,subtitle:`Divanü Lugati't-Türk`,content:`Eski Anlam: Kolay, ehemmiyetsiz, değersiz, hor görülen.`,subContent:`Anlam Daralması: Günümüzde yalnızca ekonomik açıdan pahalı olmayan manasına daralmıştır.`}]},printableWorksheet:{title:`KLASİK METİNLERLE KELİME ARKEOLOJİSİ ÇALIŞMA FORMU`,subtitle:`Eski Türkçeden Günümüze Anlam Değişimi Raporu`,instructions:`Aşağıdaki kelimelerin tarihî yolculuğunu inceleyerek ilgili alanları doldurunuz.`,studentHeader:!0,contentHtmlOrText:`ÖĞRENCİNİN ADI SOYADI: .................................................... SINIF: ........ NO: ........

   • Cümleniz: ....................................................................................................................`},answerKey:{title:`Kelime Arkeolojisi Öğretmen Çözüm ve Cevap Anahtarı`,subtitle:`Etimolojik Anlam Olayları Tahlili`,solutions:[{questionOrItem:`1. Kelime: YAVUZ (Yabız) Anlam Değişim Türü`,correctAnswer:`ANLAM İYİLEŞMESİ (Melioration)`,pedagogicalExplanation:`Eski Türkçede "kötü, zayıf, fena" olan sözcük, mertlik ve korkusuzluk vasıflarıyla birleşerek padişah unvanına kadar yükselmiş, olumlu bir mana kazanmıştır.`,tdkOrSourceReference:`Prof. Dr. Muharrem Ergin, Orhun Âbideleri & TDK Tarihî Türkiye Türkçesi Sözlüğü.`},{questionOrItem:`2. Kelime: EMEK (Emgek) Anlam Değişim Türü`,correctAnswer:`ANLAM İYİLEŞMESİ VE KAVRAM GENİŞLEMESİ`,pedagogicalExplanation:`"Eziyet, işkence, çile" anlamından arınarak saygın bir değer olan "alın teri, hak edilmiş kazanç ve bedeni/fikrî çaba" anlamına yükselmiştir.`,tdkOrSourceReference:`TDK Yeni Tarama Sözlüğü & Kubbealtı Lugatı.`}],teacherEvaluationCriteria:[`Anlam değişimi türünün (iyileşme, daralma, genişleme) doğru adlandırılması`,`Tarihî kaynak adının (Orhun Yazıtları, Dîvânu Lugâti't-Türk) doğru belirtilmesi`,`QR kodlu panonun estetik ve okunabilir tasarımı`]},specialEdNotes:`Özel eğitim öğrencilerine kelimelerin eski ve yeni anlamlarını gösteren eşleştirme şablonu verilir.`,officialWarnings:`Kelimelerin etimolojik kökeninde spekülatif yorumlardan kaçınılmalı, TDK ve TTK kaynakları referans gösterilmelidir.`,isClassroomActivity:!0,sampleReportSummary:`Klasik Metinlerle Kelime Arkeolojisi çalışmasında öğrencilerimiz köklü kelimelerimizin geçirdiği tarihî ve anlamsal değişimleri incelemiş, QR kod destekli etkileşimli bir okul panosu hazırlayarak tüm okulun erişimine sunmuştur.`},{id:`kasim-1`,code:`4.1`,month:`Kasım`,weekLabel:`1. Hafta (02 - 06 Kasım 2026)`,title:`"Kadim Kelimeler" Tabu Turnuvası`,category:`Kadim Sözler ve Oyunlaştırma`,startDate:`02.11.2026`,endDate:`06.11.2026`,targetAudience:`9, 10, 11 ve 12. Sınıf Öğrencileri`,responsible:`Türk Dili ve Edebiyatı Öğretmeni`,summary:`Köklü kültürel geçmişe sahip kadim Türkçe kelimelerin, belirlenen yasaklı sözcükler kullanılmadan takımlara anlatıldığı heyecanlı sınıf içi yarışma.`,objective:`Öğrencilerin kelime dağarcığını harekete geçirerek dolaylı anlatım, çağrışım kurma, eş anlamlıları etkin kullanma ve topluluk önünde hızlı düşünme becerisini geliştirmek.`,eOkul:{alan:`Dil ve Konuşma Becerileri`,kategori:`Eğitsel Oyunlar`,etkinlikTuru:`Tabu Turnuvası`,kazanimMetni:`Kültürel derinliğe sahip sözcükleri yasaklı kavramlara başvurmadan alternatif ifadeler ve mecazlarla açıklar.`},materials:[`Etkileşimli akıllı tahta (Dahili 60 saniyelik sayaç)`,`Yazdırılmış ve makasla kesilmiş Tabu Kartları (Aşağıdaki hazır şablondan)`,`Tahta kalemi (Puan tablosu için)`],durationMinutes:40,steps:{preparation:`Ders öncesinde aşağıdaki baskıya hazır "Kadim Kelimeler Tabu Kartları" A4 kâğıdına yazdırılıp çizgilerinden kesilerek 6 adet deste kartı oluşturulur.`,introduction:`Dakika 00 - 05: Sınıf A Takımı ve B Takımı olarak ortadan ikiye ayrılır. Tahtaya puan tablosu çizilir. Öğretmen: "En üstteki kadim sözcüğü takımınıza anlatacaksınız. Ancak altındaki 4 YASAKLI kelimeyi ve bunların türevlerini asla ağzınıza alamazsınız! Süreniz tam 60 saniye."`,execution:`Dakika 05 - 30: A takımından bir anlatıcı tahtaya çıkar, B takımından bir öğrenci anlatıcının arkasında durarak yasaklı kelimeleri denetler. 60 saniyede anlatılan her doğru kelime 1 puan, ihlal edilen yasak kelime -1 puan yazar. Sırayla takımlar yarışır.`,reinforcement:`Dakika 30 - 37: Pas geçilen veya anlatılamayan kelimelerin TDK anlamı tahtaya yansıtılır; kelimenin edebî örnek cümlesi sınıfa sesli okutulur.`,conclusion:`Dakika 37 - 40: Puanlar toplanır; kazanan takım alkışlanır ve turnuva kelimeleri defterlere sözlükçe olarak işlenir.`},exampleData:{title:`Kadim Kelimeler Tabu Kartları (Tam ve Eksiksiz)`,description:`Sınıfta kesip doğrudan oynatabileceğiniz hazır tabu kartları:`,type:`tabu`,cards:[{title:`FERÂGAT`,subtitle:`Arapça Kökenli Kadim Sözcük`,content:`TDK Anlamı: Hakkından kendi isteğiyle vazgeçme, özveri, feragat etme.`,forbiddenWords:[`Vazgeçmek`,`Hak`,`Fedakârlık`,`Bırakmak`],sampleSentence:`"Vatan müdafaasında gösterdiği ferâgat ve metanet her türlü takdirin üzerindedir."`},{title:`MÜTEBESSİM`,subtitle:`Arapça Kökenli Kadim Sözcük`,content:`TDK Anlamı: Gülümseyen, güleç yüzlü, tebessüm eden kimse.`,forbiddenWords:[`Gülmek`,`Yüz`,`Tebessüm`,`Mutlu`],sampleSentence:`"Sınıfa giren hocanın mütebessim çehresi en gergin anları dahi yumuşatırdı."`},{title:`HÜSNÜNİYET`,subtitle:`Arapça Kökenli Kadim Sözcük`,content:`TDK Anlamı: İyi niyet, samimiyet, kalpte kötülük beslememe durumu.`,forbiddenWords:[`İyi`,`Niyet`,`Kalp`,`Düşünce`],sampleSentence:`"İki dost arasındaki mesele hüsnüniyet ve tatlı dille tatlıya bağlandı."`},{title:`İTİDAL`,subtitle:`Arapça Kökenli Kadim Sözcük`,content:`TDK Anlamı: Aşırılıktan uzak durma, ölçülülük, soğukkanlılık, denge.`,forbiddenWords:[`Denge`,`Sakin`,`Aşırı`,`Ölçü`],sampleSentence:`"En fırtınalı hadiselerde dahi itidalini koruyan insanlar cemiyete yön verir."`},{title:`KADİRŞİNAS`,subtitle:`Farsça Kökenli Kadim Sözcük`,content:`TDK Anlamı: İyilik unutmayan, değer bilir, kıymet bilen, vefalı kimse.`,forbiddenWords:[`Değer`,`Kıymet`,`Vefa`,`İyilik`],sampleSentence:`"Kendisine emek veren öğretmenini yıllar sonra arayan kadirşinas bir gençti."`},{title:`TEFEKKÜR`,subtitle:`Arapça Kökenli Kadim Sözcük`,content:`TDK Anlamı: Bir konu üzerinde derinlemesine düşünme, zihni yorma, hikmeti arama.`,forbiddenWords:[`Düşünmek`,`Akıl`,`Fikir`,`Kafa`],sampleSentence:`"Gecenin sükûnetinde kâinatın sırlarına dair derin bir tefekküre daldı."`}]},printableWorksheet:{title:`KADİM KELİMELER TABU OYUNU KESİLEBİLİR KART ŞABLONU (A4)`,subtitle:`Sınıf İçi Turnuva İçin Çizgilerden Kesiniz`,instructions:`Bu sayfayı yazdırıp kesik çizgilerden keserek 6 adet oyun kartı elde ediniz.`,studentHeader:!1,contentHtmlOrText:`+-------- eekLabel:`2. Hafta (09 - 13 Kasım 2026)`,title:`"Yapay Zekânın Gözünden Kadim Sözler" Dijital Sergisi`,category:`Kadim Sözler ve Yapay Zekâ`,startDate:`02.11.2026`,endDate:`06.11.2026`,targetAudience:`9-12. Sınıf Öğrencileri`,responsible:`Türk Dili ve Edebiyatı & Bilişim Öğretmeni`,summary:`Öğrencilerin bir atasözü veya kadim kelimenin arkasındaki soyut anlam dünyasını etik görsel yapay zekâ komutlarıyla betimlemesi ve dijital sergiye dönüştürmesi.`,objective:`Geleneksel söz varlığı ile modern yapay zekâ teknolojisini harmanlamak; prompt yazarlığı, etik teknoloji kullanımı ve estetik yorumlama becerisi kazanmak.`,eOkul:{alan:`Kültür ve Sanat`,kategori:`Dijital Sanat ve Edebiyat`,etkinlikTuru:`Yapay Zekâ Görsel Sergisi`,kazanimMetni:`Kadim kelime ve atasözlerinin mecaz boyutunu kavrar, yapay zekâ araçlarıyla sanatsal komut oluşturarak görselleştirir.`},materials:[`Etkileşimli akıllı tahta (Öğretmen gözetiminde güvenli mod)`,`Veli İzin ve Açık Rıza Dilekçeleri (Uygulamamızdaki matbu şablondan)`,`A4 kâğıdı (Prompt tasarım taslakları için)`,`TDK Atasözleri ve Deyimler Sözlüğü`],durationMinutes:40,steps:{preparation:`Öğretmen sınıfa girmeden önce velilerden KVKK Veli İzin Formlarını toplar. Akıllı tahtada güvenli ve ücretsiz bir görsel üretim aracı açılır.`,introduction:`Dakika 00 - 07: Öğretmen tahtaya "Kem âlât ile kemâlât olmaz" atasözünü yazar. "Bu bilgece sözü bir ressama anlatsaydınız ona ne çizdirirdiniz? Şimdi ressamımız bir yapay zekâ modeli; ona doğru kelimelerle tarif etmeliyiz." der.`,execution:`Dakika 07 - 25: Öğrenciler ikişerli eşleşir. Dağıtılan çalışma kâğıdında seçtikleri sözün anahtar kavramlarını (ışık, atmosfer, renk, Selçuklu motifi, bozkır, nar ağacı) Türkçe olarak kaleme alırlar. Öğretmen seçilen en estetik promptu tahtada üretir.`,reinforcement:`Dakika 25 - 35: Çıkan görsel incelenir; görselin altına sözün TDK anlamı, kaynakçası ve öğrencinin 2 cümlelik felsefi yorumu eklenerek dijital sergi slaytına eklenir.`,conclusion:`Dakika 35 - 40: Hazırlanan 10 görsel okul web sitesine ve okul girişindeki dijital bilgilendirme ekranına yüklenir.`},exampleData:{title:`Yapay Zekâ İçin Hazır Türkçe Prompt Şablonları`,description:`Sınıfta doğrudan kullanabileceğiniz test edilmiş komutlar:`,type:`prompt`,cards:[{title:`Söz: "Gönül Bağı"`,subtitle:`Kavram: Muhabbet ve Manevi Yakınlık`,content:`Türkçe Prompt: "Geleneksel Türk ebru sanatı ve tezhip motifleriyle bezenmiş, iki eski ahşap konak arasında altın sarısı ve zümrüt yeşili ipek ipliklerle dokunmuş, sıcak gün batımı ışığında parıldayan soyut bir gönül bağı kompozisyonu, yağlı boya dokusu, yüksek sanatsal estetik."`,sampleSentence:`TDK Anlamı: İki insan arasındaki içten sevgi, manevi yakınlık ve muhabbet.`},{title:`Söz: "Sabır Acıdır, Meyvesi Tatlıdır"`,subtitle:`Kavram: İtidâl ve Sebat`,content:`Türkçe Prompt: "Karakışın ortasında buz tutmuş sarp kayalık bir Anadolu dağ yamacında kök salmış, fırtınaya direnen asırlık bir nar ağacının baharın gelişiyle birlikte açan parlak kırmızı çiçekleri ve olgunlaşan yakut gibi nar taneleri, umut ve sabır metaforu, sinematik ışık."`,sampleSentence:`TDK Anlamı: Güçlüklere katlanmak başta zor gelse de neticesi huzur ve başarıdır.`},{title:`Söz: "Kem Âlât ile Kemâlât Olmaz"`,subtitle:`Kavram: Ahlak ve Usul`,content:`Türkçe Prompt: "Kırık dökük, paslı aletlerle sağlam bir kütüphane inşa etmeye çalışan ancak aletler kırıldıkça gerçeği anlayan bir ustanın önünde duran pirinçten kusursuz bir kumpas ve altın cetvel, hikmet ve ölçü metaforu, klasik yağlı boya tablo tarzı."`,sampleSentence:`TDK Anlamı: Kötü vasıtalarla ve hileyle mükemmel bir sonuca ulaşılamaz.`}]},printableWorksheet:{title:`YAPAY ZEKÂ PROMPT (KOMUT) TASARIM ÇALIŞMA KÂĞIDI`,subtitle:`Kadim Sözleri Görsele Dönüştürme Formu`,instructions:`Seçtiğiniz kadim sözü analiz ederek yapay zekâya verilecek görsel komutu oluşturunuz.`,studentHeader:!0,contentHtmlOrText:`ÖĞRENCİNİN ADI SOYADI: .................................................... SINIF: ........ NO: ........

abel:`1. Hafta (01 - 04 Aralık 2026)`,title:`"Yapay Zekâda Türkçenin Doğru Kullanımı" Tasarım Yarışması`,category:`Sosyal Medya ve Dil Bilinci`,startDate:`01.12.2026`,endDate:`04.12.2026`,targetAudience:`9, 10, 11 ve 12. Sınıf Öğrencileri`,responsible:`Türk Dili ve Edebiyatı Zümresi`,summary:`Sosyal medya ve mesajlaşmalardaki yazım, imla ve yabancı kelime özentisi hatalarını tespit ederek doğru kullanımları karşılaştıran infografik ve afiş tasarımları hazırlanması.`,objective:`Dijital mecralardaki dil yozlaşmasına karşı farkındalık geliştirmek; alaycı ve kırıcı olmayan, yapıcı ve eğitici bir dille doğru kullanımı teşvik etmek.`,eOkul:{alan:`Toplum Hizmeti ve İletişim`,kategori:`Bilinçlendirme ve Tasarım`,etkinlikTuru:`İnfografik ve Afiş Tasarımı`,kazanimMetni:`Dijital mecralardaki imla ve dil yanlışlarını tespit eder; yapıcı karşılaştırmalı içerik tasarlar.`},materials:[`A4 fotokopi kâğıdı veya resim kâğıdı`,`Kırmızı ve yeşil renkli tahta kalemleri`,`TDK Güncel Yazım Kılavuzu`,`Akıllı tahta`],durationMinutes:40,steps:{preparation:`Öğretmen tahtayı dikey bir çizgiyle ikiye böler. Sol tarafa kırmızı kalemle "❌ DİJİTALDE YAPILAN YANLIŞLAR", sağ tarafa yeşil kalemle "✅ TÜRKÇESİ VE DOĞRUSU" yazar.`,introduction:`Dakika 00 - 05: Öğretmen sınıfa sorar: "Dün WhatsApp veya Instagram mesajlarınızda kaç tane kısaltma ya da yabancı kelime kullandınız? Dilimiz sessiz harf yığınına mı dönüyor?"`,execution:`Dakika 05 - 25: Öğrencilere aşağıdaki çalışma kâğıdı dağıtılır. "Aynen, tşk, kib, ricalar, ignore etmek, skip geçmek, şarjım bitti" gibi 6 yaygın hata tahlil edilir. Öğrenciler karşılarına kural gerekçesini ve Türkçe karşılığını yazar.`,reinforcement:`Dakika 25 - 35: İkişerli gruplar bu yanlışları içeren "Farkındalık Kartı" tasarlar.`,conclusion:`Dakika 35 - 40: Tasarımlar sınıf panosuna asılır; en yapıcı ve zarif tasarım okul panosuna seçilir.`},exampleData:{title:`Dijital İmla ve Söz Varlığı Karşılaştırma Rehberi`,description:`Öğrencilerin afişlerinde kullanacağı gerçek dil hataları:`,type:`dictionary`,cards:[{title:`❌ "Herşey yolunda, sende gel"`,subtitle:`Ayrı Yazılan Kelimeler ve Ekler`,content:`✅ DOĞRUSU: "Her şey yolunda, sen de gel."`,sampleSentence:`Kural: "Şey" sözcüğü her zaman ayrı yazılır. Cümleden çıkarıldığında anlam bozulmayan "de" bağlaçtır ve ayrı yazılır.`},{title:`❌ "Bu toplantıyı set edelim / finalize edelim"`,subtitle:`Yabancı Fiil Özentisi`,content:`✅ DOĞRUSU: "Bu toplantıyı ayarlayalım / kararlaştıralım / sonuçlandıralım."`,sampleSentence:`Kural: Türkçemiz iş, hareket ve oluş bildirmede dünyanın en zengin ek ve fiil yapısına sahiptir.`},{title:`❌ "Telefonumun şarzı bitti"`,subtitle:`Ses ve Telaffuz Bozulması`,content:`✅ DOĞRUSU: "Telefonumun şarjı bitti."`,sampleSentence:`Kural: Fransızca "charge" kökünden dilimize giren sözcük son hecede "j" sesiyle yazılır ve söylenir.`}]},printableWorksheet:{title:`DİJİTAL DİL YANLIŞLARI VE DOĞRULARI ÇALIŞMA KÂĞIDI`,subtitle:`Türkçenin Doğru Kullanımı İnfografik Taslak Formu`,instructions:`Aşağıdaki tabloda verilen dijital dil yanlışlarının kuralını ve Türkçesini doldurunuz.`,studentHeader:!0,contentHtmlOrText:`ÖĞRENCİNİN ADI SOYADI: .................................................... SINIF: ........ NO: ........

lanılması`,`Tasarımda renk ve imla uyumunun sağlanması`]},specialEdNotes:`Özel eğitim öğrencilerine doğru ve yanlış kelimelerin yer aldığı renkli eşleştirme şablonu verilir.`,officialWarnings:`Tasarımlarda kişileri hedef gösteren, alaycı ve kırıcı bir dil kullanılmamalı; yapıcı farkındalık dili esas alınmalıdır.`,isClassroomActivity:!0,sampleReportSummary:`"Yapay Zekâda Türkçenin Doğru Kullanımı" afiş tasarımı etkinliğinde öğrencilerimiz dijital platformlarda sık yapılan imla ve kelime hatalarını tespit ederek eğitici infografikler üretmiştir.`},{id:`aralik-2`,code:`5.2`,month:`Aralık`,weekLabel:`2. Hafta (07 - 11 Aralık 2026)`,title:`"Dijital Sözlük" Kısa Video Serisi`,category:`Sosyal Medya ve Dijital Üretim`,startDate:`07.12.2026`,endDate:`11.12.2026`,targetAudience:`9-12. Sınıf Öğrencileri`,responsible:`Türk Dili ve Edebiyatı Öğretmeni`,summary:`Öğrencilerin seçilen kelimelerin doğru telaffuzu, anlamı ve edebî örnek cümlesini içeren 30-45 saniyelik dinamik videoları akıllı telefon ses kaydedicisi ve kamerasıyla okulda hazırlaması.`,objective:`Öğrencilerin sözlü iletişim, diksiyon, telaffuz ve video kurgu becerilerini geliştirerek okul dijital sözlük arşivini oluşturmak.`,eOkul:{alan:`Medya ve İletişim`,kategori:`Dijital İçerik Üretimi`,etkinlikTuru:`Kısa Video Çekimi ve Sözlükçülük`,kazanimMetni:`Kelimenin fonetik telaffuzunu, etimolojisini ve örnek bağlamını içeren eğitici kısa video içerikleri üretir.`},materials:[`Öğrenci cep telefonu kamerası ve dahili ses kaydedicisi (Sessiz kütüphane ortamında çekilir)`,`Okul Kütüphanesi kitap rafları (Doğal arka plan olarak kullanılır)`,`Baskıya hazır video senaryo metni (Aşağıdaki hazır şablondan)`,`KVKK Veli İzin Formları`],durationMinutes:40,steps:{preparation:`Öğretmen okul kütüphanesinde çekim için sessiz bir köşe ayarlar. Yaka mikrofonu aranmaz; telefon göğüs hizasında 40 cm mesafede tutularak net ses kaydı alınır.`,introduction:`Dakika 00 - 05: Öğretmen sınıfta "Bugün 45 saniyede TEVAZU kelimesini öyle bir anlatacağız ki izleyen herkes doğru telaffuz edecek." der.`,execution:`Dakika 05 - 25: Öğrenciler ikişerli eşleşir (biri konuşur, biri telefonu sabit tutarak çeker). Aşağıdaki 4 adımlı çekim senaryosu uygulanır:

• 35-45 sn: Kapanış.`,reinforcement:`Dakika 25 - 35: Çekilen videolar sınıfta akıllı tahtada izlenir; ses netliği ve diksiyon öğretmen tarafından değerlendirilir.`,conclusion:`Dakika 35 - 40: En başarılı video veli onayıyla okulun resmî sosyal medya hesabına ve dijital panosuna iletilir.`},exampleData:{title:`30-45 Saniyelik Kelime Videosu Çekim Planı`,description:`Öğrencilerin kütüphanede uygulayacağı tam video akışı:`,type:`general`,cards:[{title:`Kelime 1: TEVAZU (تواضع)`,subtitle:`Süre: 40 Saniye • Mekân: Okul Kütüphanesi`,content:`Konuşma Metni: "Merhaba! Günlük hayatta sıkça 'tevazi' diye yanlış kullanılan bu kelimenin doğrusu 'tevazu'dur. İlk hece kısa, ikinci hece uzatılarak söylenir: Te-vâ-zu. Anlamı ise alçak gönüllülüktür. Mehmet Âkif şöyle der: 'Büyük insanların en belirgin ziyneti tevazudur.' Türkçemizi doğru konuşalım, takipte kalın!"`},{title:`Kelime 2: DOKÜMAN (Belge)`,subtitle:`Süre: 35 Saniye • Mekân: Edebiyat Panosu Önü`,content:`Konuşma Metni: "Çoğu zaman 'doküman' yerine 'döküman' dendiğini duyarsınız. Oysa Fransızca kökenli bu sözcüğün ilk hecesi 'o' iledir: Do-kü-man. Türkçemizde ise bunun pırıl pırıl bir karşılığı var: 'Belge'. Siz de belge demeyi deneyin!"`}]},printableWorksheet:{title:`DİJİTAL SÖZLÜK KISA VİDEO ÇEKİM SENARYOSU FORMU`,subtitle:`30 - 45 Saniyelik Sosyal Medya İçerik Taslağı`,instructions:`Videonuzu çekmeden önce konuşma metnini prova edip süreyi kronometreyle ölçünüz.`,studentHeader:!0,contentHtmlOrText:`ÖĞRENCİLERİN ADI SOYADI: 1. .................................................... 2. ....................................................

lenmesi.`,objective:`Öğrencilerde çevreye ve dile karşı seçici dikkat oluşturmak; yabancı sözcükler yerine Türkçe kökenli alternatifleri gerekçelendirerek kullanma alışkanlığı kazandırmak.`,eOkul:{alan:`Dil ve Edebiyat`,kategori:`Söz Varlığı Geliştirme`,etkinlikTuru:`Çevre İncelemesi ve Sözlük Çalışması`,kazanimMetni:`Çevresinde ve medyada yer alan yabancı kökenli kelimelerin Türkçe karşılıklarını tespit eder, gerekçelendirerek kullanır.`},materials:[`Etkileşimli akıllı tahta (Öğretmenin telefonla çektiği sokak tabela fotoğrafları yansıtılır)`,`A4 fotokopi kâğıdı (Aşağıdaki hazır Tabela Analiz Formu)`,`Tahta kalemi`,`TDK Güncel Türkçe Sözlük`],durationMinutes:40,steps:{preparation:`Öğretmen ders öncesinde okulun yakınındaki caddelerden 4 adet yabancı isimli tabela (Örn: "Car Wash", "Beauty Center", "Fast Food Corner", "Dry Cleaning") fotoğrafını akıllı tahtaya aktarır.`,introduction:`Dakika 00 - 05: Fotoğraflar tahtaya yansıtılır. "Sizce bir yabancı bu sokaktan geçse Türkiye'de olduğunu anlar mı? Dil bağımsızlığımız tabelalarda nasıl korunur?" sorusu yöneltilir.`,execution:`Dakika 05 - 25: Öğrenciler aşağıdaki çalışma kâğıdını doldurur. Her yabancı tabela için TDK ve Kubbealtı Lugatı referans alınarak Türkçe karşılıklar üretilir: Car Wash ➡️ Oto Yıkama, Beauty Center ➡️ Güzellik Merkezi, Dry Cleaning ➡️ Kuru Temizleme.`,reinforcement:`Dakika 25 - 35: Öğrenciler seçtikleri Türkçe kelimelerin neden yabancı kelimeden daha ahenkli, anlamca berrak ve zengin olduğunu 2 gerekçeyle tahtada savunur.`,conclusion:`Dakika 35 - 40: "Tabelalarımız Türkçeleşiyor" listesi hazırlanarak okul koridor panosuna asılır.`},exampleData:{title:`Tabela ve İlanlarda Karşılaşılan Kelimeler Tablosu`,description:`Sınıfta tahlil edilecek somut örnekler:`,type:`dictionary`,cards:[{title:`Center ➡️ Merkez / Odak`,subtitle:`Tabela: "Medical Center"`,content:`Türkçe Karşılığı: "Sağlık Merkezi"`,sampleSentence:`Gerekçe: Dilimizde merkez kelimesi hem köklü hem de halkın tamamının doğrudan anladığı duru bir ifadedir.`},{title:`Fast Food ➡️ Hazır Yemek / Ayaküstü Lezzet`,subtitle:`Tabela: "Fast Food Corner"`,content:`Türkçe Karşılığı: "Ayaküstü Yemek / Hazır Yemek"`,sampleSentence:`Gerekçe: Türk mutfak kültürünün zarafetine ve beslenme geleneğimize uygun Türkçe tanımlardır.`},{title:`Outlet ➡️ Fabrika Satış Mağazası / İndirimli Satış`,subtitle:`Tabela: "Outlet Store"`,content:`Türkçe Karşılığı: "Fabrika Satış / Uygun Satış Noktası"`,sampleSentence:`Gerekçe: Tüketicinin haklarını ve ürünün niteliğini açıkça anlatan Türkçe ifadedir.`}]},printableWorksheet:{title:`"TÜRKÇESİNİ SÖYLEYELİM" TABELA VE ÇEVRE ANALİZİ FORMU`,subtitle:`Sokaktaki Dilimizi İnceleme ve Türkçeleştirme Çalışması`,instructions:`Aşağıdaki tabloda verilen yabancı tabela adlarına TDK ilkelerine uygun zengin Türkçe karşılıklar öneriniz.`,studentHeader:!0,contentHtmlOrText:`ÖĞRENCİNİN ADI SOYADI: .................................................... SINIF: ........ NO: ........

aştırma Panosu çalışmasında öğrencilerimiz 10 ortak fiilin farklı Türk lehçelerindeki çekimlerini araştırmış, dilimizin köklü gramer bağlarını gösteren kapsamlı bir pano hazırlamıştır.`},{id:`mayis-1`,code:`10.1 - 10.4`,month:`Mayıs`,weekLabel:`Tüm Ay (04 - 22 Mayıs 2027)`,title:`Kelimelerin Sırrında Âşık Veysel ve "Kara Toprak" Tahlili`,category:`Âşık Veysel ve Halk Kültürü`,startDate:`04.05.2027`,endDate:`22.05.2027`,targetAudience:`9-12. Sınıf Öğrencileri`,responsible:`Türk Dili ve Edebiyatı Zümresi`,summary:`Büyük halk ozanı Âşık Veysel’in şiirlerindeki derinlikli halk söz varlığının, "Kara Toprak" şiirinin imge yönünden tahlili ve "Çevrim İçi Ozan Sözlüğü" oluşturulması.`,objective:`Âşıklık geleneğini ve halk felsefesini tanımak; Veysel’in duru Türkçesindeki deyim, atasözü ve yöresel kelimeleri analiz etmek.`,eOkul:{alan:`Yazılı Anlatım ve Edebiyat`,kategori:`Deneme Yarışması ve Sözlük`,etkinlikTuru:`Deneme Yarışması ve Dijital Sözlük`,kazanimMetni:`Âşık Veysel’in "Kara Toprak" şiirini imge yönünden tahlil eder; özgün deneme kaleme alır ve dijital ozan sözlüğü oluşturur.`},materials:[`Etkileşimli akıllı tahta (Âşık Veysel "Kara Toprak" kendi sesinden dinletilir)`,`A4 fotokopi kâğıdı (Aşağıdaki hazır Şiir Tahlil ve Ozan Sözlüğü Çalışma Kâğıdı)`,`Tahta kalemi`,`TDK Türkçe Sözlük`],durationMinutes:40,steps:{preparation:`Öğretmen ders öncesinde akıllı tahtaya Âşık Veysel'in "Kara Toprak" kaydını ve şiir metnini hazırlar.`,introduction:`Dakika 00 - 05: Şiir sınıfa Veysel'in kendi bağlaması ve sesinden 2 dakika dinletilir. "Dost bildiğiniz insanlar yüz çevirirken, size daima vefayla sarılan ne olabilir?" sorusuyla ders açılır.`,execution:`Dakika 05 - 25: Öğrencilere aşağıdaki çalışma kâğıdı dağıtılır. "Benim sâdık yârim kara topraktır", "Karnın yardım kazmayınan belinen / Yüzün yırttım tırnağınan elinen / Yine beni karşıladı gülünen" mısralarındaki tezat, teşhis ve halk söyleyişleri çözümlenir.`,reinforcement:`Dakika 25 - 35: Şiirde geçen halk kelimeleri (Sâdık, mihnet, kazma, bel, cömert, kaza, hakikat) derlenerek "Sınıf Ozan Sözlüğü" oluşturulur.`,conclusion:`Dakika 35 - 40: Öğrencilerden "Veysel'in İzinde Gönül Dili" konulu bir sayfalık özgün deneme yazmaları istenir; okul birincisi seçilir.`},exampleData:{title:`Âşık Veysel "Kara Toprak" Söz Varlığı Çözümlemesi`,description:`Şiirin mısralarında geçen gerçek edebî sanatlar ve kelimeler:`,type:`general`,cards:[{title:`"Benim sâdık yârim kara topraktır."`,subtitle:`Edebî Sanat: Teşhis (Kişileştirme) ve İstiare`,content:`Tahlil: Toprak sadık bir dost gibi tasavvur edilmiştir. İnsanların vefasızlığına karşılık toprağın koşulsuz sevgisi vurgulanır.`},{title:`"Karnın yardım kazmayınan belinen / Yine beni karşıladı gülünen"`,subtitle:`Edebî Sanat: Tezat ve İntak`,content:`Tahlil: İnsanın toprağa verdiği eziyete ve tahribata karşın toprağın insana cömertçe çiçek ve meyve ikram etmesi, yüce ahlakın timsalidir.`},{title:`Ozan Sözlüğünden Seçmeler`,subtitle:`Halk Söz Varlığı`,content:`• Bel: Toprağı kazmakta kullanılan metal tarım aleti.
