<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'FoySade',Calibri,Arial,sans-serif;font-size:15px;color:#1d2733;background:#e6eaf0}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
#uyg{display:flex;flex-direction:column;height:100vh}

/* ÜST ÇUBUK */
#ust{display:flex;align-items:center;gap:10px 16px;padding:8px 14px;background:#17324d;color:#fff;flex-wrap:wrap}
.marka{display:flex;flex-direction:column;line-height:1.1}
.marka b{font-size:19px;letter-spacing:.2px}
.marka small{opacity:.7;font-size:11px}
.ustorta{flex:1;min-width:220px;display:flex;align-items:center;gap:10px}
#foyAdiUst{flex:1;min-width:140px;background:#fff1;border:1px solid #fff4;color:#fff;border-radius:6px;padding:7px 10px;font-size:16px}
#foyAdiUst::placeholder{color:#fff9}
.durum{font-size:12.5px;opacity:.85;white-space:nowrap}
.durum.hata{color:#ffb4a8;opacity:1;font-weight:700}
.ustsag{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#ust button{background:#fff1;border:1px solid #fff4;color:#fff;border-radius:6px;padding:7px 11px;cursor:pointer}
#ust button:hover{background:#fff3}
#ust button.birincil{background:#f0a500;border-color:#f0a500;color:#1b1400;font-weight:700}
#ust button.birincil:hover{background:#ffb81c}
.grup{display:inline-flex;border-radius:6px;overflow:hidden;border:1px solid #fff4}
.grup button{border:0!important;border-radius:0!important;background:transparent!important}
.grup button.aktif{background:#fff!important;color:#17324d!important;font-weight:700}

/* ANA DÜZEN */
#ana{flex:1;display:flex;min-height:0}
#sol{width:470px;min-width:360px;max-width:50%;background:#f7f9fb;border-right:1px solid #cfd6df;display:flex;flex-direction:column;min-height:0}
#sag{flex:1;display:flex;flex-direction:column;min-width:0}
.sekmeler{display:flex;background:#e3e8ee;border-bottom:1px solid #cfd6df}
.sekmeler button{flex:1;padding:10px 6px;border:0;background:transparent;cursor:pointer;font-weight:600;color:#44566b;border-bottom:3px solid transparent}
.sekmeler button.aktif{background:#f7f9fb;color:#17324d;border-bottom-color:#f0a500}
.sekme{flex:1;overflow:auto;padding:14px}

/* SAĞ: ÖNİZLEME */
#sagBar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#d5dbe3;border-bottom:1px solid #c0c8d2;font-size:13.5px;flex-wrap:wrap}
#sagBar .bosluk{flex:1}
#sagBar button{border:1px solid #aab4c1;background:#fff;border-radius:5px;padding:3px 10px;cursor:pointer}
#sagBar button:hover{background:#eef2f6}
#yakinDeger{min-width:44px;text-align:center}
#sayfalarKap{flex:1;overflow:auto;padding:18px;background:#8d98a6}
#sayfalarSar{margin:0 auto;position:relative}
#sayfalar{position:absolute;left:0;top:0;width:210mm;display:flex;flex-direction:column;gap:18px;transform-origin:0 0}
#uyariKutu .uyari{background:#fff3cd;border:1px solid #e0b400;color:#5c4400;border-radius:5px;padding:2px 8px;margin-right:6px;font-size:12.5px}
#uyariKutu .oneri{background:#e1f3e6;border:1px solid #3f9c5a;color:#14502a;border-radius:5px;padding:2px 8px;margin-right:6px;font-size:12.5px}
#uyariKutu .oneri button{margin-left:6px;padding:1px 8px;font-size:12px}

/* FORM ÖĞELERİ */
.alan{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.alan>label,.etiket{font-size:12.5px;font-weight:700;color:#44566b}
.alan input[type=text],.alan input[type=number],.alan input[type=date],.alan select,.alan textarea{border:1px solid #b9c3cf;border-radius:6px;padding:7px 9px;background:#fff;width:100%}
.alan textarea{resize:vertical;min-height:80px;line-height:1.4}
.alan input:focus,.alan select:focus,.alan textarea:focus,.zengin:focus{outline:2px solid #5b9bd5;outline-offset:0;border-color:#5b9bd5}
.satir2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.satir3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kart{background:#fff;border:1px solid #cfd6df;border-radius:10px;padding:12px;margin-bottom:12px}
.kart h3{margin:0 0 10px;font-size:15px;color:#17324d}
.ipucu{font-size:12.5px;color:#5a6b7d;line-height:1.4}
.btn{border:1px solid #9fb0c4;background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{background:#eef3f8}
.btn.birincil{background:#17324d;border-color:#17324d;color:#fff}
.btn.birincil:hover{background:#21476b}
.btn.tehlike{color:#a3261b;border-color:#e0a8a2}
.btn.kucuk{padding:2px 8px;font-size:13px}
.onay{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}

/* RENK ve SEÇİM KARTLARI */
.renkler{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.renkler .ren{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #9aa7b6;cursor:pointer;padding:0}
.renkler .ren.aktif{box-shadow:0 0 0 3px #17324d}
.renkler input[type=color]{width:38px;height:30px;padding:0;border:1px solid #9aa7b6;border-radius:6px;background:#fff;cursor:pointer}
.secenekler{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.secenek{border:2px solid #cfd6df;border-radius:8px;background:#fff;padding:8px;cursor:pointer;text-align:left}
.secenek:hover{border-color:#8fb0d1}
.secenek.aktif{border-color:#17324d;background:#eef4fb}
.secenek .ad{font-size:12px;font-weight:700;color:#44566b;margin-bottom:4px}
.secenek .ornek{font-size:12.5px;line-height:1.25}
.secenek.genis{grid-column:1/-1}
.logoSatir{display:flex;align-items:center;gap:10px}
.logoOnizle{width:84px;height:56px;border:1px dashed #aab4c1;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.logoOnizle img{max-width:100%;max-height:100%}

/* BLOK KARTLARI (düzenleyici) */
.blokKart{background:#fff;border:1px solid #cfd6df;border-left:5px solid var(--bk,#17324d);border-radius:8px;margin-bottom:10px}
.blokKart.surukle{opacity:.45}
.blokKart.vurgulu{box-shadow:0 0 0 3px #f0a500}
.blokKart.hedef{box-shadow:0 -3px 0 0 #f0a500}
.blokBas{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#f2f5f9;border-radius:6px 6px 0 0}
.blokBas .tur{font-weight:700;font-size:13.5px;flex:1;color:#17324d}
.blokBas .tut{cursor:grab;color:#7b8a9b;padding:0 6px;font-size:16px}
.blokBas button{border:1px solid #c6cfda;background:#fff;border-radius:5px;padding:1px 7px;cursor:pointer;font-size:13px;line-height:1.5}
.blokBas button:hover{background:#eaf0f7}
.blokBas button.sil:hover{background:#fde6e3;border-color:#e0a8a2}
.blokGovde{padding:10px}
.blokGovde .alan{margin-bottom:8px}
.ekleBar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ekleBar button{border:1px dashed #6f8fb3;background:#f0f6fd;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:13.5px}
.ekleBar button:hover{background:#dfeefc}
.ekleMenu{position:absolute;z-index:50;background:#fff;border:1px solid #9fb0c4;border-radius:8px;box-shadow:0 6px 20px #0003;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;width:300px}
.ekleMenu button{border:1px solid #d3dbe5;background:#fff;border-radius:5px;padding:6px 8px;text-align:left;cursor:pointer;font-size:13.5px}
.ekleMenu button:hover{background:#eaf3fc}

/* ZENGİN METİN DÜZENLEYİCİ */
.zbar{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap}
.zbar button{border:1px solid #c0cad6;background:#fff;border-radius:5px;min-width:30px;padding:2px 7px;cursor:pointer;font-size:13px}
.zbar button:hover{background:#eaf0f7}
.zengin{border:1px solid #b9c3cf;border-radius:6px;background:#fff;padding:7px 9px;min-height:64px;line-height:1.45;overflow-wrap:anywhere}
.zengin:empty:before{content:attr(data-bos);color:#8a97a6}
.zengin ul,.zengin ol{margin:.2em 0;padding-left:1.4em}
.zengin p{margin:0 0 .3em}

/* TABLO DÜZENLEYİCİ */
.tabloDuz{overflow:auto;border:1px solid #cfd6df;border-radius:6px;margin-top:6px}
.tabloDuz table{border-collapse:collapse;width:100%}
.tabloDuz td{border:1px solid #d5dce5;padding:0}
.tabloDuz input{width:100%;min-width:70px;border:0;padding:5px 6px;background:transparent}
.tabloDuz tr:first-child td.ust input{font-weight:700;background:#eef4fb}
.sayac{display:inline-flex;align-items:center;gap:6px}
.sayac button{width:26px;height:26px;border:1px solid #aab4c1;background:#fff;border-radius:5px;cursor:pointer}

/* LİSTE */
.liste table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #cfd6df;border-radius:8px;overflow:hidden}
.liste th,.liste td{padding:7px 8px;border-bottom:1px solid #e3e8ee;text-align:left;font-size:13.5px}
.liste th{background:#eef2f6;color:#44566b;font-size:12.5px}
.liste tr.aktifSatir td{background:#fff8e0}
.liste td.islem{white-space:nowrap}
.liste td.islem button{margin-left:3px}
.bos{padding:24px;text-align:center;color:#6b7b8d}

/* MODAL ve BİLDİRİM */
#modalKatman{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:100}
#modalKatman[hidden]{display:none}
.modal{background:#fff;border-radius:12px;max-width:520px;width:calc(100% - 32px);padding:20px;box-shadow:0 12px 40px #0006;max-height:92vh;overflow:auto}
.modal.yzModal{max-width:720px}
.yzSatir{margin-bottom:8px}
.yzOnizle{border:1px solid #cfd6df;border-radius:6px;padding:8px 10px;background:#fafbfc;font-size:14.5px;margin-top:3px}
.modal h3{margin:0 0 8px;color:#17324d}
.modal p{margin:0 0 12px;line-height:1.45}
.modal .dugmeler{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
#toastKatman{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:120}
.toast{background:#17324d;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 4px 14px #0004;max-width:360px;font-size:14px}
.toast.hata{background:#a3261b}

#sunum{position:fixed;inset:0;background:#0d1117;z-index:200;display:flex;align-items:center;justify-content:center;overflow:hidden}
#sunum .sunKap{position:absolute;left:50%;top:0;transform-origin:0 0}
#sunum .sunKap .sayfa{box-shadow:none}
#sunum .sunBar{position:fixed;bottom:10px;right:14px;display:flex;gap:10px;align-items:center;background:#000a;color:#fff;border-radius:30px;padding:6px 14px;z-index:210;opacity:.25;transition:opacity .2s}
#sunum:hover .sunBar,#sunum .sunBar:focus-within{opacity:1}
#sunum .sunBar button{background:#fff2;border:1px solid #fff4;color:#fff;border-radius:20px;min-width:40px;padding:4px 12px;cursor:pointer;font-size:16px}
#sunum .sunBar button:hover{background:#fff4}
@media (max-width:900px){
  #ana{flex-direction:column}
  #sol{width:100%;max-width:none;max-height:55vh}
}
@media print{
  html,body{height:auto;background:#fff}
  #uyg{display:block;height:auto}
  #ust,#sol,#sagBar,#modalKatman,#toastKatman,#sunum{display:none!important}
  #ana,#sag,#sayfalarKap{display:block;overflow:visible;padding:0;background:#fff}
  #sayfalarSar{width:auto!important;height:auto!important;margin:0}
  #sayfalar{position:static;display:block;transform:none!important;gap:0;width:auto}
}

/* ===== A4 SAYFA ve föy içeriği ===== */
:root{--vurgu:#1f5c99;--vurgu-acik:#e9f0f8;--vurgu-orta:#9dbbdb;--vurgu-koyu:#17456f;--vurgu-yazi:#fff;--yazi:'FoyKitap',Cambria,Georgia,serif}
.foyi{font-family:var(--yazi);color:#1b1b1b;line-height:1.38;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.foyi p{margin:0 0 .45em}
.foyi p:last-child{margin-bottom:0}
.foyi ul,.foyi ol{margin:0;padding-left:1.35em}
.foyi li{margin-bottom:.2em}

.sayfa{--yz:1;position:relative;width:210mm;height:296.6mm;flex:none;background:#fff;overflow:hidden;box-shadow:0 2px 10px #0004;font-size:calc(10.5pt * var(--yz));page-break-after:always;break-after:page}
.sayfa:last-child{page-break-after:auto;break-after:auto}
.sayfa .ust{position:absolute;left:14mm;right:14mm;top:8mm;height:15mm;display:flex;align-items:center;gap:3mm;border-bottom:.45mm solid var(--vurgu);font-size:9.5pt;line-height:1.2}
.sayfa .ust .logo{height:12.5mm;width:auto;max-width:26mm;object-fit:contain}
.sayfa .ust .okul{flex:1;font-weight:700;font-size:11.5pt;color:var(--vurgu-koyu)}
.sayfa .ust .ders{text-align:right;color:#555;font-size:9pt}
.sayfa .alt{position:absolute;left:14mm;right:14mm;bottom:7mm;height:7mm;display:flex;justify-content:space-between;align-items:center;gap:6mm;border-top:.3mm solid #999;font-size:8.5pt;color:#444;line-height:1.1}
.sayfa .alt .orta{flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#666}
.sayfa .govde{position:absolute;left:14mm;right:14mm;top:26mm;bottom:15mm;display:flex;flex-direction:column}
.sayfa .sutunlar{flex:1;display:flex;gap:9mm;min-height:0;position:relative}
.sayfa .sutun{flex:1;min-width:0;overflow:hidden}
.sayfa .sutunlar.s2:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:.25mm solid #c9c9c9}

/* künye (ilk sayfa) */
.kunye{flex:none;margin-bottom:3.2mm;position:relative}
.kunye .rozet{position:absolute;right:0;top:0;font:700 7.5pt 'FoySade',sans-serif;color:var(--vurgu-koyu);border:.3mm solid var(--vurgu);border-radius:3mm;padding:.3mm 2.2mm;background:#fff}
.kunye .k-ad{padding-right:30mm;font-size:1.55em;font-weight:700;color:var(--vurgu-koyu);line-height:1.15}
.kunye .k-alt{display:flex;gap:1.2em;flex-wrap:wrap;font-size:.9em;color:#444;margin-top:.15em}
.kunye .k-alt b{color:#222}
.kunye .k-ogr{display:flex;gap:1.2em;margin-top:.55em;font-size:.88em;color:#333}
.kunye .k-ogr span{display:flex;align-items:flex-end;gap:.35em;white-space:nowrap}
.kunye .k-ogr i{display:inline-block;border-bottom:.1em dotted #444;height:1.1em}
.kunye .k-ogr .u1{flex:1}.kunye .k-ogr .u2{width:5.5em}.kunye .k-ogr .u3{width:7em}
.kunye .k-cizgi{height:.18em;background:var(--vurgu);margin-top:.5em;border-radius:1em}

/* her blok bir .b sarmalayıcıdır (boşluk = padding, ölçüm tutarlı olsun) */
.b{padding-bottom:.85em}
.b.bitis{padding-bottom:0}

/* BAŞLIK şablonları */
.bl-baslik h2{margin:0;font-size:1.32em;line-height:1.2}
.bl-baslik .altbaslik{margin-top:.25em;font-size:.95em;color:var(--vurgu-koyu);font-style:italic}
.bs1 .bl-baslik h2{background:var(--vurgu);color:var(--vurgu-yazi);padding:.32em .7em;border-radius:.3em}
.bs2 .bl-baslik h2{color:var(--vurgu-koyu);border-bottom:.2em solid var(--vurgu);padding-bottom:.12em}
.bs3 .bl-baslik h2{border-left:.5em solid var(--vurgu);background:var(--vurgu-acik);padding:.3em .7em;color:var(--vurgu-koyu)}
.bs4 .bl-baslik h2{border:.14em solid var(--vurgu);border-radius:.7em;padding:.28em .85em;color:var(--vurgu-koyu)}
.bs5 .bl-baslik h2{text-align:center;color:var(--vurgu-koyu);display:flex;align-items:center;gap:.7em}
.bs5 .bl-baslik h2:before,.bs5 .bl-baslik h2:after{content:'';flex:1;border-top:.12em solid var(--vurgu)}
.bs5 .bl-baslik .altbaslik{text-align:center}

/* ANLATIM */
.bl-anlatim{text-align:left}
.bl-anlatim .ul-parca{margin:0}

/* ALINTI (şiir / metin) */
.alinti{border-left:.3em solid var(--vurgu);background:#f8f8f6;padding:.5em .9em;border-radius:0 .3em .3em 0}
.alinti .dize{display:flex;line-height:1.45}
.alinti .dize .no{flex:none;width:2.1em;text-align:right;padding-right:.7em;font-size:.78em;color:var(--vurgu-koyu);font-family:'FoySade',sans-serif;padding-top:.22em}
.alinti .dize .dz{flex:1}
.alinti .bosluk{height:.75em}
.alinti.siir .dz{font-style:italic}
.alinti.duz p{text-indent:1.2em;margin:0 0 .35em;text-align:justify}
.alinti .kaynak{text-align:right;font-style:italic;font-size:.86em;margin-top:.35em;color:#444}
.alinti.devam{border-top:.05em dashed #bbb}

/* KUTULAR */
.kutu{--k:var(--vurgu);--ka:var(--vurgu-acik);--kk:var(--vurgu-koyu);--ky:var(--vurgu-yazi)}
.kutu.t-ornek{--k:#2e7d4f;--ka:#eaf5ee;--kk:#1d5233;--ky:#fff}
.kutu.t-dikkat{--k:#c0392b;--ka:#fdeceb;--kk:#8b241a;--ky:#fff}
.kutu.t-not{--k:#a67c00;--ka:#fff6d8;--kk:#6e5200;--ky:#fff}
.kutu.t-ipucu{--k:#6a3fa0;--ka:#f2ecfa;--kk:#47257a;--ky:#fff}
.kutu.t-sirasizde{--k:#0b7285;--ka:#e5f4f7;--kk:#08505e;--ky:#fff}
.kutu .kutu-baslik{font-weight:700;font-family:'FoySade',sans-serif;font-size:.95em}
.kutu .kutu-icerik>*:last-child{margin-bottom:0}
.kb1 .kutu{border:.12em solid var(--k);border-radius:.7em;background:var(--ka);padding:.5em .85em .6em}
.kb1 .kutu .kutu-baslik{color:var(--kk);margin-bottom:.25em}
.kb2 .kutu{border:.12em solid var(--k);background:#fff}
.kb2 .kutu .kutu-baslik{background:var(--k);color:var(--ky);padding:.2em .75em}
.kb2 .kutu .kutu-icerik{padding:.5em .8em .55em}
.kb3 .kutu{border-left:.45em solid var(--k);background:var(--ka);padding:.45em .85em .55em;border-radius:0 .45em .45em 0}
.kb3 .kutu .kutu-baslik{color:var(--kk);margin-bottom:.2em;text-transform:uppercase;letter-spacing:.04em;font-size:.82em}
.kutu.devam .kutu-baslik{display:none}
.kutu .cozum{margin-top:.45em;padding-top:.4em;border-top:.08em dashed var(--k)}
.kutu .cz-et{font-weight:700;color:var(--kk);font-family:'FoySade',sans-serif;font-size:.88em}
.kutu .cevap{margin-top:.4em;color:var(--kk)}
.kutu .cizgi{height:1.85em;border-bottom:.07em dotted #555}

/* TABLO */
.tbl{border-collapse:collapse;width:100%;font-size:.95em}
.tbl th,.tbl td{border:.08em solid #5a5a5a;padding:.25em .5em;vertical-align:top;text-align:left}
.tbl th{background:var(--vurgu-acik);color:var(--vurgu-koyu);font-weight:700}
.tbl-yazi{font-size:.85em;color:#444;margin-bottom:.2em;font-style:italic}

/* GÖRSEL */
.bl-gorsel{text-align:center}
.bl-gorsel img{max-width:100%;max-height:215mm;object-fit:contain}
.bl-gorsel figcaption{font-size:.85em;color:#444;font-style:italic;margin-top:.25em}
.bl-gorsel figure{margin:0}

/* küçük önizlemeler (ayar kartlarında) */
.foyi.mini{font-size:12px;line-height:1.3}
.foyi.mini .b{padding-bottom:.4em}

/* serbest yerleşimli görseller */
.serbest{position:absolute;z-index:5;cursor:move;touch-action:none;line-height:0}
.serbest img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.serbest .sb-yazi{line-height:1.25;font-size:.85em;font-style:italic;color:#444;text-align:center;margin-top:.25em;pointer-events:none}
.serbest.secili{outline:.5mm solid #f0a500;outline-offset:.2mm}
.serbest .tutamac{display:none;position:absolute;right:-3.2mm;bottom:-3.2mm;width:6.4mm;height:6.4mm;border-radius:50%;background:#f0a500;border:.5mm solid #fff;box-shadow:0 0 0 .3mm #8a6100;cursor:nwse-resize;touch-action:none}
.serbest.secili .tutamac{display:block}
.serbest.surukleniyor{opacity:.85}

@page{size:A4;margin:0}
@media print{
  .sayfa{box-shadow:none;margin:0}
  .serbest{outline:none!important}
  .serbest .tutamac{display:none!important}
}

/* ===== sürüm 4: kalıplar, görsel istemi, yedek hatırlatma, geri al ===== */
#ust button:disabled{opacity:.4;cursor:default;background:#fff1}
#ust button.uyari{background:#c2410c;border-color:#ffb38a;font-weight:700}
#ust button.uyari:hover{background:#d9541a}
.modal.kalipModal{max-width:860px}
.kalipGrup h4{margin:14px 0 6px;font-size:12.5px;color:#5a6b7d;text-transform:uppercase;letter-spacing:.04em}
.kalipIzgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.kalipKart{text-align:left;border:1px solid #cfd6df;border-radius:8px;background:#fff;padding:9px 11px;cursor:pointer;font:inherit;color:inherit}
.kalipKart:hover,.kalipKart:focus{border-color:#17324d;background:#f0f6fd;outline:none}
.kalipKart b{display:block;color:#17324d;margin-bottom:3px}
.kalipKart span{display:block;font-size:12.5px;color:#44566b;line-height:1.35}
.kalipKart small{display:block;margin-top:5px;font-size:11.5px;color:#7a8a9b;line-height:1.35}
.blokIpucu{background:#fff8e1;border:1px solid #f3dfa0;border-radius:6px;padding:5px 8px;margin-bottom:8px;color:#5b4a12}
.gorselSecim{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gorselSecim select{width:100%}
#giMetin{width:100%;font:inherit;font-size:13px;line-height:1.4}

</style>

<div id="uyg">
  <header id="ust">
    <div class="marka"><b>Föy Atölyesi</b><small>sürüm 4</small></div>
    <div class="ustorta">
      <input id="foyAdiUst" type="text" placeholder="Föyün adı" aria-label="Föyün adı">

    </section>
  </main>
</div>
<div id="modalKatman" hidden></div>
<div id="toastKatman" aria-live="polite"></div>
<script>
'use strict';
/* ===== Yardımcı işlevler ===== */
const $ = (s, k = document) => k.querySelector(s);
const $$ = (s, k = document) => Array.from(k.querySelectorAll(s));

function e(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function yeniId() {
  try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (x) { /* yoksay */ }
  return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function gecikme(fn, ms) {
  let t = null;
  const f = (...a) => { clearTimeout(t); t = setTimeout(() => { t = null; fn(...a); }, ms); };
  f.hemen = (...a) => { clearTimeout(t); t = null; fn(...a); };
  f.bekliyor = () => t !== null;
  f.iptal = () => { clearTimeout(t); t = null; };
  return f;
}

function bugunIso() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function tarihYaz(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  return m ? m[3] + '.' + m[2] + '.' + m[1] : (iso || '');
}
function saatYaz(ms) {
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}

/* Zengin metin temizleyici: yalnız güvenli etiketleri bırakır, öznitelik taşımaz */
const IZINLI_ETIKET = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'P', 'UL', 'OL', 'LI', 'SUP', 'SUB', 'DIV', 'SPAN']);
function temizHtml(html) {
  const doc = new DOMParser().parseFromString('<body>' + String(html || '') + '</body>', 'text/html');
  const kok = doc.body;
  (function yurut(n) {
    Array.from(n.childNodes).forEach(c => {
      if (c.nodeType === 3) return;
      if (c.nodeType !== 1) { c.remove(); return; }
      const et = c.tagName;
      if (et === 'SCRIPT' || et === 'STYLE' || et === 'IFRAME' || et === 'OBJECT' || et === 'EMBED') { c.remove(); return; }
      if (!IZINLI_ETIKET.has(et)) {
        yurut(c);
        while (c.firstChild) c.parentNode.insertBefore(c.firstChild, c);
        c.remove();
        return;
      }
      Array.from(c.attributes).forEach(a => c.removeAttribute(a.name));
      yurut(c);
    });
  })(kok);
  return kok.innerHTML;
}

/* Zengin metni paragraf parçalarına böler (sayfaya bölünebilsin diye).
   Dönen: HTML dizgisi dizisi; her biri <p>…</p> ya da <ul>/<ol> (tek maddelik) */
function parcalaHtml(html) {
  const doc = new DOMParser().parseFromString('<body>' + temizHtml(html) + '</body>', 'text/html');
  const cikti = [];
  let satirIci = [];
  const bosMu = h => !h.replace(/<br\s*\/?>/gi, '').replace(/&nbsp;/g, ' ').replace(/<[^>]+>/g, '').trim();
  const satirIciBosalt = () => {
    if (!satirIci.length) return;
    const h = satirIci.join('');
    satirIci = [];
    if (!bosMu(h)) cikti.push('<p>' + h + '</p>');
  };
  const yurut = (dugum) => {
    Array.from(dugum.childNodes).forEach(c => {
      if (c.nodeType === 3) { satirIci.push(e(c.nodeValue)); return; }
      if (c.nodeType !== 1) return;
      const et = c.tagName;
      if (et === 'P' || et === 'DIV') {
        const icerdeBlok = Array.from(c.children).some(x => ['P', 'DIV', 'UL', 'OL'].includes(x.tagName));
        satirIciBosalt();
        if (icerdeBlok) { yurut(c); satirIciBosalt(); }
        else { const h = c.innerHTML; if (!bosMu(h)) cikti.push('<p>' + h + '</p>'); }
      } else if (et === 'UL' || et === 'OL') {
        satirIciBosalt();
        let no = parseInt(c.getAttribute('start') || '1', 10) || 1;
        Array.from(c.children).forEach(li => {
          if (li.tagName !== 'LI') return;
          const t = et.toLowerCase();
          cikti.push('<' + t + ' class="ul-parca"' + (et === 'OL' ? ' start="' + no + '"' : '') + '><li>' + li.innerHTML + '</li></' + t + '>');
          no++;
        });
      } else if (et === 'BR') {
        satirIci.push('<br>');
      } else {
        satirIci.push(c.outerHTML);
      }
    });
  };
  yurut(doc.body);
  satirIciBosalt();
  return cikti;
}

/* Bildirim ve onay pencereleri */
function bildir(mesaj, hata) {
  const k = $('#toastKatman');
  const t = document.createElement('div');
  t.className = 'toast' + (hata ? ' hata' : '');
  t.textContent = mesaj;
  k.appendChild(t);
  setTimeout(() => t.remove(), hata ? 7000 : 3500);
}

function pencere({ baslik, mesaj, html, dugmeler }) {
  dugmeler = dugmeler || [{ ad: 'Tamam', deger: true, birincil: true }];
  return new Promise(coz => {
    const kat = $('#modalKatman');
    kat.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h3></h3><p class="mesaj"></p><div class="ek"></div><div class="dugmeler"></div></div>';
    $('h3', kat).textContent = baslik || '';
    $('.mesaj', kat).textContent = mesaj || '';
    if (!mesaj) $('.mesaj', kat).remove();
    if (html) $('.ek', kat).innerHTML = html;
    const dk = $('.dugmeler', kat);
    const kapat = (deger) => {
      const secili = {};
      $$('input[type=checkbox]', kat).forEach(c => { secili[c.name] = c.checked; });
      kat.hidden = true; kat.innerHTML = '';
      document.removeEventListener('keydown', tus, true);
      coz({ deger, secili });
    };
    const tus = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); kapat(false); } };
    document.addEventListener('keydown', tus, true);
    dugmeler.forEach(d => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn' + (d.birincil ? ' birincil' : '') + (d.tehlike ? ' tehlike' : '');
      b.textContent = d.ad;
      b.addEventListener('click', () => kapat(d.deger));
      dk.appendChild(b);
    });
    kat.hidden = false;
    const ilk = $('.btn.birincil', kat) || $('.btn', kat);
    if (ilk) ilk.focus();
  });
}
async function sor(baslik, mesaj, evet, hayir, tehlike) {
  const r = await pencere({ baslik, mesaj, dugmeler: [{ ad: hayir || 'Vazgeç', deger: false }, { ad: evet || 'Tamam', deger: true, birincil: !tehlike, tehlike: !!tehlike }] });
  return r.deger === true;
}

/* Resmi küçültüp veri adresine çevirir (logo ve görseller için) */
function resimOku(dosya, enBuyuk, tur) {
  return new Promise((ok, hata) => {
    const fr = new FileReader();
    fr.onerror = () => hata(new Error('Dosya okunamadı'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => hata(new Error('Bu dosya bir resim olarak açılamadı'));
      im.onload = () => {
        const w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
        const o = Math.min(1, enBuyuk / Math.max(w, h, 1));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * o));
        c.height = Math.max(1, Math.round(h * o));
        const x = c.getContext('2d');
        if (tur !== 'png') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(im, 0, 0, c.width, c.height);
        try { ok(c.toDataURL(tur === 'png' ? 'image/png' : 'image/jpeg', 0.88)); } catch (z) { hata(z); }
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(dosya);
  });
}

function dosyaIndir(ad, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ad;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* Renk işlemleri */
function hexRgb(h) {
  h = String(h || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return [31, 92, 153];
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function rgbHex(r) { return '#' + r.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function karistir(a, b, t) { return a.map((v, i) => v * (1 - t) + b[i] * t); }
function parlaklik(r) { return (0.299 * r[0] + 0.587 * r[1] + 0.114 * r[2]) / 255; }

function resimBoyut(src) {
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => ok({ w: im.naturalWidth || 0, h: im.naturalHeight || 0 });
    im.onerror = () => ok({ w: 0, h: 0 });
    im.src = src;
  });
}

/* ===== Saklama (IndexedDB) ve yedek ===== */
const Depo = {
  db: null,
  kalici: false,
  bellek: { ayar: null, foy: new Map() },

  async ac() {
    try {
      if (!window.indexedDB) throw new Error('yok');
      this.db = await new Promise((ok, hata) => {
        const r = indexedDB.open('foy-atolyesi', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('ayar')) d.createObjectStore('ayar', { keyPath: 'k' });
          if (!d.objectStoreNames.contains('foy')) d.createObjectStore('foy', { keyPath: 'id' });
        };
        r.onsuccess = () => ok(r.result);
        r.onerror = () => hata(r.error);
        r.onblocked = () => hata(new Error('engellendi'));
      });
      this.kalici = true;
    } catch (x) {
      this.kalici = false;
    }
    this.kaliciIste();
  },

  /* Kalıcı depolama izni ister (başlangıcı bekletmez). Verilmezse yedek hatırlatması 3 güne iner. */
  kaliciIste() {
    const sonuc = (ok) => {
      try {
        if (ok) { localStorage.removeItem('foy-kalici-red'); return; }
        localStorage.setItem('foy-kalici-red', '1');
        if (!localStorage.getItem('foy-kalici-red-bildirildi')) {
          localStorage.setItem('foy-kalici-red-bildirildi', '1');
          bildir('Tarayıcı bu sayfaya kalıcı depolama izni vermedi; disk dolarsa föyler silinebilir. Bu yüzden yedek hatırlatması 3 günde bir gelecek.', true);
        }
        if (typeof YedekHatirlat !== 'undefined') YedekHatirlat.denetle(false);
      } catch (x) { /* yoksay */ }
    };
    try {
      if (navigator.storage && navigator.storage.persist) {
        Promise.resolve(navigator.storage.persist()).then(ok => sonuc(ok === true), () => sonuc(false));
      } else {
        sonuc(false);
      }
    } catch (x) { sonuc(false); }
  },

  _islem(depo, kip, fn) {
    return new Promise((ok, hata) => {
      const t = this.db.transaction(depo, kip);
      const s = t.objectStore(depo);
      let sonuc;
      const r = fn(s);
      if (r) r.onsuccess = () => { sonuc = r.result; };
      t.oncomplete = () => ok(sonuc);
      t.onerror = () => hata(t.error);
      t.onabort = () => hata(t.error || new Error('işlem iptal'));
    });
  },

  async ayarOku() {
    if (!this.kalici) return this.bellek.ayar;
    const r = await this._islem('ayar', 'readonly', s => s.get('ayar'));
    return r ? r.v : null;
  },
  async ayarYaz(v) {
    /* küçük ayarların (logo hariç) bir kopyası localStorage'da da durur */
    try {
      const k = Object.assign({}, v); delete k.logo;
      localStorage.setItem('foy-ayar-kucuk', JSON.stringify(k));
    } catch (x) { /* yoksay */ }
    if (!this.kalici) { this.bellek.ayar = JSON.parse(JSON.stringify(v)); return; }
    await this._islem('ayar', 'readwrite', s => s.put({ k: 'ayar', v }));
  },
  ayarKucukOku() {
    try { return JSON.parse(localStorage.getItem('foy-ayar-kucuk') || 'null'); } catch (x) { return null; }
  },

  async foyleriOku() {
    if (!this.kalici) return Array.from(this.bellek.foy.values()).map(f => JSON.parse(JSON.stringify(f)));
    const r = await this._islem('foy', 'readonly', s => s.getAll());
    return r || [];
  },
  async foyYaz(f) {
    if (!this.kalici) { this.bellek.foy.set(f.id, JSON.parse(JSON.stringify(f))); return; }
    await this._islem('foy', 'readwrite', s => s.put(f));
  },
  async foySil(id) {
    if (!this.kalici) { this.bellek.foy.delete(id); return; }
    await this._islem('foy', 'readwrite', s => s.delete(id));
  },
  async foylerHepsiniDegistir(liste) {
    if (!this.kalici) { this.bellek.foy = new Map(liste.map(f => [f.id, f])); return; }
    await this._islem('foy', 'readwrite', s => { s.clear(); liste.forEach(f => s.put(f)); return null; });
  }
};

/* ===== Yedek al / yükle ===== */
const Yedek = {
  /* ek: dosya adına eklenecek söz (ör. 'GERIYUKLEME_ONCESI'); hata olursa fırlatır */
  async al(ek) {
    /* bekleyen kayıt varsa önce yaz */
    if (typeof Foy !== 'undefined') await Foy.simdiKaydet();
    const ayar = await Depo.ayarOku();
    const foyler = await Depo.foyleriOku();
    /* açık föyün bellekteki hâli yedeğe girsin (depoya yazılamamış olsa bile) */
    if (typeof Foy !== 'undefined' && Foy.f && Foy.f.id) {
      const kopya = JSON.parse(JSON.stringify(Foy.f));
      const i = foyler.findIndex(x => x && x.id === kopya.id);
      if (i >= 0) foyler[i] = kopya; else foyler.push(kopya);
    }
    const veri = { uygulama: 'foy-atolyesi', surum: 1, tarih: new Date().toISOString(), ayar: ayar || Ayar.v, foyler };
    const blob = new Blob([JSON.stringify(veri)], { type: 'application/json' });
    dosyaIndir('foy-atolyesi-yedek-' + (typeof ek === 'string' && ek ? ek + '-' : '') + bugunIso() + '.json', blob);
    if (typeof YedekHatirlat !== 'undefined') YedekHatirlat.kaydet();
    bildir('Yedek dosyası hazırlandı (' + foyler.length + ' föy). İndirilenler klasöründe dosyanın indiğini kontrol edin.');
  },

  async yukle(dosya) {
    let veri;
    try {
      veri = JSON.parse(await dosya.text());
    } catch (x) {
      await pencere({ baslik: 'Yedek açılamadı', mesaj: 'Bu dosya bir yedek dosyası gibi görünmüyor. Dosya bozulmuş ya da yanlış dosya seçilmiş olabilir.' });
      return false;
    }
    if (!veri || veri.uygulama !== 'foy-atolyesi' || !Array.isArray(veri.foyler)) {
      await pencere({ baslik: 'Yedek açılamadı', mesaj: 'Bu dosya Föy Atölyesi yedeği değil. Hiçbir şey değiştirilmedi.' });
      return false;
    }
    /* gelen: düzeltilmiş föyler; gelenZaman: yedekteki ham güncelleme zamanı (eksikse NaN) */
    const zaman = x => {
      if (typeof x === 'number') return isFinite(x) ? x : NaN;
      if (typeof x === 'string' && x.trim()) { const n = Number(x); return isFinite(n) ? n : Date.parse(x); }
      if (x instanceof Date) return x.getTime();
      return NaN;
    };
    const gelen = [];
    const gelenZaman = new Map();
    veri.foyler.forEach(h => {
      const f = Foy.duzelt(h);
      if (!f) return;
      gelen.push(f);
      gelenZaman.set(f, zaman(h && h.guncelleme));
    });
    if (gelen.length === 0) {
      await pencere({ baslik: 'Yedek yüklenemedi', mesaj: 'Yedek dosyasında föy yok; hiçbir şey değiştirilmedi.' });
      return false;
    }
    const sec = await pencere({
      baslik: 'Yedekten yükle',
      mesaj: 'Yedekte ' + gelen.length + ' föy var (' + (veri.tarih ? tarihYaz(veri.tarih) : 'tarihsiz') + '). Nasıl yüklensin? "Birleştir": aynı föyün yedekteki hâli yalnızca daha yeniyse geçer. "Hepsini değiştir": bu bilgisayardaki bütün föyler silinip yedektekiler konur. İki yolda da önce şu anki föyleriniz ayrıca indirilecek.',
      html: '<label class="onay"><input type="checkbox" name="ayar" checked> Kurum kimliği ayarları da yedektekiyle değişsin (logo, okul adı, renkler)</label>',
      dugmeler: [
        { ad: 'Vazgeç', deger: false },
        { ad: 'Birleştir', deger: 'birlestir', birincil: true },
        { ad: 'Hepsini değiştir', deger: 'degistir', tehlike: true }
      ]
    });
    if (!sec.deger) return false;
    await Foy.simdiKaydet();
    /* değiştirmeden önce şu anki bütün föylerin ve ayarların tam yedeği indirilir; hazırlanamazsa işlem yapılmaz */
    try {
      await Yedek.al('GERIYUKLEME_ONCESI');
    } catch (x) {
      bildir('Önceki föyleriniz indirilemediği için yükleme yapılmadı; hiçbir şey değiştirilmedi. (' + (x && x.message ? x.message : 'bilinmeyen hata') + ')', true);
      return false;
    }
    if (Foy._kayitHata) {
      await pencere({ baslik: 'Yükleme yapılmadı', mesaj: 'Açık föyünüz tarayıcıya kaydedilemiyor (depolama dolu olabilir). Föy kaybolmasın diye yedekten yükleme yapılmadı. Az önce inen yedek dosyası açık föyün son hâlini de içeriyor.' });
      return false;
    }
    const indi = await pencere({
      baslik: 'Önceki föyleriniz indirildi',
      mesaj: 'Şu anki föylerinizin yedeği ("foy-atolyesi-yedek-GERIYUKLEME_ONCESI-…json") İndirilenler klasörüne indi mi? İndiyse devam edin; inmediyse vazgeçin, hiçbir şey değişmez.',
      dugmeler: [
        { ad: 'Vazgeç', deger: false },
        { ad: 'İndi, devam et', deger: true, birincil: true }
      ]
    });
    if (!indi || !indi.deger) { bildir('Yedekten yükleme yapılmadı; föylerinize dokunulmadı.'); return false; }
    const mevcut = await Depo.foyleriOku();
    let son;
    let eklenen = 0, guncellenen = 0, atlanan = 0;
    if (sec.deger === 'degistir') {
      son = gelen;
    } else {
      const harita = new Map(mevcut.map(f => [f.id, f]));
      gelen.forEach(f => {
        const m = harita.get(f.id);
        if (!m) { harita.set(f.id, f); eklenen++; return; }
        const gz = gelenZaman.get(f), mz = zaman(m.guncelleme);
        /* alan eksik ya da okunamazsa mevcut kalır; yalnızca yedek kesin daha yeniyse geçer */
        if (isFinite(gz) && isFinite(mz) && gz > mz) { harita.set(f.id, f); guncellenen++; }
        else atlanan++;
      });
      son = Array.from(harita.values());
    }
    await Depo.foylerHepsiniDegistir(son);
    try {
      if (sec.secili.ayar && veri.ayar && typeof veri.ayar === 'object' && !Array.isArray(veri.ayar)) {
        Ayar.v = Object.assign({}, Ayar.varsayilan, veri.ayar);
        Ayar.duzelt();
        await Ayar.kaydet();
        Ayar.uygula();
        Ayar.arayuzuYenile();
      }
    } catch (x) {
      bildir('Ayarlar yedekten uygulanamadı: ' + (x && x.message ? x.message : 'bilinmeyen hata') + '. Föyler yüklendi.', true);
    }
    await Foy.acIlkini();
    if (typeof Liste !== 'undefined') Liste.yenile();
    if (sec.deger === 'degistir') bildir('Yedek yüklendi: ' + gelen.length + ' föy.');
    else await pencere({ baslik: 'Yedek birleştirildi', mesaj: 'Yedek birleştirildi: ' + eklenen + ' föy eklendi, ' + guncellenen + ' föy güncellendi, ' + atlanan + ' föy bu bilgisayardaki aynı ya da daha yeni hâli korunduğu için atlandı.' });
    return true;
  }
};

/* ===== Kurum kimliği ayarları ===== */
const YAZI_TIPLERI = {
  kitap: { ad: 'Kitap (Cambria benzeri)', aile: "'FoyKitap',Cambria,Georgia,serif" },
  sade: { ad: 'Sade (Calibri benzeri)', aile: "'FoySade',Calibri,Arial,sans-serif" },
  klasik: { ad: 'Klasik (Times benzeri)', aile: "'FoyKlasik','Times New Roman',serif" },
  net: { ad: 'Net (Arial benzeri)', aile: "'FoyNet',Arial,Helvetica,sans-serif" }
};
const RENKLER = ['#1f5c99', '#0b7285', '#2e7d4f', '#b3261e', '#8e44ad', '#c2410c', '#374151', '#a16207'];
const BASLIK_SABLONLARI = ['Şerit', 'Alt çizgi', 'Sol çubuk', 'Çerçeve', 'Ortalı çizgi'];
const KUTU_BICIMLERI = ['Yumuşak köşeli', 'Başlık şeritli', 'Sol çubuklu'];

const Ayar = {
  varsayilan: {
    okul: '',
    ogretmen: '',
    ders: 'Türk Dili ve Edebiyatı',
    yil: '2026-2027',
    logo: '',
    vurgu: '#1f5c99',
    yazi: 'kitap',
    baslikSablon: 1,
    kutu: 1
  },
  v: {},

  async yukle() {
    let k = null;
    try { k = await Depo.ayarOku(); } catch (x) { k = null; }
    if (!k) k = Depo.ayarKucukOku();
    this.v = Object.assign({}, this.varsayilan, k || {});
    this.duzelt();
    this.uygula();
  },

  duzelt() {
    const v = this.v;
    if (!YAZI_TIPLERI[v.yazi]) v.yazi = 'kitap';
    v.baslikSablon = Math.min(BASLIK_SABLONLARI.length, Math.max(1, parseInt(v.baslikSablon, 10) || 1));
    v.kutu = Math.min(KUTU_BICIMLERI.length, Math.max(1, parseInt(v.kutu, 10) || 1));
    if (!/^#[0-9a-fA-F]{6}$/.test(v.vurgu || '')) v.vurgu = this.varsayilan.vurgu;
    ['okul', 'ogretmen', 'ders', 'yil'].forEach(a => { if (typeof v[a] !== 'string') v[a] = ''; });

  },

  _kaydetGec: null,
  kaydet() { return Depo.ayarYaz(this.v); },

  uygula() {
    const v = this.v, st = document.documentElement.style;
    const r = hexRgb(v.vurgu);
    st.setProperty('--vurgu', rgbHex(r));
    st.setProperty('--vurgu-acik', rgbHex(karistir(r, [255, 255, 255], 0.9)));
    st.setProperty('--vurgu-orta', rgbHex(karistir(r, [255, 255, 255], 0.55)));
    st.setProperty('--vurgu-koyu', rgbHex(karistir(r, [0, 0, 0], 0.28)));
    st.setProperty('--vurgu-yazi', parlaklik(r) > 0.62 ? '#111' : '#fff');

const Sayfa = {
  yaklasim: 1,
  sigdirModu: true,
  _surum: 0,
  _gec: null,
  _bekleyen: null,
  son: null,

  baslat() {
    this._gec = gecikme(() => this.yenileAsil(), 90);
    window.addEventListener('resize', gecikme(() => { if (this.sigdirModu) this.sigdir(); else this.yakinlastir(this.yaklasim); }, 120));
    $('#yakinKucult').addEventListener('click', () => { this.sigdirModu = false; this.yakinlastir(this.yaklasim - 0.1); });
    $('#yakinBuyut').addEventListener('click', () => { this.sigdirModu = false; this.yakinlastir(this.yaklasim + 0.1); });
    $('#yakinSigdir').addEventListener('click', () => { this.sigdirModu = true; this.sigdir(); });

    });
  },

  /* ---- serbest yerleşimli görseller ---- */
  seciliId: null,
  SAYFA_Y: 296.6,
  oran(b) { return (b.gw && b.gh) ? b.gh / b.gw : 0.75; },
  /* ek: alt yazının yüksekliği (mm) */
  kisitla(b, n, ek) {
    ek = ek || 0;
    const oran = this.oran(b);
    let w = Math.min(210, Math.max(10, Number(b.w) || 80));
    let h = w * oran + ek;
    if (h > this.SAYFA_Y) { w = Math.max(10, (this.SAYFA_Y - ek) / oran); h = w * oran + ek; }
    const x = Math.min(210 - w, Math.max(0, Number(b.x) || 0));
    const y = Math.min(this.SAYFA_Y - h, Math.max(0, Number(b.y) || 0));
    const sayfa = Math.min(Math.max(1, n), Math.max(1, parseInt(b.sayfa, 10) || 1));
    return { sayfa, x, y, w, h };
  },
  _yerlestir(el, k) {
    el.style.left = k.x + 'mm'; el.style.top = k.y + 'mm'; el.style.width = k.w + 'mm';
  },
  /* alt yazının mm cinsinden yüksekliği (yakınlaştırmadan etkilenmez) */
  serbestEk(el, b) {
    const sy = el.parentNode; if (!sy || !sy.offsetWidth) return 0;
    const mm = sy.offsetWidth / 210;
    return Math.max(0, el.offsetHeight / mm - (el.offsetWidth / mm) * this.oran(b));
  },
  serbestSinirla() {
    const n = $$('#sayfalar .sayfa').length;
    $$('#sayfalar .serbest').forEach(el => {
      const i = Editor.bul(el.dataset.id); if (i < 0) return;
      const b = Foy.f.bloklar[i];

    });
  },
  serbestCiz(sayfalar) {
    Foy.f.bloklar.forEach(b => {
      if (b.tur !== 'gorsel' || b.mod !== 'serbest' || !b.src) return;
      const k = this.kisitla(b, sayfalar.length);
      const el = document.createElement('div');
      el.className = 'serbest' + (this.seciliId === b.id ? ' secili' : '');
      el.dataset.id = b.id;
      el.tabIndex = 0;
      el.title = 'Sürükleyerek taşıyın; köşeden boyutlandırın';
      el.innerHTML = '<img src="' + e(b.src) + '" alt="" draggable="false" style="aspect-ratio:' + (b.gw && b.gh ? b.gw + '/' + b.gh : '4/3') + '">' + (b.yazi && b.yazi.trim() ? '<div class="sb-yazi">' + e(b.yazi) + '</div>' : '') + '<span class="tutamac"></span>';
      this._yerlestir(el, k);

  },
  sec(id) {
    this.seciliId = id;
    $$('#sayfalar .serbest').forEach(x => x.classList.toggle('secili', x.dataset.id === id));
    if (id) Editor.vurgula(id); else $$('.blokKart.vurgulu').forEach(k => k.classList.remove('vurgulu'));
  },
  _serbestBagla() {
    const kok = $('#sayfalar');
    let s = null;
    const yuv = v => Math.round(v * 10) / 10;
    const hareket = ev => {
      if (!s) return;
      ev.preventDefault();
      const sayfalar = $$('#sayfalar .sayfa');
      if (s.tip === 'tasi') {
        /* imlecin altındaki (ya da en yakın) sayfa */
        let hedef = sayfalar[0], enIyi = Infinity;
        sayfalar.forEach(sy => {
          const r = sy.getBoundingClientRect();
          const d = ev.clientY < r.top ? r.top - ev.clientY : (ev.clientY > r.bottom ? ev.clientY - r.bottom : 0);
          if (d < enIyi) { enIyi = d; hedef = sy; }
        });
        const r = hedef.getBoundingClientRect(), mm = r.width / 210;
        s.b.sayfa = sayfalar.indexOf(hedef) + 1;
        s.b.x = (ev.clientX - r.left) / mm - s.gx;
        s.b.y = (ev.clientY - r.top) / mm - s.gy;
        if (s.el.parentNode !== hedef) hedef.appendChild(s.el);
      } else {
        const r = s.el.parentNode.getBoundingClientRect(), mm = r.width / 210;
        const oran = (s.b.gw && s.b.gh) ? s.b.gh / s.b.gw : 0.75;
        let w = s.w0 + (ev.clientX - s.cx0) / mm;
        w = Math.min(w, 210 - s.b.x, (this.SAYFA_Y - s.b.y - s.ek) / oran);
        s.b.w = Math.max(10, w);
      }
      const k = this.kisitla(s.b, sayfalar.length, s.ek);
      s.b.x = yuv(k.x); s.b.y = yuv(k.y); s.b.w = yuv(k.w); s.b.sayfa = k.sayfa;
      this._yerlestir(s.el, this.kisitla(s.b, sayfalar.length, s.ek));
      s.oynadi = true;
    };
    const bitti = () => {
      if (!s) return;
      window.removeEventListener('pointermove', hareket);
      window.removeEventListener('pointerup', bitti);
      window.removeEventListener('pointercancel', bitti);
      s.el.classList.remove('surukleniyor');
      try { s.el.focus({ preventScroll: true }); } catch (x) { /* yoksay */ }
      if (s.oynadi) { this.serbestSinirla(); Foy.degisti(false); Editor.guncelleSerbest(s.b.id); }

    kok.addEventListener('pointerdown', ev => {

      b.x = yuv((er.left - r.left) / mm); b.y = yuv((er.top - r.top) / mm); b.w = yuv(er.width / mm);
      s = { ek: this.serbestEk(el, b), el, b, tip: ev.target.closest('.tutamac') ? 'boyut' : 'tasi', gx: (ev.clientX - er.left) / mm, gy: (ev.clientY - er.top) / mm, w0: b.w, cx0: ev.clientX, oynadi: false };
      el.classList.add('surukleniyor');
      window.addEventListener('pointermove', hareket, { passive: false });
      window.addEventListener('pointerup', bitti);
      window.addEventListener('pointercancel', bitti);
    });
    kok.addEventListener('keydown', ev => {
      const el = ev.target.closest && ev.target.closest('.serbest');
      if (!el) return;
      const yon = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
      if (!yon) return;
      const i = Editor.bul(el.dataset.id); if (i < 0) return;
      ev.preventDefault();
      const b = Foy.f.bloklar[i], adim = ev.shiftKey ? 5 : 1;
      const n = $$('#sayfalar .sayfa').length;
      const ek = this.serbestEk(el, b);
      let k = this.kisitla(b, n, ek);
      b.x = k.x + yon[0] * adim; b.y = k.y + yon[1] * adim; b.w = k.w; b.sayfa = k.sayfa;
      k = this.kisitla(b, n, ek);
      b.x = yuv(k.x); b.y = yuv(k.y); b.w = yuv(k.w);
      this._yerlestir(el, this.kisitla(b, n, ek));
      Foy.degisti(false); Editor.guncelleSerbest(b.id);
    });
  },

  yenile() { if (this._gec) this._gec(); },
  hemenYenile() { return this.yenileAsil(); },

  async fontlariBekle() {
    try {
      const aile = (YAZI_TIPLERI[Ayar.v.yazi] || YAZI_TIPLERI.kitap).aile.split(',')[0].replace(/'/g, '');
      const yuk = [];
      ['400', '700'].forEach(w => ['normal', 'italic'].forEach(st => yuk.push(document.fonts.load(st + ' ' + w + " 1em '" + aile + "'", 'ŞşĞğİıÖöÜüÇçÂâÎîÛû'))));
      yuk.push(document.fonts.load("700 1em 'FoySade'", 'ŞşĞğİı'), document.fonts.load("400 1em 'FoySade'", 'ŞşĞğİı'));
      await Promise.race([Promise.all(yuk), new Promise(r => setTimeout(r, 2500))]);
    } catch (x) { /* yazı tipi yüklenemese de devam */ }
  },

  /* Ölçü sayfası: gerçek sayfayla aynı stil ve genişlikte, görünmez */
  _olcuKur(ncol, yz) {
    let kap = $('#olcuKap');
    if (!kap) {
      kap = document.createElement('div');
      kap.id = 'olcuKap';
      kap.style.cssText = 'position:absolute;left:-12000px;top:0;visibility:hidden;pointer-events:none';
      document.body.appendChild(kap);
    }
    kap.innerHTML = '';
    const saveYz = Foy.f.yz;
    Foy.f.yz = yz;

  /* Saf hesap: blokları sütunlara dağıtır, sayfa içeriklerini döndürür */
  hesapla(yz) {
    const f = Foy.f, surum = Foy.surum;
    const ncol = f.sutun === 2 ? 2 : 1;
    const sayfaOl = this._olcuKur(ncol, yz);
    const sut = $('.sutun', sayfaOl);
    const kunye = $('.kunye', sayfaOl);
    const sutunlar = $('.sutunlar', sayfaOl);
    const H0 = sutunlar.getBoundingClientRect().height;
    kunye.style.display = 'none';
    const H1 = sutunlar.getBoundingClientRect().height;
    kunye.style.display = '';
    const GUV = 1.5;
    const uyarilar = [];
    const slotlar = [];
    const slotYuk = [];
    let no = -1, slotH = 0, kalan = 0;
    const slotYuksekligi = n => (Math.floor(n / ncol) === 0 ? H0 : H1) - GUV;
    const yeniSlot = () => { no++; slots_push(); slotH = slotYuksekligi(no); kalan = slotH; };
    const slots_push = () => { slotlar.push([]); slotYuk.push(0); };
    yeniSlot();
    const ustte = () => kalan >= slotH - 0.5;
    const olc = el => { sut.appendChild(el); const h = el.getBoundingClientRect().height; sut.removeChild(el); return h; };
    const ekle = (el, h) => { slotlar[no].push(el); slotYuk[no] += h; kalan -= h; };
    const olustur = html => { const t = document.createElement('template'); t.innerHTML = html; return t.content.firstElementChild; };
    const kabuk = (el, devam) => {
      const k = el.cloneNode(true);
      const bol = k.matches('[data-bol]') ? k : k.querySelector('[data-bol]');
      bol.innerHTML = '';
      if (devam) { const h = bol.closest('.kutu,.alinti'); if (h) h.classList.add('devam'); }
      return { k, bol };
    };
    const uyar = m => { if (!uyarilar.includes(m)) uyarilar.push(m); };

    /* blokları çiz */
    const ogeler = [];
    f.bloklar.forEach((b, i) => {
      const h = Bloklar.render(b, surum);
      if (!h) return;
      const el = olustur(h);
      if (el) ogeler.push({ b, el, sira: i + 1 });
    });

    const ilkParcaYuksekligi = (el) => {
      const bol = el.matches('[data-bol]') ? el : el.querySelector('[data-bol]');
      if (bol && bol.children.length) {
        const { k, bol: kb } = kabuk(el, false);
        kb.appendChild(bol.children[0].cloneNode(true));
        return olc(k);
      }
      return olc(el.cloneNode(true));
    };

    const koy = (el, sira) => {
      const h = olc(el);
      if (h <= kalan) { ekle(el, h); return; }
      const bolunur = el.dataset.bolunur === '1';
      const sonrakiH = slotYuksekligi(no + 1);
      if (!bolunur && h <= sonrakiH) {
        if (!ustte()) yeniSlot();
        if (h <= kalan) { ekle(el, h); return; }
      }
      const bol = el.matches('[data-bol]') ? el : el.querySelector('[data-bol]');
      if (!bol) {
        if (!ustte()) yeniSlot();
        uyar(sira + '. blok sayfaya sığmıyor (kırpıldı). Genişliğini küçültün.');
        ekle(el, Math.min(h, kalan));
        return;
      }
      const birimler = Array.from(bol.children);
      let { k, bol: kb } = kabuk(el, false);
      let adet = 0;
      const bitir = () => { if (adet) ekle(k, olc(k)); };
      for (const u of birimler) {
        kb.appendChild(u); adet++;
        let hp = olc(k);
        if (hp <= kalan) continue;
        kb.removeChild(u); adet--;
        /* "Çözüm:" / "Cevap:" etiketi kendi içeriğinden ayrı kalmasın */
        const tasinan = [];
        while (adet > 0 && kb.lastElementChild.classList.contains('cz-et')) { tasinan.unshift(kb.lastElementChild); kb.removeChild(kb.lastElementChild); adet--; }
        if (adet === 0) {
          tasinan.forEach(x => { kb.appendChild(x); adet++; });
          if (!ustte()) yeniSlot();
          kb.appendChild(u); adet++;
          hp = olc(k);
          if (hp > kalan) uyar(sira + '. blokta bir parça tam sayfadan büyük (kırpıldı).');
          continue;
        }
        bitir();
        yeniSlot();
        ({ k, bol: kb } = kabuk(el, true)); adet = 0;
        tasinan.forEach(x => { kb.appendChild(x); adet++; });
        kb.appendChild(u); adet++;
        hp = olc(k);
        if (hp > kalan) uyar(sira + '. blokta bir parça tam sayfadan büyük (kırpıldı).');
      }
      bitir();
    };

    ogeler.forEach((o, i) => {
      if (o.el.dataset.sonrakiyle === '1' && ogeler[i + 1]) {
        const hb = olc(o.el);
        const hn = Math.min(ilkParcaYuksekligi(ogeler[i + 1].el), slotYuksekligi(no + 1));
        if (hb + hn > kalan && !ustte()) yeniSlot();
      }
      koy(o.el, o.sira);
    });

    /* sondaki boş sütunları at */
    while (slotlar.length > 1 && slotlar[slotlar.length - 1].length === 0) { slotlar.pop(); slotYuk.pop(); }
    const sayfaSayisi = Math.max(1, Math.ceil(slotlar.length / ncol));
    const sonSayfaYuk = [];
    for (let s = (sayfaSayisi - 1) * ncol; s < sayfaSayisi * ncol; s++) sonSayfaYuk.push(slotYuk[s] || 0);
    const sonDoluluk = sayfaSayisi === 1 ? 1 : sonSayfaYuk.reduce((x, y) => x + y, 0) / (H1 * ncol);
    const kap = $('#olcuKap'); if (kap) kap.innerHTML = '';
    return { slotlar, ncol, sayfaSayisi, uyarilar, sonDoluluk, H0, H1 };
  },

  async yenileAsil() {
    if (!Foy.f) return;
    const surumNo = ++this._surum;
    await this.fontlariBekle();
    if (surumNo !== this._surum) return;
    const f = Foy.f;
    const s = this.hesapla(f.yz);
    this.son = s;
    const kap = $('#sayfalar');
    const sayfalar = [];
    for (let p = 0; p < s.sayfaSayisi; p++) {
      const sy = sayfaKur(p + 1, s.sayfaSayisi, s.ncol, p === 0);
      const sutunlar = $$('.sutun', sy);
      for (let c = 0; c < s.ncol; c++) (s.slotlar[p * s.ncol + c] || []).forEach(el => sutunlar[c].appendChild(el));
      /* son blok altındaki boşluğu kaldır */
      sutunlar.forEach(su => { const son = su.lastElementChild; if (son && son.classList.contains('b')) son.classList.add('bitis'); });
      sayfalar.push(sy);
    }
    this.serbestCiz(sayfalar);
    kap.replaceChildren(...sayfalar);
    this.serbestSinirla();
    $('#sayfaBilgi').textContent = s.sayfaSayisi + ' sayfa · ' + (Foy.surum === 'ogretmen' ? 'Öğretmen sürümü' : 'Öğrenci sürümü');
    this._uyariYaz(s, null);
    this.boyutla();
    if (this.sigdirModu) this.sigdir(); else this.yakinlastir(this.yaklasim);
    /* sığdırma önerisini sonra hesapla (ekranı bekletmesin) */
    clearTimeout(this._oneriZ);
    this._oneriZ = setTimeout(() => { if (surumNo === this._surum) this._oneri(surumNo, s); }, 80);
  },

  _uyariYaz(s, oneri) {
    const k = $('#uyariKutu');
    let h = s.uyarilar.map(u => '<span class="uyari">⚠ ' + e(u) + '</span>').join('');
    if (oneri) h += '<span class="oneri">Son sayfada az içerik var: yazıyı %' + Math.round(oneri.yz * 100) + ' boyuta getirirseniz ' + oneri.sayfa + ' sayfa olur. <button type="button" data-yz="' + oneri.yz + '">Uygula</button></span>';
    k.innerHTML = h;
  },

  /* Son sayfaya az taşma varsa yazıyı biraz küçültmeyi önerir */
  _oneri(surumNo, s) {
    if (s.sayfaSayisi < 2 || s.sonDoluluk > 0.4 || s.sonDoluluk <= 0) return;
    const f = Foy.f;
    const asil = f.yz;
    for (let z = Math.round(asil * 100) - 2; z >= Math.max(75, Math.round(asil * 100) - 14); z -= 2) {
      if (surumNo !== this._surum) return;
      const d = this.hesapla(z / 100);
      if (d.sayfaSayisi < s.sayfaSayisi && !d.uyarilar.length) {
        this._uyariYaz(s, { yz: z / 100, sayfa: d.sayfaSayisi });
        return;
      }
    }
  },

  /* ---- yakınlaştırma (dönüşümle; eski tarayıcılarda da çalışır) ---- */
  boyutla() {
    const sar = $('#sayfalarSar'), ic = $('#sayfalar');
    ic.style.transform = 'scale(' + this.yaklasim + ')';
    sar.style.width = (ic.offsetWidth * this.yaklasim) + 'px';
    sar.style.height = (ic.offsetHeight * this.yaklasim) + 'px';
    $('#yakinDeger').textContent = Math.round(this.yaklasim * 100) + '%';
  },
  yakinlastir(z) {
    this.yaklasim = Math.min(2.5, Math.max(0.25, z));
    this.boyutla();
  },
  sigdir() {
    const kap = $('#sayfalarKap'), ic = $('#sayfalar');
    const w = ic.offsetWidth || 794;
    this.yaklasim = Math.min(1.6, Math.max(0.25, (kap.clientWidth - 40) / w));
    this.boyutla();
  },

  /* ---- yazdırma ---- */
  async yazdir() {
    await Foy.simdiKaydet();
    await this.yenileAsil();
    if (this.son && this.son.uyarilar.length) {
      const dev = await sor('Dikkat', 'Föyde sayfaya sığmayan parçalar var (' + this.son.uyarilar.length + '). Yine de yazdırılsın mı?', 'Yazdır', 'Vazgeç');
      if (!dev) return;
    }
    /* yazdırırken ölçek 1 olsun */
    const ic = $('#sayfalar'), eski = ic.style.transform;
    const eskiAd = document.title;
    document.title = (Foy.f.ad.trim() || 'foy') + (Foy.surum === 'ogrenci' ? ' - ogrenci' : ' - ogretmen');
    ic.style.transform = 'none';
    const geri = () => { ic.style.transform = eski; document.title = eskiAd; window.removeEventListener('afterprint', geri); };
    window.addEventListener('afterprint', geri);
    window.print();
  }
};


/* ===== Tam ekran sunum görünümü (akıllı tahta) ===== */
const Sunum = {
  no: 0, sayfalar: [], acik: false,
  ac() {
    const kaynak = $$('#sayfalar .sayfa');
    if (!kaynak.length) return;
    this.sayfalar = kaynak.map(s => s.cloneNode(true));
    this.sayfalar.forEach(s => s.querySelectorAll('.serbest').forEach(x => { x.classList.remove('secili'); x.removeAttribute('tabindex'); x.style.cursor = 'default'; }));
    this.no = 0;
    const k = document.createElement('div');
    k.id = 'sunum';
    k.innerHTML = '<div class="sunKap"></div><div class="sunBar"><button type="button" data-sun="geri" title="Önceki (←)">‹</button><span class="sunNo"></span><button type="button" data-sun="ileri" title="Sonraki (→)">›</button><button type="button" data-sun="kapat" title="Kapat (Esc)">✕</button></div>';
    document.body.appendChild(k);
    this.acik = true;
    this._tus = ev => {
      if (ev.key === 'Escape') { ev.preventDefault(); this.kapat(); }
      else if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(ev.key)) { ev.preventDefault(); this.git(this.no + 1); }
      else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(ev.key)) { ev.preventDefault(); this.git(this.no - 1); }
      else if (ev.key === 'Home') this.git(0);
      else if (ev.key === 'End') this.git(this.sayfalar.length - 1);
    };
    this._boy = () => this.olcekle();
    document.addEventListener('keydown', this._tus, true);
    window.addEventListener('resize', this._boy);
    k.addEventListener('click', ev => {
      const b = ev.target.closest('button[data-sun]');
      if (b) { if (b.dataset.sun === 'kapat') this.kapat(); else this.git(this.no + (b.dataset.sun === 'ileri' ? 1 : -1)); return; }
      if (ev.target.closest('.sunBar')) return;
      this.git(this.no + (ev.clientX < window.innerWidth / 3 ? -1 : 1));
    });
    try { if (k.requestFullscreen) k.requestFullscreen().catch(() => {}); } catch (x) { /* yoksay */ }
    document.addEventListener('fullscreenchange', this._fs = () => { if (!document.fullscreenElement && this.acik) this.kapat(); });
    this.goster();
  },
  goster() {
    const kap = $('#sunum .sunKap');
    kap.replaceChildren(this.sayfalar[this.no]);
    $('#sunum .sunNo').textContent = (this.no + 1) + ' / ' + this.sayfalar.length;
    this.olcekle();
  },
  olcekle() {
    const kap = $('#sunum .sunKap'); if (!kap) return;
    const sy = kap.firstElementChild;
    const w = sy.offsetWidth || 794, h = sy.offsetHeight || 1121;
    const o = Math.min(window.innerWidth / w, window.innerHeight / h);
    kap.style.transform = 'translateX(' + (-w * o / 2) + 'px) scale(' + o + ')';
    kap.style.top = Math.max(0, (window.innerHeight - h * o) / 2) + 'px';
  },
  git(n) {
    n = Math.max(0, Math.min(this.sayfalar.length - 1, n));
    if (n === this.no) return;
    this.no = n; this.goster();
  },
  kapat() {
    if (!this.acik) return;
    this.acik = false;
    document.removeEventListener('keydown', this._tus, true);
    window.removeEventListener('resize', this._boy);
    document.removeEventListener('fullscreenchange', this._fs);
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (x) { /* yoksay */ }
    const k = $('#sunum'); if (k) k.remove();
  }
};

    k.ad = (f.ad || 'Adsız föy') + ' (kopya)';
    k.olusturma = k.guncelleme = Date.now();
    k.bloklar.forEach(b => { b.id = yeniId(); });
    await Depo.foyYaz(k);
    bildir('Föy kopyalandı.');
    this.yenile();
  },

  async sil(id) {
    const l = await Depo.foyleriOku();
    const f = l.find(x => x.id === id);
    if (!f) return;
    if (!(await sor('Föyü sil', '"' + (f.ad || 'Adsız föy') + '" silinsin mi? Bu işlem geri alınamaz. (Silmeden önce "Yedek al" ile saklayabilirsiniz.)', 'Sil', 'Vazgeç', true))) return;
    const acikMi = Foy.f && Foy.f.id === id;
    if (acikMi) { Foy._gec.iptal(); }
    await Depo.foySil(id);
    if (acikMi) { Foy.f = null; await Foy.acIlkini(); }

};

const YZ = {
