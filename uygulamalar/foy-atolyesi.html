    return s.join('\n\n');
  },

  /* ================= CEVAP ÇÖZÜMLEME ================= */
  gerekliAlanlar: { baslik: ['baslik'], alinti: ['metin'], gorsel: ['altyazi'], tablo: [], anlatim: ['metin'], bilgi: ['metin'], dikkat: ['metin'], ornek: ['soru', 'cozum'], sirasizde: ['soru', 'cevap'] },

  cozumle(metin, tur) {
    let s = String(metin || '').trim();
    if (!s) throw new Error('Cevap boş geldi.');
    const f = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (f) s = f[1].trim();
    const a = s.indexOf('{'), z = s.lastIndexOf('}');
    if (a < 0 || z <= a) throw new Error('Cevapta JSON biçimi bulunamadı. Claude\'a "yalnızca JSON ver" diyerek yeniden isteyin.');
    let o;
    try { o = JSON.parse(s.slice(a, z + 1)); } catch (x) { throw new Error('Cevap beklenen biçimde okunamadı (JSON bozuk). Yeniden deneyin.'); }
    if (tur === 'tablo') return this._tabloCozumle(o);
    const eksik = this.gerekliAlanlar[tur].filter(k => typeof o[k] !== 'string' || !o[k].trim());
    if (eksik.length) throw new Error('Cevapta şu alanlar eksik: ' + eksik.join(', ') + '. Yeniden deneyin.');
    const temiz = {};
    Array.from(new Set(['baslik', 'alt', ...this.gerekliAlanlar[tur]])).forEach(k => { if (typeof o[k] === 'string') temiz[k] = o[k].trim().slice(0, 20000); });
    return temiz;
  },

  /* Kalın/eğik işaretlerini atar (başlık, şiir, tablo hücresi gibi düz alanlar için) */
  duzle(m) { return String(m == null ? '' : m).replace(/\*\*(.+?)\*\*/g, '$1').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1$2').replace(/\r/g, '').trim(); },

  _tabloCozumle(o) {
    const hucre = x => this.duzle(typeof x === 'string' || typeof x === 'number' ? String(x) : '').slice(0, 2000);
    const bas = Array.isArray(o.basliklar) ? o.basliklar.map(hucre) : [];
    const sat = Array.isArray(o.satirlar) ? o.satirlar.filter(Array.isArray).map(r => r.map(hucre)) : [];
    if (!bas.length || !bas.some(Boolean)) throw new Error('Cevapta tablo sütun başlıkları (basliklar) yok. Yeniden deneyin.');
    if (!sat.length) throw new Error('Cevapta tablo satırları (satirlar) yok. Yeniden deneyin.');
    return { yazi: hucre(o.yazi).slice(0, 300), basliklar: bas.slice(0, 12), satirlar: sat.slice(0, 39).map(r => r.slice(0, 12)) };
  },

  /* Düz metni (**kalın**, - madde) güvenli HTML'e çevirir */
  metniHtmlYap(m) {
    const satirlar = String(m || '').replace(/\r/g, '').split('\n');
    const cikti = [];
    let para = [], liste = null;
    const satirIci = t => e(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<i>$2</i>');
    const paraBitir = () => { if (para.length) { cikti.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
    const listeBitir = () => { if (liste) { cikti.push('<' + liste.t + '>' + liste.m.map(x => '<li>' + x + '</li>').join('') + '</' + liste.t + '>'); liste = null; } };
    satirlar.forEach(sat => {
      if (!sat.trim()) { paraBitir(); listeBitir(); return; }
      const mm = /^\s*([-•]|\*(?=\s)|\d+[.)])\s+(.*)$/.exec(sat);
      if (mm) {
        paraBitir();
        const t = /\d/.test(mm[1]) ? 'ol' : 'ul';
        if (liste && liste.t !== t) listeBitir();
        if (!liste) liste = { t, m: [] };
        liste.m.push(satirIci(mm[2]));
      } else {
        listeBitir();
        para.push(satirIci(sat.trim()));
      }
    });
    paraBitir(); listeBitir();
    return temizHtml(cikti.join(''));
  },

  /* ================= GEMİNİ ================= */
  async gemini(istem, sinyal) {
    const anahtar = this.anahtarOku();
    if (!anahtar) { const h = new Error('Gemini anahtarı girilmemiş. "Kurum kimliği" sekmesinde anahtarı yapıştırın ya da "Claude için kopyala" yolunu kullanın.'); h.tur = 'anahtar'; throw h; }
    let res;
    try {
      res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + YZ_MODEL + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': anahtar },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: istem }] }],
          generationConfig: { temperature: 0.7, responseMimeType: 'application/json', thinkingConfig: { thinkingBudget: 0 } }
        }),
        signal: sinyal
      });
    } catch (x) {
      if (x && x.name === 'AbortError') throw x;
      throw new Error('Gemini\'ye ulaşılamadı. İnternet bağlantınızı kontrol edin (okul ağı engelliyor olabilir). "Claude için kopyala" yolu internetsiz de çalışır.');
    }
    this.sayacArtir();
    if (!res.ok) {
      let ileti = '';
      try { const j = await res.json(); ileti = (j && j.error && j.error.message) || ''; } catch (x) { /* yoksay */ }
      if (res.status === 429) throw new Error('Gemini ücretsiz günlük kotası doldu (ya da çok sık istek gönderildi). Biraz bekleyin ya da yarın tekrar deneyin; şimdilik "Claude için kopyala" yolunu kullanabilirsiniz.');
      if (res.status === 400 && /api key/i.test(ileti)) throw new Error('Gemini anahtarı geçersiz. "Kurum kimliği" sekmesinde anahtarı kontrol edin.');
      if (res.status === 400) throw new Error('Gemini isteği kabul etmedi: ' + (ileti || 'bilinmeyen hata'));
      if (res.status === 401 || res.status === 403) throw new Error('Gemini bu anahtara izin vermedi (' + res.status + '). Anahtarın doğru ve etkin olduğundan emin olun.');
      if (res.status === 404) throw new Error('Gemini modeli bulunamadı (' + YZ_MODEL + '). Uygulamanın yeni sürümü gerekebilir.');
      if (res.status >= 500) throw new Error('Gemini şu an yanıt veremiyor (' + res.status + '). Biraz sonra tekrar deneyin.');
      throw new Error('Gemini hatası (' + res.status + '): ' + (ileti || 'bilinmeyen'));
    }
    let j;
    try { j = await res.json(); } catch (x) { throw new Error('Gemini\'den gelen cevap okunamadı.'); }
    const aday = j && j.candidates && j.candidates[0];
    const metin = aday && aday.content && aday.content.parts ? aday.content.parts.map(p => p.text || '').join('') : '';
    if (!metin) {
      const neden = (j && j.promptFeedback && j.promptFeedback.blockReason) || (aday && aday.finishReason) || '';
      throw new Error('Gemini boş cevap verdi' + (neden ? ' (' + neden + ')' : '') + '. İsteği değiştirip yeniden deneyin.');
    }
    return metin;
  },

  /* ================= ARAYÜZ ================= */
  _kapat() {
    if (this.iptal) { try { this.iptal.abort(); } catch (x) { /* yoksay */ } this.iptal = null; }
    const k = $('#modalKatman'); k.hidden = true; k.innerHTML = '';
    document.removeEventListener('keydown', this._tus, true);
    this.hedef = null;
  },
  _ciz(html) {
    const k = $('#modalKatman');
    k.innerHTML = '<div class="modal yzModal" role="dialog" aria-modal="true">' + html + '</div>';
    k.hidden = false;
    return $('.modal', k);
  },

  ac(id) {
    const i = Editor.bul(id);
    if (i < 0) return;
    const b = Foy.f.bloklar[i];
    if (!YZ_TURLERI.includes(b.tur)) return;
    this.hedef = { id, tur: b.tur };
    this._tus = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); this._kapat(); } };
    document.addEventListener('keydown', this._tus, true);
    this.formGoster();
  },

  _mevcutMetin(b) {
    const d = x => this._duz(x);
    if (b.tur === 'baslik') return [b.metin === 'Yeni başlık' ? '' : b.metin, b.alt].filter(x => x && x.trim()).join(' — ');
    if (b.tur === 'alinti') return b.metin;
    if (b.tur === 'tablo') return b.h.filter(r => r.some(c => String(c).trim())).map(r => r.join(' | ')).join('\n');
    if (b.tur === 'gorsel') return b.yazi;
    if (b.tur === 'ornek') return [d(b.soru), d(b.cozum)].filter(Boolean).join('\n\n');
    if (b.tur === 'sirasizde') return [d(b.soru), d(b.cevap)].filter(Boolean).join('\n\n');
    return d(b.html);
  },

  formGoster(oncekiYonerge, oncekiDuzey) {
    const b = Foy.f.bloklar[Editor.bul(this.hedef.id)];
    const f = Foy.f;
    const konu = f.konu || f.ad || 'bu konu';
    const ornekler = {
      baslik: konu + ' bölümü için kısa ve açık bir başlık öner.',
      alinti: konu + ' konusunu çalıştırmaya uygun, kısa ve özgün bir ' + (b.stil === 'duz' ? 'metin parçası' : 'şiir') + ' yaz.',
      tablo: konu + ' konusundaki kavramları tanımı ve birer örneğiyle karşılaştıran bir tablo hazırla.',
      gorsel: 'Görselde şunlar var: … (görseli kısaca anlatın). Buna uygun kısa bir alt yazı yaz.',
      anlatim: konu + ' konusunu ' + (f.sinif ? f.sinif + '. sınıf' : 'lise') + ' düzeyinde, örneklerle kısaca anlat.',
      bilgi: konu + ' kavramının tanımını kısa ve net yaz.',
      dikkat: konu + ' konusunda öğrencilerin en sık karıştırdığı noktayı uyar.',
      ornek: konu + ' ile ilgili, bir dize verip çözümleyen çözümlü bir örnek yaz.',
      sirasizde: konu + ' ile ilgili, öğrencinin bir dize ya da metin parçası üzerinde uygulama yapacağı bir alıştırma yaz.'
    };
    const soruMu = b.tur === 'ornek' || b.tur === 'sirasizde';
    const anahtarVar = !!this.anahtarOku();
    const m = this._ciz(
      '<h3>Yapay zekâ ile taslak — ' + e(Bloklar.turler[b.tur].ad) + '</h3>' +
      '<div class="alan"><label for="yzYonerge">' + (b.tur === 'gorsel' ? 'Görselde ne var? Kısaca anlatın.' : 'Ne yazılsın?') + '</label><textarea id="yzYonerge" rows="4">' + e(oncekiYonerge || (b.ipucu && b.tur !== 'gorsel' ? konu + ' konusu için: ' + b.ipucu : ornekler[b.tur])) + '</textarea></div>' +
      (soruMu ? '<div class="alan"><label for="yzDuzey">Soru düzeyi</label><select id="yzDuzey">' + ['Temel', 'Orta', 'Zor'].map(x => '<option' + ((oncekiDuzey || 'Orta') === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' : '') +
      '<div class="ipucu">Gelen metin bloğa kendiliğinden kaydedilmez; önce size gösterilir, siz onaylarsanız bloğa yerleşir ve istediğiniz gibi düzeltirsiniz.</div>' +
      '<div class="dugmeler"><button type="button" class="btn" data-yz-islem="vazgec">Vazgeç</button>' +
      '<button type="button" class="btn" data-yz-islem="claude">Claude için kopyala</button>' +
      '<button type="button" class="btn birincil" data-yz-islem="gemini">Gemini ile yaz</button></div>' +
      (anahtarVar ? '' : '<div class="ipucu" style="margin-top:8px">Gemini anahtarı girilmemiş; "Gemini ile yaz" anahtar ister. "Claude için kopyala" anahtarsız çalışır.</div>')
    );
    m.addEventListener('click', ev => {
      const bt = ev.target.closest('button[data-yz-islem]');
      if (!bt) return;
      const yon = $('#yzYonerge', m).value.trim();
      const duz = $('#yzDuzey', m) ? $('#yzDuzey', m).value : 'Orta';
      const ne = bt.dataset.yzIslem;
      if (ne === 'vazgec') { this._kapat(); return; }
      if (!yon) { bildir('Önce ne yazılacağını belirtin.', true); return; }
      const istem = this.istemYap(b.tur, yon, duz, this._mevcutMetin(b), b);
      if (ne === 'gemini') this.geminiCalistir(istem, yon, duz);
      else this.claudeGoster(istem, yon, duz);
    });
    const t = $('#yzYonerge', m); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  },

  async geminiCalistir(istem, yon, duz) {
    const denetim = new AbortController();
    this.iptal = denetim;
    const zaman = setTimeout(() => denetim.abort(), 60000);
    const m = this._ciz('<h3>Gemini yazıyor…</h3><p>Birkaç saniye sürebilir.</p><div class="dugmeler"><button type="button" class="btn" data-yz-islem="durdur">Durdur</button></div>');
    let durduruldu = false;
    m.addEventListener('click', ev => { if (ev.target.closest('[data-yz-islem=durdur]')) { durduruldu = true; denetim.abort(); } });
    try {
      const ham = await this.gemini(istem, denetim.signal);
      clearTimeout(zaman);
      if (!this.hedef) return;
      const sonuc = this.cozumle(ham, this.hedef.tur);
      this.onizle(sonuc, 'Gemini', yon, duz);
    } catch (x) {
      clearTimeout(zaman);
      if (!this.hedef) return;            // pencere kapatıldı
      if (x && x.name === 'AbortError') {
        this.hataGoster(durduruldu ? 'İstek durduruldu.' : 'Gemini 60 saniyede cevap vermedi. Tekrar deneyin ya da "Claude için kopyala" yolunu kullanın.', yon, duz);
      } else {
        this.hataGoster(x && x.message ? x.message : 'Bilinmeyen bir hata oldu.', yon, duz);
      }
    } finally { this.iptal = null; }
  },

  hataGoster(mesaj, yon, duz) {
    const m = this._ciz('<h3>Taslak alınamadı</h3><p class="mesaj">' + e(mesaj) + '</p><div class="dugmeler"><button type="button" class="btn" data-yz-islem="vazgec">Kapat</button><button type="button" class="btn birincil" data-yz-islem="geri">Geri dön</button></div>');
    m.addEventListener('click', ev => {
      const bt = ev.target.closest('button[data-yz-islem]'); if (!bt) return;
      if (bt.dataset.yzIslem === 'vazgec') this._kapat(); else this.formGoster(yon, duz);
    });
  },

  claudeGoster(istem, yon, duz) {
    const m = this._ciz(
      '<h3>Claude için kopyala / yapıştır</h3>' +
      '<div class="ipucu" style="margin-bottom:6px"><b>1.</b> Aşağıdaki metni kopyalayıp Claude\'a yapıştırın. <b>2.</b> Claude\'un cevabını aşağıdaki ikinci kutuya yapıştırın. <b>3.</b> "Cevabı işle"ye basın.</div>' +
      '<div class="alan"><label>Claude\'a gönderilecek metin</label><textarea id="yzIstem" rows="6" readonly>' + e(istem) + '</textarea></div>' +
      '<div style="margin:-4px 0 10px"><button type="button" class="btn" data-yz-islem="kopyala">Metni kopyala</button> <span id="yzKopyaDurum" class="ipucu"></span></div>' +
      '<div class="alan"><label for="yzCevap">Claude\'un cevabı</label><textarea id="yzCevap" rows="6" placeholder="Cevabı buraya yapıştırın"></textarea></div>' +
      '<div class="dugmeler"><button type="button" class="btn" data-yz-islem="geri">Geri</button><button type="button" class="btn" data-yz-islem="vazgec">Vazgeç</button><button type="button" class="btn birincil" data-yz-islem="isle">Cevabı işle</button></div>'
    );
    m.addEventListener('click', async ev => {
      const bt = ev.target.closest('button[data-yz-islem]'); if (!bt) return;
      const ne = bt.dataset.yzIslem;
      if (ne === 'vazgec') this._kapat();
      else if (ne === 'geri') this.formGoster(yon, duz);
      else if (ne === 'kopyala') {
        const ta = $('#yzIstem', m);
        let ok = false;
        try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (x) {
          try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (z) { ok = false; }
        }
        $('#yzKopyaDurum', m).textContent = ok ? 'Kopyalandı ✓' : 'Kopyalanamadı; metni elle seçip kopyalayın.';
      } else if (ne === 'isle') {
        try {
          const sonuc = this.cozumle($('#yzCevap', m).value, this.hedef.tur);
          this.onizle(sonuc, 'Claude', yon, duz);
        } catch (x) { bildir(x.message, true); }
      }
    });
  },

  /* Gelen öneriyi gösterir; onaylanırsa bloğa yerleştirir */
  onizle(sonuc, kaynak, yon, duz) {
    /* yanıt beklenirken hedef blok silinmiş ya da pencere kapatılmış olabilir */
    const hi = this.hedef ? Editor.bul(this.hedef.id) : -1;
    const b = hi >= 0 && Foy.f ? Foy.f.bloklar[hi] : null;
    if (!b) {
      this._kapat();
      bildir('Hedef bölüm silindiği için öneri uygulanmadı.', true);
      return;
    }
    const tur = this.hedef.tur;
    const duzG = t => '<div style="white-space:pre-wrap">' + e(t) + '</div>';
    const parca = (et, ic) => '<div class="etiket" style="margin-top:8px">' + et + '</div><div class="foyi yzOnizle">' + ic + '</div>';
    let goster = '';
    if (tur === 'tablo') {
      goster = (sonuc.yazi ? parca('Tablo yazısı', duzG(sonuc.yazi)) : '') +
        parca('Tablo', '<table class="tbl"><thead><tr>' + sonuc.basliklar.map(x => '<th>' + e(x) + '</th>').join('') + '</tr></thead><tbody>' +
          sonuc.satirlar.map(r => '<tr>' + r.map(x => '<td>' + e(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
    } else {
      const alanlar = { baslik: [['baslik', 'Başlık', 'd'], ['alt', 'Alt başlık', 'd']], alinti: [['metin', 'Metin', 'd']], gorsel: [['altyazi', 'Alt yazı', 'd']], anlatim: [['metin', 'Anlatım']], bilgi: [['baslik', 'Başlık', 'd'], ['metin', 'Bilgi']], dikkat: [['metin', 'Not']], ornek: [['soru', 'Örnek'], ['cozum', 'Çözüm']], sirasizde: [['soru', 'Soru'], ['cevap', 'Cevap']] }[tur];
      goster = alanlar.filter(a => sonuc[a[0]]).map(a => parca(a[1], a[2] ? duzG(this.duzle(sonuc[a[0]])) : this.metniHtmlYap(sonuc[a[0]]))).join('');
    }
    const tek = tur === 'baslik' || tur === 'gorsel';
    const mevcutVar = !this.bosMu(b);
    const m = this._ciz(
      '<h3>' + kaynak + ' önerisi</h3><div class="ipucu">Henüz bloğa yazılmadı. Beğenirseniz yerleştirin; sonra istediğiniz gibi düzeltebilirsiniz. Bilgileri (özellikle alıntıları ve tarihleri) mutlaka kontrol edin.</div>' +
      goster +
      '<div class="dugmeler"><button type="button" class="btn" data-yz-islem="vazgec">Vazgeç</button><button type="button" class="btn" data-yz-islem="yeniden">Yeniden yaz</button>' +
      (mevcutVar && !tek ? '<button type="button" class="btn" data-yz-islem="ekle">Sona ekle</button><button type="button" class="btn birincil" data-yz-islem="degistir">Değiştir</button>' : '<button type="button" class="btn birincil" data-yz-islem="degistir">' + (mevcutVar ? 'Değiştir' : 'Bloğa yerleştir') + '</button>') +
      '</div>'
    );
    m.addEventListener('click', ev => {
      const bt = ev.target.closest('button[data-yz-islem]'); if (!bt) return;
      const ne = bt.dataset.yzIslem;
      if (ne === 'vazgec') this._kapat();
      else if (ne === 'yeniden') this.formGoster(yon, duz);
      else { this.yerlestir(sonuc, ne === 'ekle'); }
    });
  },

  bosMu(b) { return Bloklar.bosMu(b); },

  yerlestir(sonuc, ekle) {
    const hedef = this.hedef;
    const i = Editor.bul(hedef.id);
    if (i < 0) { this._kapat(); return; }
    const b = Foy.f.bloklar[i];
    const h = k => this.metniHtmlYap(sonuc[k]);
    const birlestir = (eski, yeni) => ekle && eski ? temizHtml(eski + yeni) : yeni;
    const d = k => this.duzle(sonuc[k]);
    if (b.tur === 'baslik') { b.metin = d('baslik').replace(/\s*\n\s*/g, ' ').slice(0, 300); b.alt = d('alt').replace(/\s*\n\s*/g, ' ').slice(0, 300); }
    else if (b.tur === 'gorsel') b.yazi = d('altyazi').replace(/\s*\n\s*/g, ' ').slice(0, 300);
    else if (b.tur === 'alinti') { const m = d('metin').replace(/\n{3,}/g, '\n\n'); b.metin = (ekle && b.metin.trim() ? b.metin.replace(/\s+$/, '') + '\n\n' + m : m).slice(0, 30000); }
    else if (b.tur === 'tablo') {
      const bos = !b.h.some(r => r.some(c => String(c).trim()));
      const dolu = c => !!String(c || '').trim();
      /* kalıptan gelen tablo: başlık satırı dolu, diğer satırlarda en çok ilk sütun dolu.
         Başlıklar ve satır adları kodla korunur; yapay zekâ yalnız boş hücreleri doldurur. */
      const kalipli = b.ustBaslik && b.h.length && b.h[0].some(dolu) && b.h.slice(1).every(r => !r.slice(1).some(dolu));
      if (kalipli) {
        const su = b.sutun;
        const ad = x => String(x || '').toLocaleLowerCase('tr').replace(/\s+/g, ' ').trim();
        const kalan = sonuc.satirlar.slice();
        const govde = b.h.slice(1).map(r => {
          if (!dolu(r[0])) return r;
          const k = kalan.findIndex(s => ad(s[0]) === ad(r[0]));
          if (k < 0) return r;
          const s = kalan.splice(k, 1)[0];
          return r.map((c, j) => j === 0 ? c : (s[j] || ''));
        });
        /* eşleşmeyenler: önce boş satırlara, sonra sona */
        govde.forEach((r, i) => { if (!r.some(dolu) && kalan.length) { const s = kalan.shift(); govde[i] = Array.from({ length: su }, (_, j) => s[j] || ''); } });
        kalan.forEach(s => { if (govde.length < 39) govde.push(Array.from({ length: su }, (_, j) => s[j] || '')); });
        b.h = [b.h[0], ...govde];
        if (!b.yazi && sonuc.yazi) b.yazi = sonuc.yazi;
      } else if (ekle && !bos) {
        const su = b.sutun;
        sonuc.satirlar.forEach(r => { if (b.h.length < 40) b.h.push(Array.from({ length: su }, (_, j) => r[j] || '')); });
      } else {
        const su = Math.min(12, Math.max(1, sonuc.basliklar.length, ...sonuc.satirlar.map(r => r.length)));
        b.h = [sonuc.basliklar, ...sonuc.satirlar].slice(0, 40).map(r => Array.from({ length: su }, (_, j) => r[j] || ''));
        b.sutun = su; b.ustBaslik = true;
        if (sonuc.yazi) b.yazi = sonuc.yazi;
      }
      b.satir = b.h.length;
    }
    else if (b.tur === 'anlatim' || b.tur === 'dikkat') b.html = birlestir(b.html, h('metin'));
    else if (b.tur === 'bilgi') { b.html = birlestir(b.html, h('metin')); if (sonuc.baslik && (!ekle || !b.baslik || b.baslik === 'Bilgi')) b.baslik = sonuc.baslik.slice(0, 200); }
    else if (b.tur === 'ornek') { b.soru = birlestir(b.soru, h('soru')); b.cozum = birlestir(b.cozum, h('cozum')); }
    else if (b.tur === 'sirasizde') { b.soru = birlestir(b.soru, h('soru')); b.cevap = birlestir(b.cevap, h('cevap')); }
    this._kapat();
    Gecmis.yeniAdim = true;
    Foy.degisti();
    Editor.listeyiCiz();
    const kart = $('.blokKart[data-id="' + b.id + '"]');
    if (kart) kart.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    bildir('Taslak bloğa yerleştirildi. Gözden geçirip düzeltebilirsiniz.');
  }
};

const Kalip = {
  blokYap(t) {
    const b = Bloklar.yeni(t.tur);
    Object.keys(t).forEach(k => { if (!['tur', 'basliklar', 'satirlar'].includes(k)) b[k] = t[k]; });
    if (t.tur === 'tablo') {
      const su = t.basliklar.length;
      const h = [t.basliklar.slice(), ...t.satirlar.map(r => Array.from({ length: su }, (_, j) => r[j] || ''))];
      while (h.length < (t.satir || 1)) h.push(new Array(su).fill(''));
      b.h = h; b.satir = h.length; b.sutun = su; b.ustBaslik = true; b.yazi = t.yazi || '';
    }
    return Bloklar.duzelt(b);
  },

    k.hidden = false;

    k.innerHTML = '<div class="modal yzModal" role="dialog" aria-modal="true"><h3>🎨 Görsel istemi hazırla</h3>' +
      '<div class="ipucu" style="margin-bottom:8px"><b>1.</b> Ne istediğinizi yazın. <b>2.</b> "Kopyala"ya basıp Gemini\'ye yapıştırın. <b>3.</b> Çıkan resmi indirip "Resmi yükle" ile bu bloğa ekleyin.</div>' +
      '<div class="alan"><label for="giAciklama">Görselde ne olsun?</label><textarea id="giAciklama" rows="3" placeholder="Örn. bir divan şairi, gül bahçesinde bülbülü dinliyor">' + e(b.yazi || (konu ? konu + ' konusunu anlatan bir görsel' : '')) + '</textarea></div>' +
      '<div class="gorselSecim"><div class="alan"><label>Görsel türü</label>' + sec('giTur', this.TURLER, t.tur) + '</div><div class="alan"><label>Çizim tarzı</label>' + sec('giTarz', this.TARZLAR, t.tarz) + '</div>' +
      '<div class="alan"><label>Renk</label>' + sec('giRenk', this.RENKLER, t.renk) + '</div><div class="alan"><label>Biçim</label>' + sec('giOran', this.ORANLAR, t.oran) + '</div></div>' +
      '<div class="alan"><label for="giMetin">Gemini\'ye verilecek istem (isterseniz düzeltebilirsiniz)</label><textarea id="giMetin" rows="9"></textarea></div>' +
      '<div class="ipucu" id="giDurum"></div>' +
      '<div class="dugmeler"><button type="button" class="btn" data-gi="kapat">Kapat</button>' +
      '<button type="button" class="btn" data-gi="gemini">✨ Gemini ile daha ayrıntılı yaz</button>' +
      '<a class="btn" href="https://gemini.google.com/app" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">Gemini\'yi aç</a>' +
      '<button type="button" class="btn" data-gi="kopyala">Kopyala</button>' +
      '<button type="button" class="btn birincil" data-gi="yukle">Resmi yükle…</button></div></div>';
    k.hidden = false;
    const m = $('.modal', k);
    let iptal = null;
    const yenile = () => { const o = this.oku(m); $('#giMetin', m).value = o.aciklama.trim() ? this.istemYap(o) : ''; };
    const kapat = () => { if (iptal) { try { iptal.abort(); } catch (x) { /* yoksay */ } } k.hidden = true; k.innerHTML = ''; document.removeEventListener('keydown', tus, true); };
    const tus = ev => { if (ev.key === 'Escape') { ev.stopPropagation(); kapat(); } };
    document.addEventListener('keydown', tus, true);
    m.addEventListener('change', ev => { if (ev.target.tagName === 'SELECT') { const o = this.oku(m); this.tercihYaz({ tur: o.tur, tarz: o.tarz, renk: o.renk, oran: o.oran }); yenile(); } });
    m.addEventListener('input', ev => { if (ev.target.id === 'giAciklama') yenile(); });
    m.addEventListener('click', async ev => {
      const bt = ev.target.closest('button[data-gi]'); if (!bt) return;
      const ne = bt.dataset.gi, durum = $('#giDurum', m);
      if (ne === 'kapat') { kapat(); return; }
      if (ne === 'yukle') { kapat(); const kart = $('.blokKart[data-id="' + id + '"]'); const d = kart && $('[data-gorsel-dosya]', kart); if (d) d.click(); return; }
      if (ne === 'kopyala') {
        const ta = $('#giMetin', m);
        if (!ta.value.trim()) { durum.textContent = 'Önce görselde ne olacağını yazın.'; return; }
        let ok = false;
        try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (x) { try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (z) { ok = false; } }
        durum.textContent = ok ? 'Kopyalandı ✓ Şimdi Gemini\'ye yapıştırın.' : 'Kopyalanamadı; metni elle seçip kopyalayın.';
        return;
      }
      if (ne === 'gemini') {
        const o = this.oku(m);
        if (!o.aciklama.trim()) { durum.textContent = 'Önce görselde ne olacağını yazın.'; return; }
        const istem = 'Sen eğitim materyalleri için görsel tasarlayan bir uzmansın. Aşağıdaki bilgilere dayanarak bir resim üretme yapay zekâsına verilecek ayrıntılı, tek paragraflık Türkçe bir istem yaz. İstem; sahnedeki öğeleri, kompozisyonu, ışığı, renkleri ve tarzı somut olarak tarif etsin. Konu hakkında emin olmadığın ayrıntı ekleme. Görsele yazı koyma isteği ekleme.\nYanıtı YALNIZCA {"istem": "..."} biçiminde tek bir JSON nesnesi olarak ver.\n\nBilgiler:\n' + this.istemYap(o);
        iptal = new AbortController();
        const zaman = setTimeout(() => iptal && iptal.abort(), 60000);
        bt.disabled = true; durum.textContent = 'Gemini yazıyor…';
        try {
          const ham = await YZ.gemini(istem, iptal.signal);
          const a = ham.indexOf('{'), z = ham.lastIndexOf('}');
          const j = a >= 0 && z > a ? JSON.parse(ham.slice(a, z + 1)) : null;
          const metin = j && typeof j.istem === 'string' ? j.istem.trim() : '';
          if (!metin) throw new Error('Gemini beklenen biçimde cevap vermedi. Yeniden deneyin.');
          if (!k.hidden) { $('#giMetin', m).value = metin + '\n' + this.sonKurallar(o); durum.textContent = 'Gemini istemi yazdı. Okuyup isterseniz düzeltin, sonra "Kopyala"ya basın.'; }
        } catch (x) {
          if (!k.hidden) durum.textContent = x && x.tur === 'anahtar' ? 'Gemini anahtarı girilmemiş ("Kurum kimliği" sekmesinden girilir). Aşağıdaki hazır istemi kullanabilirsiniz.' : x && x.name === 'AbortError' ?'Gemini cevap vermedi; hazır istemi kullanabilirsiniz.' : (x.message || 'Bilinmeyen hata.') + ' Hazır istemi kullanabilirsiniz.';
        } finally { clearTimeout(zaman); iptal = null; if (bt.isConnected) bt.disabled = false; }
      }
    });
    yenile();
    $('#giAciklama', m).focus();
  }
};

/* ===== Geri al / ileri al (sürüm 4) ===== */
const Gecmis = {
  geri: [], ileri: [], son: null, sonZaman: 0, adimBas: 0, yeniAdim: false, resim: new Map(), resimTers: new Map(),
  _yaz(f) {
    return JSON.stringify(f, (k, v) => {
      if (k === 'guncelleme') return undefined;
      if (k === 'src' && typeof v === 'string' && v.length > 200) {
        let t = this.resim.get(v);
        if (!t) { t = '@resim' + this.resim.size; this.resim.set(v, t); this.resimTers.set(t, v); }
        return t;
      }
      return v;
    });
  },
  _oku(s) { return JSON.parse(s, (k, v) => (k === 'src' && typeof v === 'string' && this.resimTers.has(v)) ? this.resimTers.get(v) : v); },
  sifirla() { this.geri = []; this.ileri = []; this.resim.clear(); this.resimTers.clear(); this.son = Foy.f ? this._yaz(Foy.f) : null; this.sonZaman = 0; this.dugmeler(); },
  kaydet() {
    if (!Foy.f) return;
    const s = this._yaz(Foy.f);
    if (s === this.son) return;
    const simdi = Date.now();
    /* yeni adım: 1,2 sn duraklama, aynı adımda 5 sn'den fazla yazma ya da yapısal işlem (blok ekle/sil/taşı, kalıp, yapay zekâ) */
    const zorla = this.yeniAdim;
    this.yeniAdim = false;
    if (this.son !== null && (zorla || simdi - this.sonZaman > 1200 || simdi - this.adimBas > 5000)) {
      this.geri.push(this.son); if (this.geri.length > 60) this.geri.shift();
      this.adimBas = simdi;
    }
    this.sonZaman = zorla ? 0 : simdi;
    this.ileri = [];
    this.son = s;
    this.dugmeler();
  },
  geriAl() { if (!this.geri.length || !Foy.f) return; this.ileri.push(this.son); this._uygula(this.geri.pop()); bildir('Geri alındı.'); },
  ileriAl() { if (!this.ileri.length || !Foy.f) return; this.geri.push(this.son); this._uygula(this.ileri.pop()); bildir('İleri alındı.'); },
  _uygula(s) {
    const f = Foy.duzelt(this._oku(s));
    if (!f) return;
    f.guncelleme = Date.now();
    Foy.f = f;
    this.son = this._yaz(f);
    this.sonZaman = 0;
    Foy.arayuzuKur();
    Foy.durumYaz('Kaydediliyor…');
    Foy._gec();
    this.dugmeler();
  },
  dugmeler() { const g = $('#btnGeri'), i = $('#btnIleri'); if (g) g.disabled = !this.geri.length; if (i) i.disabled = !this.ileri.length; },
  bagla() {
    $('#btnGeri').addEventListener('click', () => this.geriAl());
    $('#btnIleri').addEventListener('click', () => this.ileriAl());
    document.addEventListener('keydown', ev => {
      if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
      const k = (ev.key || '').toLowerCase();
      if (k !== 'z' && k !== 'y') return;
      if (!$('#modalKatman').hidden) return;
      if (typeof Sunum !== 'undefined' && Sunum.acik) return;
      if ($('#sekmeFoy').hidden) return;          // Kurum kimliği / Föylerim açıkken görünmeyen föyü değiştirme
      const t = ev.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      ev.preventDefault();
      if (k === 'y' || ev.shiftKey) this.ileriAl(); else this.geriAl();
    });
  }
};

/* ===== Yedek hatırlatma (sürüm 4) ===== */
const YedekHatirlat = {
  /* kalıcı depolama izni verilmediyse 3 gün, değilse 7 gün */
  get GUN() { try { return localStorage.getItem('foy-kalici-red') === '1' ? 3 : 7; } catch (x) { return 7; } },
  _al(k) { try { return +localStorage.getItem(k) || 0; } catch (x) { return 0; } },
  _yaz(k) { try { localStorage.setItem(k, String(Date.now())); } catch (x) { /* yoksay */ } },
  kaydet() { this._yaz('foy-son-yedek'); this.denetle(false); },
  async durum() {
    const l = (await Depo.foyleriOku()).filter(f => Array.isArray(f.bloklar) && f.bloklar.length);
    const son = this._al('foy-son-yedek');
    const degisen = l.filter(f => (f.guncelleme || 0) > son);
    if (!degisen.length) return null;
    const ref = son || Math.min(...l.map(f => f.olusturma || Date.now()));
    return { gun: Math.floor((Date.now() - ref) / 864e5), hic: !son, sayi: degisen.length };
  },
  async denetle(pencereAc) {
    let d = null;
    try { d = await this.durum(); } catch (x) { return; }
    const gecikti = !!(d && d.gun >= this.GUN);
    const btn = $('#btnYedek');
    btn.classList.toggle('uyari', gecikti);
    btn.textContent = gecikti ? 'Yedek al ⚠' : 'Yedek al';
    btn.title = gecikti ? (d.hic ? 'Hiç yedek alınmamış' : 'Son yedek ' + d.gun + ' gün önce') : '';
    if (!gecikti || !pencereAc || Date.now() - this._al('foy-yedek-ertele') < 864e5) return;
    const r = await pencere({
      baslik: 'Yedek almanın zamanı geldi',
      mesaj: (d.hic ? 'Bu sürümle henüz yedek alınmadı (önceki sürümde aldıysanız bile yeni bir yedek almanız iyi olur).' :'Son yedek ' + d.gun + ' gün önce alındı.') + ' ' + d.sayi + ' föyde yedeklenmemiş değişiklik var. Föyler yalnızca bu tarayıcıda duruyor; tarayıcı temizlenirse kaybolabilir. Yedek dosyasını flash belleğe ya da Google Drive\'a koymanız iyi olur.',
      dugmeler: [{ ad: 'Yarın hatırlat', deger: 'ertele' }, { ad: 'Şimdi yedek al', deger: 'al', birincil: true }]
    });
    if (r.deger === 'al') await Yedek.al().catch(x => bildir('Yedek alınamadı: ' + x.message, true));
    else if (r.deger === 'ertele') this._yaz('foy-yedek-ertele');
  }
};

;
/* ===== İki sekme uyarısı ===== */
const IkiSekme = {
  _uyardi: false,
  kur() {
    if (typeof BroadcastChannel === 'undefined') return;
    try {
      const kanal = new BroadcastChannel('foy-atolyesi-sekme');
      const uyar = () => {
        if (this._uyardi) return;
        this._uyardi = true;
        bildir('⚠️ Föy Atölyesi başka bir sekmede de açık. Föylerin birbirini ezmemesi için yalnız bir sekmede çalışın; öbürünü kapatın.', true);
      };
      kanal.onmessage = ev => {
        if (ev.data === 'merhaba') { try { kanal.postMessage('buradayım'); } catch (x) { /* yoksay */ } uyar(); }
        else if (ev.data === 'buradayım') uyar();
      };
      kanal.postMessage('merhaba');
      this.kanal = kanal;
    } catch (x) { /* sessizce geç */ }
  }
};

;
/* ===== Başlangıç ===== */
async function baslat() {
  try {
    IkiSekme.kur();
    await Depo.ac();
    await Ayar.yukle();
    Sekme.bagla();
    Ayar.kur();
    Foy.bagla();
    Editor.bagla();
    Sayfa.baslat();
    Liste.kur();
    Gecmis.bagla();

    $('#btnYazdir').addEventListener('click', () => Sayfa.yazdir());
    $('#btnSunum').addEventListener('click', async () => { await Sayfa.hemenYenile(); Sunum.ac(); });
    $('#btnYedek').addEventListener('click', () => Yedek.al().catch(x => bildir('Yedek alınamadı: ' + x.message, true)));
    $('#btnYukle').addEventListener('click', () => $('#yedekDosya').click());
    $('#yedekDosya').addEventListener('change', async ev => {
      const d = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (d) { try { await Yedek.yukle(d); } catch (x) { bildir('Yedek yüklenemedi: ' + x.message, true); } }
    });

    await Foy.acIlkini();
    if (!Depo.kalici) {
      await pencere({
        baslik: 'Dikkat: kayıt yapılamıyor',
        mesaj: 'Tarayıcınız bu dosya için kalıcı kayıt alanı vermiyor (gizli pencere ya da kısıtlı ayar olabilir). Çalışabilirsiniz ama sayfa kapanınca föyler kaybolur. Önemli işleri "Yedek al" düğmesiyle dosyaya kaydedin.'
      });
    }
    await YedekHatirlat.denetle(true);
    setInterval(() => YedekHatirlat.denetle(false), 3600000);
  } catch (x) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="padding:20px;background:#fde6e3;color:#7a1810"><b>Uygulama başlatılamadı:</b> ' + e(x && x.message ? x.message : x) + '</div>');
    throw x;
  }
}
document.addEventListener('DOMContentLoaded', baslat);

</script>
