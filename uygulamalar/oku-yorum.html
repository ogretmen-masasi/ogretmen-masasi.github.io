<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oku-Yorum, Yazı-Yorum Rehberi</title>
<style>
:root{--navy:#0f2f5f;--tan:#c49a6c;--tan2:#ecdfd0;--cream:#faf6f0;--ink:#1d2433;--mut:#6b7280;--ok:#2e7d4f;--warn:#b45309;--bad:#b42318;--card:#fff;--line:#e5d9c9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header small{color:#d8c3a5}
.layout{display:flex;min-height:calc(100vh - 62px)}
nav{width:200px;background:#fff;border-right:1px solid var(--line);padding:10px;flex-shrink:0}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;margin-bottom:2px}
nav a:hover{background:var(--tan2)}
nav a.on{background:var(--navy);color:#fff}
main{flex:1;padding:20px;max-width:1000px;min-width:0}
h2{margin:0 0 4px;color:var(--navy)}
h3{margin:18px 0 8px;color:var(--navy)}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card.hl{border-color:var(--tan);box-shadow:0 0 0 2px #c49a6c33}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--tan2);color:#6b4a22}
.badge.red{background:#fde8e6;color:var(--bad)}.badge.green{background:#e3f4ea;color:var(--ok)}.badge.navy{background:#e3eaf6;color:var(--navy)}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.task:last-child{border:none}
.task input{margin-top:4px;width:18px;height:18px;flex-shrink:0}
.task small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.task input:checked + span b{text-decoration:line-through;color:var(--mut)}
.bar{height:8px;background:var(--tan2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
button,.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.sm{padding:4px 10px;font-size:12.5px}
input[type=text],input[type=search],input[type=number],input[type=password],textarea,select{width:100%;padding:8px 10px;border:1px solid #d6c8b4;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--mut);margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--tan2);color:#4a3418}
.scroll{overflow-x:auto}
details{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.cur{border-color:var(--tan);box-shadow:0 0 0 2px #c49a6c33}
details.past{opacity:.75}
summary{padding:11px 14px;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details .in{padding:0 14px 12px}
.tip{background:#fff8e6;border-left:4px solid var(--tan);padding:9px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.warn{background:#fdeee8;border-left:4px solid var(--bad);padding:9px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs2 button{background:#fff;color:var(--navy);border:1px solid var(--line)}
.tabs2 button.on{background:var(--navy);color:#fff}
pre.letter{white-space:pre-wrap;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;background:#fffdf9;border:1px solid var(--line);border-radius:8px;padding:14px}
.paper{background:#fff;color:#000;font-family:"Times New Roman",serif;font-size:14px;padding:26px 30px;border:1px solid #999;line-height:1.7}
.paper h3{text-align:center;color:#000;margin:0 0 14px}
.paper p{margin:4px 0}
#printRoot{display:none}
#pv{display:none;position:fixed;inset:0;background:rgba(15,47,95,.6);z-index:50;overflow:auto;padding:12px}
#pvIn{max-width:820px;margin:0 auto}
#pvBar{position:sticky;top:0;background:var(--cream);padding:8px;border-radius:8px;margin-bottom:10px;display:flex;gap:8px;z-index:2}
.paper.pg{margin-bottom:14px}
.paper table{width:100%;border-collapse:collapse;font-size:13px}
.paper th,.paper td{border:1px solid #555;padding:5px 7px;text-align:left;vertical-align:top}
.paper th{background:#eee;color:#000}
.paper ol,.paper ul{margin:4px 0 8px 22px}
.paper h4{margin:12px 0 4px;font-size:14.5px}
.linkcard{display:block;text-decoration:none;color:inherit}
.linkcard:hover{border-color:var(--navy);background:#f6f9ff}
.an{display:inline-block;background:#e3eaf6;color:#0f2f5f;border-radius:4px;font-size:11px;padding:1px 6px;font-family:system-ui,sans-serif;margin-right:6px;vertical-align:1px}
.hit{background:#fff2a8}
.mini{font-size:12.5px;color:var(--mut)}
.ans{white-space:pre-wrap;background:#fffdf9;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
@media(max-width:760px){
 .layout{display:block}
 nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:0;z-index:5}
 nav a{white-space:nowrap;margin:0 3px 0 0}
 main{padding:14px}
}
@media print{
 .pg{page-break-after:always}
 .pg:last-child{page-break-after:auto}
 body>*:not(#printRoot){display:none!important}
 #printRoot{display:block!important}
 .paper{border:0;padding:0}
}
</style>
</head>

function setPath(obj, path, val){
  const p = path.split("."); let o = obj;
  for(let i=0;i<p.length-1;i++){ if(o[p[i]] == null || typeof o[p[i]] !== "object") o[p[i]] = {}; o = o[p[i]]; }
  o[p[p.length-1]] = val;
}
function getPath(obj, path){ return path.split(".").reduce((o,k)=> o==null ? undefined : o[k], obj); }

function curWeekIdx(){
  const t = today();
  if(t < toD(W[0].s)) return 0;
  for(let i=0;i<W.length;i++){ if(t >= toD(W[i].s) && t <= toD(W[i].e)) return i; }
  return W.length-1;
}
function weekState(i){
  const t = today(), s = toD(W[i].s), e = toD(W[i].e);
  if(t < s) return "future"; if(t > e) return "past"; return "cur";
}
function weekProgress(i){
  const tt = W[i].tasks; const n = tt.filter(x=>S.done[x.id]).length;
  return {n, total:tt.length};
}

  (s.ad||"").split(/\s+/).filter(w=>w.length>2).forEach(w=>{ txt = txt.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"[ad]"); });
  const sys = `Sen bir Türk Dili ve Edebiyatı öğretmeninin yardımcısısın. 10. sınıf öğrencisinin yazdığı bildiri taslağını MEB “Oku-Yorum, Yazı-Yorum” projesinin EK-7 ölçütlerine göre değerlendireceksin. Konu: Nizâmülmülk'ün Siyasetname'si ile Machiavelli'nin Hükümdar eserlerinin karşılaştırılması.
KURALLAR: Metni yeniden yazma. Düzeltilmiş cümle veya paragraf önerme. Örnek cümle verme. Sadece dönüt ver. İmla ve noktalama hatalarında yalnızca hatanın türünü ve metinde yaklaşık nerede olduğunu söyle, düzeltmeyi yazma. Anlamadığın bir şey varsa uydurma. Eserler hakkında metinde yer alan bir bilgiyi doğrulayamazsan "öğretmen kaynaktan kontrol etsin" diye işaretle.
ÖLÇÜTLER: ${C7.map((c,i)=>(i+1)+") "+c).join("; ")}.
BİÇİM: Her ölçüt için bir satır: ölçüt adı, durum (Var / Kısmen / Eksik) ve 1-2 cümlelik gerekçe. Sonunda "Öncelikli 3 gelişim alanı" başlığı altında üç madde. Türkçe yaz, öğrenciye saygılı ve yapıcı bir dil kullan.`;
  aiBusy = true; aiOut = "Değerlendiriliyor..."; render();
  try{
    const url = "https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(S.set.model||"gemini-2.5-flash")+":generateContent?key="+encodeURIComponent(key);
    const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:"["+s.kod+"] taslak metni:\n\n"+txt}]}]})});
    const j = await r.json();
    if(!r.ok){ throw new Error((j.error&&j.error.message)||("HTTP "+r.status)); }
    const out = j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts.map(p=>p.text||"").join("");
    aiOut = out ? mdLite(out) : "Boş yanıt geldi. Tekrar deneyin.";
  }catch(e){
    aiOut = "Hata: "+esc(e.message)+"<br><span class='mini'>API anahtarını, model adını ve internet bağlantısını kontrol edin.</span>";
  }
  aiBusy = false; render();

function scoreForm(key, crit, max, title, anon){
  return S.students.map((s,i)=>{
    const rows = crit.map((c,ci)=>{ const v = getPath(S,key+"."+i+"."+ci); return [(ci+1)+". "+esc(c), max, v==null?"":v, ""]; });
    const vals = crit.map((c,ci)=>Number(getPath(S,key+"."+i+"."+ci))||0);
    const any = crit.some((c,ci)=>{ const v = getPath(S,key+"."+i+"."+ci); return v!=null && v!==""; });
    rows.push(["<b>Toplam</b>", crit.length*max, any ? vals.reduce((a,b)=>a+b,0) : "", ""]);
    return pg(hd(title)
      + (anon ? `<p>Hikâye No: <b>${i+1}</b> &nbsp;&nbsp; (isimsiz değerlendirme) &nbsp;&nbsp; Değerlendiren: …………………… &nbsp;&nbsp; Tarih: ……/……/……….</p>`
              : info(s) + `<p>Bildiri başlığı: ${esc(s.baslik||s.konu)}</p><p>Değerlendiren: ${esc(OGRT)}</p>`)
      + tbl(["Ölçüt","Üst puan","Verilen puan","Not"], rows, 38)
      + `<p><b>Genel görüş ve gelişim önerileri</b></p>` + ln(4));
  }).join("");
}

/* ===== Word (.doc) olarak indirme ===== */
function wordHTML(ids, name){
  let i = 0;
  const body = ids.map(id=>DOCS[id].f()).join("").replace(/<div class="paper pg">/g, ()=> (i++ ? '<br clear="all" style="page-break-before:always;mso-break-type:page-break"><div>' : '<div>'));
  const body2 = body.replace(/<div style="white-space:pre-wrap[^"]*">([\s\S]*?)<\/div>/g, (m, t)=> '<p>'+t.replace(/\n/g,'<br>').replace(/ {2,}/g, sp=>'&nbsp;'.repeat(sp.length))+'</p>');
  const css = 'body{font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5}h3{text-align:center;font-size:14pt}h4{font-size:12pt;margin:10pt 0 3pt}p{margin:3pt 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:4pt;vertical-align:top;font-size:11pt}th{background:#e8e8e8}.an{background:#dde6f5;font-size:9pt;font-family:Arial,sans-serif}.mini{font-size:10pt}';
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+esc(name)+'</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>'+css+'</style></head><body>'+body2+'</body></html>';
}
function wordDoc(ids, name){
  const tr = {"ı":"i","İ":"I","ğ":"g","Ğ":"G","ü":"u","Ü":"U","ş":"s","Ş":"S","ö":"o","Ö":"O","ç":"c","Ç":"C","â":"a","Â":"A","î":"i","û":"u"};
  const safe = String(name).replace(/[ıİğĞüÜşŞöÖçÇâÂîû]/g, c=>tr[c]).replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60).replace(/-+$/,"") || "cikti";
  const blob = new Blob(["\ufeff"+wordHTML(ids, name)], {type:"application/msword"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "oku-yorum-"+safe+".doc";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

function anlatimHTML(){

    + `<p>Süre: ${sure} &nbsp;&nbsp; Tarih: ……/……/……….</p><p><b>Hedef:</b> ${hedef}</p>`
    + adimlar.map(a=>`<h4>${a[0]} <span style="font-weight:normal">(${a[1]})</span></h4>${a[2]}`).join("")
    + `<h4>Çıkış kartı</h4>${jp(cikis)}`);

    ["Zaman çizelgesi","8 dk", tbl(["Yıl","Olay"], [["1018","Nizâmülmülk doğar"],["1064","Nizâmülmülk Selçuklu veziri olur (Alp Arslan dönemi)"],["1092","Nizâmülmülk öldürülür; Siyasetname tamamlanmıştır"],["1469","Machiavelli doğar"],["1513","Hükümdar yazılır"],["1532","Hükümdar basılır (Machiavelli 1527'de ölmüştür)"]], 26) + jp("Soru: <i>Aradaki kaç yüzyıl? İki yazar arasında hangi coğrafya, hangi inanç ve devlet düzeni farkı olabilir?</i>")],
    ["Yazar ve eser kartları","10 dk", jp("Üç öğrenci: biri Nizâmülmülk kartını, biri Machiavelli kartını okur, üçüncüsü iki kartı karşılaştıran bir cümle kurar. Kartlar: “Eser notu” sayfalarının ilk tablosu.")],
    ["Durum kartları","12 dk", jp("Üç durum okunur. Öğrenci önce “Yazarlar ne öğütlerdi?” diye tahmin yürütür, sonra eser notundan doğrular.")
      + tbl(["Durum","Nizâmülmülk ne öğütler?","Machiavelli ne öğütler?"], [
       ["Köyde kıtlık var, vergi toplanacak.","Ürün toplanmadan vergi istenmez; gerekirse tohum veya öküz için borç verilir.","Halkın desteği devletin temelidir (9. bölüm); hükümdar nefret uyandırmamalıdır (17. bölüm)."],
       ["Bir görevli halka zulmediyor.","Zalim görevli görevden alınır, suçu oranında cezalandırılır; görevliler gizlice denetlenir.","Hükümdar dalkavuklardan kaçınmalı, bilge danışmanlarla gerçeği öğrenmelidir (22-23. bölüm)."],
       ["Düşman sınırda; ordu paralı askerden oluşuyor.","Askerlerin istihkakı ve ihtiyaçları düzenli karşılanmalıdır.","Paralı asker güvenilmezdir; hükümdar kendi ordusunu kurmalıdır (12-14. bölüm)."]], 50)],
    ["Kapanış","5 dk", jp("Isınma sorusuna dönülür: fikri değişen var mı? Neden?")]],
    "“Bugün öğrendiğim bir benzerlik: …… Bir fark: …… Aklımdaki bir soru: ……”");
  const d2 = ders(2,"KARŞILAŞTIRMA: BİÇİM, ANLATIM, BENZETME","40 dk","Öğrenciler iki eserin anlatım biçimini karşılaştırır ve alıntıyı doğru yerde kullanmayı öğrenir.",[
    ["Üç sahne","10 dk", jp("Üç kısa ifade okunur, öğrenciler hangi esere ait olduğunu tahmin eder ve nedenini söyler:") + ul(["Vezir, devletin çobanı gibidir. (Siyasetname'deki vezir–çoban benzetmesi)","Hükümdar hem aslan hem tilki gibi davranmalıdır. (Hükümdar, 18. bölüm)","Talih, set yapılmamış bir nehir gibi taşar. (Hükümdar, 25. bölüm)"]) + jp("<i>İfadeler kitaplardaki benzetmelerin özetidir, birebir alıntı değildir.</i>")],
    ["Kıssa mı, tez mi?","10 dk", jp("Sorular: Kıssa öğüdü güçlendiriyor mu, konuyu dağıtıyor mu? Machiavelli'nin kısa ve doğrudan tezleri okuru nasıl etkiliyor? Hangisi daha ikna edici?")],
    ["Çalışma tablosu","12 dk", jp("Oturum föyündeki karşılaştırma çalışma kâğıdı birlikte doldurulur. Her cümle için sayfa/bölüm numarası yazılır.")],
    ["Alıntı alıştırması","8 dk", jp("Öğrenci eserden bir cümleyi seçer ve alıntı tablosuna yazar: Eser | Bölüm/sayfa | Alıntı | Bildiride nasıl kullanacağım?")]],
    "“Bugünkü tablodaki en güçlü satırım: …… Bildirimde şunu kullanacağım: ……”");
  const d3 = ders(3,"BİLDİRİ NASIL YAZILIR?","40 dk","Öğrenciler özet/kompozisyon ile bildiri arasındaki farkı anlar, örnek bildirinin yapısını çözümler.",[
    ["Fark tablosu","8 dk", jp("“Bildiri nedir?” sayfasındaki tablo okunur. Öğrenciler ikişer örnek cümle ekler.")],
    ["Cümle dönüştürme","12 dk", tbl(["Özet dili","Bildiri dili (öğretmen anahtarı)"], [

       ["Nizâmülmülk vezirin çok önemli olduğunu söylüyor.","Nizâmülmülk, Siyasetname'de veziri devletin en üst görevlerinden biri olarak değerlendirmektedir."],
       ["Bence Machiavelli haklı.","Machiavelli'nin gerçekçi yaklaşımı, devletin korunması açısından bazı bakımlardan savunulabilir görünmektedir."],
       ["İki kitap da orduyu önemsiyor.","Her iki eserde de ordunun, iktidarı kurma ve koruma bakımından önemine vurgu yapıldığı görülmektedir."],
       ["Bu konuyu anlatacağım.","Bu çalışmada ... konusu incelenmiştir."]], 40) + jp("Öğrenciler önce sol sütunu bildiri diline kendileri çevirir, sonra anahtara bakar.")],
    ["Örnek bildirinin anatomisi","12 dk", jp("“Örnek bildiriler” sayfasından biri okunur. Her paragrafın başındaki etiket (özet, giriş, gelişme, sonuç) önce kapatılır; öğrenciler paragrafın görevini tahmin eder.")],
    ["Öz değerlendirme","8 dk", jp("EK-7 ölçütleri okunur. Öğrenci, örnek bildiriyi 8 ölçüte göre değerlendirir: hangisi var, hangisi eksik?")]],
    "“Bildirimin başlığı: …… Üç anahtar kavramım: ……”");
  return d1 + d2 + d3;
}

  giris:"Hükümdara öğüt veren eserler, farklı çağlarda ve coğrafyalarda yazılmış olsa da okurunu ikna etmek için benzer bir sorunla karşılaşır: Yönetim bilgisi nasıl anlatılmalı ve öğüt nasıl inandırıcı kılınmalıdır? Nizâmülmülk, 11. yüzyılda Selçuklu sultanı Melikşah'ın isteği üzerine Siyasetname'yi yazmış; Machiavelli ise 1513'te Hükümdar'ı kaleme almıştır. Bu çalışmanın amacı, iki eserin biçim ve anlatım özelliklerini karşılaştırarak yazarların okuru ikna yöntemlerini ortaya koymaktır. İnceleme, her iki eserden seçilmiş bölümler ve konuyla ilgili ikincil kaynaklar üzerinden yapılmıştır.",
  gel:[["Siyasetname'de anlatım","Siyasetname'de yazar genellikle önce bir durumu tespit etmekte, ardından görüşünü bildirmekte ve uygulamanın nasıl yapılacağını açıklamaktadır. Bu açıklamalar ayet, hadis, büyüklerin sözleri ve kıssalarla desteklenmektedir (Nizâmülmülk, Siyasetname, [sayfa]). Örneğin vezirin devlet içindeki yeri çobana yapılan benzetmeyle anlatılmış, Behrâm-ı Gûr ile vezir kıssası bu konuyu somutlaştırmak için kullanılmıştır. Vergi konusunda ise Sultan Mahmud ile Emir Altıntaş arasında geçen bir hikâyeye yer verilmiştir. Bu örnekler, öğüdün soyut bir kural olarak kalmayıp tarihî bir olayla ilişkilendirilmesini sağlamaktadır. Eserde konuların her zaman sistemli bir sırayla verilmediği ve bazı konuların farklı fasıllarda yinelendiği de belirtilmelidir."],
   ["Hükümdar'da anlatım","Hükümdar, bölümlere ayrılmış, kısa ve doğrudan bir metindir. Machiavelli çoğu bölümde bir görüş öne sürmekte ve bu görüşü Roma, Yunan ve çağdaş İtalyan örnekleriyle desteklemektedir (Gökcan, 2018). Örneğin 7. bölümde Cesare Borgia'nın devleti babasının talihi sayesinde elde etmesine rağmen onu koruyamaması, kendi gücüyle kurulan devletlerle karşılaştırılmıştır (Machiavelli, Hükümdar, 7. bölüm). Eserde iki benzetme dikkat çekicidir: 18. bölümde hükümdarın hem aslan hem tilki gibi davranması gerektiği, 25. bölümde ise talihin, set yapılmadığında zarar veren taşkın bir nehre benzetildiği anlatılmaktadır. Bu benzetmeler soyut fikirleri akılda kalıcı görüntülere dönüştürmektedir."],
   ["Karşılaştırma","İki eser karşılaştırıldığında ortak bir yöntem görülmektedir: her ikisi de görüşünü örneklerle desteklemektedir (Gökcan, 2018). Ancak örneklerin kaynağı ve işlevi farklıdır. Nizâmülmülk'ün örnekleri ayet, hadis ve İran kralları ile halifeler gibi dinî ve geleneksel otoritelerden gelirken Machiavelli'nin örnekleri Roma ve İtalyan siyasi tarihinden seçilmiştir. Siyasetname'de kıssa, öğüdü dinî ve ahlâkî bir zemine oturtarak güçlendirmekte; Hükümdar'da ise örnek, tezin gözleme dayalı kanıtı olarak kullanılmaktadır. Bu farkın, Nizâmülmülk'ün meşruiyeti Tanrı'ya dayandıran, Machiavelli'nin ise iktidarı gücüne ve sonucuna bağlayan yaklaşımıyla ilişkili olduğu düşünülebilir."]],
  sonuc:"Bu çalışmada Siyasetname ve Hükümdar'ın anlatım biçimleri karşılaştırılmıştır. Her iki eser de hükümdara öğüt veren birer metin olarak örneklerle ikna etme yöntemini kullanmakla birlikte, Siyasetname dinî ve geleneksel kaynaklara dayalı, kıssa ağırlıklı bir anlatımı; Hükümdar ise kısa tezlere ve gözleme dayalı bir anlatımı benimsemektedir. Bu bulgular, anlatım biçiminin yazarın dayandığı değerlerle bağlantılı olduğunu düşündürmektedir. Yine de bu sonuç iki eserden seçilen bölümlere dayanmaktadır; eserlerin tamamının incelenmesi daha kesin yargılara imkân verecektir."},
 {baslik:"Siyasetname ve Hükümdar'da Hükümdara Öğütler: Danışma, Denetim ve Ordu",
  ozet:"Bu çalışmada Nizâmülmülk'ün Siyasetname'si ile Machiavelli'nin Hükümdar'ında hükümdarın çevresindekilerle ilişkisi ve ordu konusundaki öğütler karşılaştırılmıştır. İncelemede her iki eserin de danışmayı ve güçlü bir orduyu önemsediği görülmüştür. Ancak Siyasetname görevlilerin denetimi ve mali işleyiş gibi idari ayrıntılara geniş yer verirken Hükümdar'ın hükümdarın şahsi tutumuna ve ordunun kendi gücüne dayanması gerektiğine odaklandığı anlaşılmıştır.",
  anahtar:"hükümdar, danışma, denetim, ordu, devlet yönetimi",

  gel:[["Danışma ve hükümdarın çevresi","Siyasetname'de hükümdarın danışma yapması ve ilim adamlarıyla görüşmesi öğütlenmektedir (Nizâmülmülk, Siyasetname, [sayfa]). Vezirlik devletin en üst görevlerinden sayılmakta, iyi bir vezirin düzene, kötü bir vezirin karışıklığa yol açacağı belirtilmektedir. Ayrıca vezir ve diğer görevlilerin gizlice denetlenmesi gerektiği vurgulanmaktadır. Hükümdar'da ise 22. ve 23. bölümlerde dalkavuklardan kaçınılması, hükümdarın yanına birkaç seçkin ve bilge danışmanı alması ve kararı kendisinin vermesi gerektiği ifade edilmektedir (Machiavelli, Hükümdar, 23. bölüm). İki eser bu noktada danışmanın gerekliliğinde birleşmekte, ancak Siyasetname denetim mekanizmasına, Hükümdar ise dalkavukluk tehlikesine ve son kararın hükümdara ait olduğuna vurgu yapmaktadır."],
   ["Ordu","Siyasetname'de askerlerin istihkakının belirlenmesi ve ihtiyaçlarının karşılanması gerektiği belirtilmektedir; askerî konular eserin kapsamlı bölümlerinden birini oluşturmaktadır (Nizâmülmülk, Siyasetname, [sayfa]). Hükümdar'da ise 12. bölümde her devletin iki temeli olduğu, bunların sağlam yasalar ve güçlü ordu olduğu söylenmektedir. Machiavelli paralı askerlerin disiplinsiz ve sadakatsiz olduğunu, yardımcı kuvvetlerin ise daha tehlikeli olduğunu belirtmekte, hükümdarın kendi ordusuna dayanması gerektiğini savunmaktadır (Machiavelli, Hükümdar, 12-14. bölüm). Gökcan'a (2018) göre her iki yazar da savaşı iktidarı kurmanın ve korumanın bir aracı olarak görmektedir."],
   ["İdari ayrıntı ve genel ilke","Siyasetname'de mali işlerin düzeni de ayrıntılı biçimde ele alınmakta, gelir ve giderin yazılı kayıt altına alınması ve iki ayrı hazine tutulması önerilmektedir (Nizâmülmülk, Siyasetname, [sayfa]). Hükümdar'ın incelenen bölümlerinde bu düzeyde idari ayrıntıya rastlanmamıştır. Bu durum, Siyasetname'nin geniş bir devlet teşkilatını yönetmenin pratik sorularına, Hükümdar'ın ise iktidarın kazanılması ve korunması gibi genel ilkelere yöneldiğini düşündürmektedir."]],
  sonuc:"Bu çalışmada Siyasetname ve Hükümdar'daki danışma, denetim ve ordu konulu öğütler karşılaştırılmıştır. Her iki eser de hükümdarın danışmasını ve ordusunun güçlü olmasını önemsemektedir. Siyasetname bu konuları kurumsal ve idari ayrıntılarla işlerken Hükümdar, hükümdarın tutumuna ve ordunun kendi gücüne dayanması gerektiğine odaklanmaktadır. Bu fark, iki eserin yazıldığı devlet yapıları ve yazarların konumlarıyla ilişkili olabilir. Yine de bu değerlendirme eserlerin seçilmiş bölümlerine dayanmakta olup daha geniş bir okumayla desteklenmelidir."},
 {baslik:"Adalet, Din ve Halk: Siyasetname ve Hükümdar'da Meşruiyet Anlayışı",
  ozet:"Bu çalışmada Nizâmülmülk'ün Siyasetname'si ile Machiavelli'nin Hükümdar'ında adalet, din ve halk kavramları meşruiyet anlayışı bağlamında karşılaştırılmıştır. Siyasetname'de iktidarın kaynağının Tanrı'ya, hükümdarın itibarının ise adalete dayandırıldığı; Hükümdar'da ise devletin korunmasının ve halkın desteğinin öne çıktığı görülmüştür. İki eserde de halkın önemi kabul edilmekle birlikte gerekçeler farklıdır.",
  anahtar:"meşruiyet, adalet, din, halk, hükümdar",
  giris:"Bir hükümdarın yönetme hakkını neye dayandırdığı sorusu, siyaset düşüncesinin temel sorularından biridir. Nizâmülmülk ve Machiavelli bu soruya farklı çağlarda ve farklı toplumlarda cevap aramışlardır. Bu çalışmanın amacı, Siyasetname ve Hükümdar'da meşruiyetin dayanağını ve adalet, din ve halkın bu dayanaktaki yerini karşılaştırmaktır. İnceleme, eserlerin ilgili bölümlerine ve konuyu karşılaştıran bir makaleye (Gökcan, 2018) dayanmaktadır.",
  gel:[["Meşruiyet ve adalet","Siyasetname'de Allah'ın her çağda halk arasından birini seçip hükümdarlık özellikleriyle donattığı ve onu dünya işlerinden sorumlu kıldığı belirtilmektedir; hükümdar adaletiyle halkın saygısını kazanır (Nizâmülmülk, Siyasetname, [sayfa]). Hükümdarın öncelikli görevi adaletle yönetmektir; zalim görevliler görevden alınmalı ve suçları oranında cezalandırılmalıdır. Hükümdar Allah'a karşı sorumludur. Hükümdar'da ise 15. bölümde devleti korumanın hükümdarın ilk görevi olduğu, bu uğurda kötü sayılan davranışlara gerek duyulabileceği ifade edilmektedir (Machiavelli, Hükümdar, 15. bölüm). Gökcan'a (2018) göre Machiavelli iktidarın meşruiyetini dış bir dayanağa değil, iktidarın kendisine bağlamaktadır."],

function bildiriHTML(n){
  const b = BP[n-1];
  const sec = (lbl, body) => `${an(lbl)}${body}`;
  return pg(hd("ÖRNEK BİLDİRİ "+n)
   + `<p style="font-size:12.5px;border:1px solid #999;padding:6px 8px"><b>Öğretmen notu:</b> Bu metin öğrencilere yapıyı göstermek için hazırlanmıştır; öğrencinin kendi bildirisi olarak gönderilemez (EK-7, 4. ölçüt: özgünlük). Köşeli parantezli [sayfa] yerlerine, kullandığınız baskının sayfa numarası yazılır. Mavi etiketler bildirinin bölümlerini gösterir.</p>`
   + `<p style="text-align:center;font-size:16px;margin:12px 0 4px"><b>${esc(b.baslik)}</b></p>`
   + jp(sec("ÖZET (4-5 cümle: ne yapıldı, ne bulundu)", "<b>Özet.</b> "+esc(b.ozet)))
   + jp(`<b>Anahtar kavramlar:</b> ${esc(b.anahtar)}`)
   + `<h4>1. Giriş</h4>` + jp(sec("GİRİŞ (konu, eserler, amaç, yöntem)", esc(b.giris)))
   + `<h4>2. Gelişme</h4>` + b.gel.map((g,i)=>`<h4 style="font-weight:normal;font-style:italic">2.${i+1}. ${esc(g[0])}</h4>` + jp(sec(i===0?"GELİŞME (alıntı, atıf, karşılaştırma)":i===2?"KARŞILAŞTIRMA / YORUM":"GELİŞME", esc(g[1])))).join("")
   + `<h4>3. Sonuç ve değerlendirme</h4>` + jp(sec("SONUÇ (ana fikir, sınırlılık)", esc(b.sonuc)))
   + `<h4>Kaynakça</h4>` + ul([
      "Gökcan, Ö. (2018). Machiavelli ve Nizamülmülk'te devlet yönetimi: Hükümdar (Prens) ve Siyasetname üzerine karşılaştırmalı bir analiz. <i>Munzur Üniversitesi Sosyal Bilimler Dergisi, 6</i>(12).",
      "Machiavelli, N. <i>Hükümdar</i>. [Çevirmen, yayınevi, basım yılı: kullandığınız baskıdaki bilgiler]",
      "Nizâmülmülk. <i>Siyasetname</i>. [Çevirmen, yayınevi, basım yılı: kullandığınız baskıdaki bilgiler]"]));
}
function ornekGirisHTML(){

   + jp("Aşağıdaki üç örnek bildiri, uygulamadaki üç öneri konuya karşılık gelir. Her biri yaklaşık 3-4 sayfalık bir bildirinin yapısını gösterir: özet, anahtar kavramlar, giriş, gelişme, sonuç, kaynakça.")
   + `<h4>Sınıfta nasıl kullanılır?</h4>` + ul(["Önce bir örnek bildiriyi etiketsiz okutun; öğrenciler her paragrafın görevini tahmin etsin.","Sonra etiketleri açın, tahminleri kontrol edin.","“Sınıfta anlatım” 3. dersteki cümle dönüştürme alıştırmasını yapın.","Öğrencilere kendi konularında aynı yapıyı kullanmalarını, <b>cümleleri kopyalamamalarını</b> söyleyin.","Örnek bildirilerdeki sınırlılık cümlelerine (“bu sonuç seçilmiş bölümlere dayanmaktadır”) dikkat çekin: iyi bildiri neyi bilmediğini de söyler."])
   + `<h4>Bu örneklerde dikkat edilenler</h4>` + ul(["3. tekil kişi ve resmî üslup (“incelenmiştir”, “görülmektedir”).","Her iddianın bir dayanağı var: eserden bölüm numarası ya da ikincil kaynak.","Siyasetname için sayfa numaraları [sayfa] olarak boş bırakıldı; baskıdan doldurulmalıdır.","Alıntı yerine özetleyen aktarım kullanıldı; öğrenciler kısa doğrudan alıntıyı tırnak ve sayfa numarasıyla ekleyebilir."])
   + `<h4>Üç örnek bildiri</h4>` + tbl(["No","Konu","Odak"], [["1","Anlatım biçimi ve benzetmeler","Kıssa mı, tez mi?"],["2","Hükümdara öğütler","Danışma, denetim, ordu"],["3","Adalet, din ve halk","Meşruiyet anlayışı"]], 30));
}

const DOC_GROUPS = [
 ["Okula ve müdürlüğe yazılar","Resmî yazılar: görevlendirme, koordinatör okula liste, sorular, bildiri ve hikâye gönderimi.",["gorev","liste","sorular","teslimYazisi","hikayeTeslimYazisi"]],
 ["Veli ve öğrenci belgeleri","Veli izni, telif, aydınlatma metni, bilgilendirme ve duyurular (3 öğrenci için ayrı sayfalar).",["veli","ogr","ek4","ek5","ek6","panelBilgi"]],
 ["Ders anlatımı ve eserler","Sınıfta anlatım planı, eser notları, karşılaştırma, sözlük ve örnek bildiriler.",["anlatim","eserSiy","eserPr","fark","sozluk","elestirel","tanitim","bildiriRehberi","ornekHepsi","ornek1","ornek2","ornek3"]],
 ["Oturum föyleri","6 oturumun föyleri ve söyleşi notu.",["oturum1","oturum2","oturum3","oturum4","oturum5","oturum6","soylesi"]],
 ["Öğrenci çalışma kâğıtları","Her öğrenci için ayrı sayfa: günlük, alıntı, konu, plan, yazım şablonu, panel hazırlığı.",["okumaGunlugu","alinti","konuSecimi","bildiriPlani","bildiriSablon","panelHazirlik"]],
 ["Kontrol ve değerlendirme","Puanlama formları (EK-7, EK-8), teslim kontrol listesi, arşiv listesi.",["ek7","teslimKontrol","ek8","arsiv"]],
 ["Hikâye ve atölye","İkinci dönem: atölye planı, hikâye rehberi ve planı, kişisel bilgi sayfası.",["atolye","hikayeRehberi","hikayePlani","hikayeKisisel"]]
];
function selIds(){ return Object.keys(DOCS).filter(k=>selDocs.has(k)); }
function vCikti(){
  return `<h2>Tüm Çıktılar</h2>
  <p class="sub">Yazdırabileceğiniz ve Word olarak indirebileceğiniz bütün belgeler burada. İstediklerinizin kutusunu işaretleyin, sonra üstteki düğmelerle hepsini birden yazdırın ya da indirin.</p>
  <div class="card hl" style="position:sticky;top:0;z-index:4"><b><span id="selCount">${selDocs.size}</span> belge seçili</b>
    <div class="row" style="margin-top:8px"><button data-act="selprint">Seçilenleri yazdır</button><button data-act="selword">Seçilenleri Word olarak indir</button><button class="alt" data-act="selall">Hepsini seç</button><button class="alt" data-act="selnone">Seçimi temizle</button></div></div>
  ${DOC_GROUPS.map((g,gi)=>`<h3>${esc(g[0])} <button class="alt sm" data-act="grpsel" data-g="${gi}">Bu grubu seç</button></h3><p class="mini">${esc(g[1])}</p>`
    + g[2].map(id=>`<div class="task" style="cursor:default"><input type="checkbox" data-sel="${id}" ${selDocs.has(id)?"checked":""}><span style="flex:1"><b>${esc(DOCS[id].t)}</b></span><button class="alt sm" data-act="docprev" data-d="${id}">Önizle</button><button class="sm" data-act="docprint" data-d="${id}">Yazdır</button><button class="alt sm" data-act="docword" data-d="${id}">Word</button></div>`).join("")).join("")}`;
}

/* ===== Bilgi ve Kılavuz ===== */
const MORE = [
 ["guide","Kılavuz","Kılavuzun sade özeti, sık sorulan sorular ve arama kutusu."],
 ["works","Eserler ve Bildiri","Eser notları, örnek bildiriler, sınıfta anlatım planı, kavramlar, kaynaklar."],
 ["qs","Koordinatör okula sorulacaklar","Kılavuzda net olmayan noktalar ve hazır soru cümleleri."],
 ["ekler","Ekler ve puan tabloları","Koordinatör okullar listesi (EK-1), oturum planı (EK-2), bildiri ve hikâye puanlama (EK-7, EK-8)."],
 ["ai","Yapay zekâ dönütü","Öğrencinin taslağını EK-7 ölçütlerine göre değerlendirir; metni yazmaz."],
 ["texts","Hazır yazılar (kopyalama)","Yazıları kopyalayıp başka bir yere yapıştırmak için."]
];
function vMore(){
  return `<h2>Bilgi ve Kılavuz</h2>
  <p class="sub">Okumak ve bakmak için sayfalar. Yazdıracağınız belgeler için “Tüm Çıktılar” sayfasına gidin.</p>
  <div class="grid">${MORE.map(m=>`<a class="card linkcard" href="#${m[0]}"><b style="font-size:17px">${esc(m[1])}</b><p class="mini" style="margin:6px 0 0">${esc(m[2])}</p></a>`).join("")}</div>`;
}

/* ================= YÖNLENDİRME ================= */
const VIEWS = {cikti:vCikti, more:vMore, home:vHome, road:vRoad, guide:vGuide, ekler:vEkler, students:vStudents, works:vWorks, qs:vQs, texts:vTexts, ai:vAi, settings:vSettings};
function render(){
  let h = (location.hash||"#home").slice(1); if(!VIEWS[h]) h = "home";
  const act = TABS.some(t=>t[0]===h) ? h : "more";
  $("#nav").innerHTML = TABS.map(t=>`<a href="#${t[0]}" class="${t[0]===act?"on":""}">${t[1]}</a>`).join("");
  $("#main").innerHTML = (SUBPAGES.has(h) ? `<p><a href="#more">← Bilgi ve Kılavuz'a dön</a></p>` : "") + VIEWS[h]();
}
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

/* ================= OLAYLAR ================= */
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.sel){
    if(t.checked) selDocs.add(t.dataset.sel); else selDocs.delete(t.dataset.sel);
    const c = $("#selCount"); if(c) c.textContent = selDocs.size; return;
  }
  if(t.dataset && t.dataset.task){
    if(t.checked) S.done[t.dataset.task] = true; else delete S.done[t.dataset.task];
    save(); render(); return;
  }
  if(t.id==="fkind"){ formKind = t.value; render(); return; }
  if(t.id==="fstu"){ formStu = Number(t.value); render(); return; }
  if(t.id==="aistu"){ aiStu = Number(t.value); aiDraft = $("#aidraft").value; render(); return; }
  if(t.id==="imp"){
    const f = t.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{ try{ const o = JSON.parse(r.result); const d = defaults(); S = Object.assign(d,o,{set:Object.assign(d.set,o.set||{})}); save(); alert("Yedek yüklendi."); render(); }catch(err){ alert("Dosya okunamadı."); } };
    r.readAsText(f); return;
  }
  if(t.dataset && (t.dataset.p==="max7"||t.dataset.p==="max8")){ render(); return; }
  if(t.dataset && t.dataset.p && (t.type==="checkbox"||t.tagName==="SELECT")){
    setPath(S, t.dataset.p, t.type==="checkbox" ? t.checked : t.value);
    save();
    if(t.dataset.p.startsWith("students.")) render();
  }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.id==="gsearch"){ guideQ = t.value; const q = guideQ.toLowerCase();
    const list = GUIDE.filter(g => !q || (g.m+" "+g.k+" "+g.b).toLowerCase().includes(q));
    $("#glist").innerHTML = list.length?list.map(g=>`<div class="card"><span class="badge navy">${esc(g.m)}</span> <b>${esc(g.k)}</b><div style="white-space:pre-wrap;margin-top:6px">${esc(g.b)}</div></div>`).join(""):"<p>Sonuç yok.</p>"; return; }
  if(t.id==="ek1q"){ ek1q = t.value; $("#ek1b").innerHTML = ek1Rows(); return; }
  if(t.id==="aidraft"){ aiDraft = t.value; return; }
  if(t.dataset && t.dataset.p && t.type!=="checkbox" && t.tagName!=="SELECT"){
    let v = t.value;
    if(t.type==="number") v = v===""?"":Number(v);
    setPath(S, t.dataset.p, v); save();
    const m = t.dataset.p.match(/^(sc7|sc8)\.(\d+)\./);
    if(m){ const n = m[1]==="sc7"?C7.length:C8.length; const el = $("#tot_"+m[1]+"_"+m[2]); if(el) el.textContent = scoreTotal(m[1],Number(m[2]),n); }
    if(t.dataset.p==="max7"||t.dataset.p==="max8"){ /* üst puan değişti; tablo yeniden çizilsin */ }
  }
});
document.addEventListener("toggle", e=>{
  const d = e.target;
  if(d.tagName==="DETAILS" && d.dataset.wk!=null){
    const i = Number(d.dataset.wk);
    if(d.open){ openWeeks.add(i); openWeeks.delete("x"+i); } else { openWeeks.delete(i); openWeeks.add("x"+i); }
  }
}, true);
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="wk"){ const ci = curWeekIdx(); viewWeek = Math.max(0, Math.min(W.length-1, (viewWeek==null?ci:viewWeek)+Number(b.dataset.d))); render(); }
  else if(a==="wk0"){ viewWeek = null; render(); }
  else if(a==="ekt"){ eklerTab = b.dataset.v; render(); }
  else if(a==="wt"){ wtab = b.dataset.v; render(); }
  else if(a==="tt"){ ttab = b.dataset.v; render(); }
  else if(a==="printform"){ $("#printRoot").innerHTML = '<div class="paper">'+formHTML(formKind,S.students[formStu])+'</div>'; window.print(); }
  else if(a==="selprint"){ const ids = selIds(); if(!ids.length){ alert("Önce en az bir belge seçin."); } else printIds(ids); }
  else if(a==="selword"){ const ids = selIds(); if(!ids.length){ alert("Önce en az bir belge seçin."); } else wordDoc(ids, "secilen-ciktilar"); }
  else if(a==="selall"){ Object.keys(DOCS).forEach(k=>selDocs.add(k)); const y = window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="selnone"){ selDocs.clear(); const y = window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="grpsel"){ const g = DOC_GROUPS[Number(b.dataset.g)][2]; const all = g.every(id=>selDocs.has(id)); g.forEach(id=> all ? selDocs.delete(id) : selDocs.add(id)); const y = window.scrollY; render(); window.scrollTo(0,y); }
  else if(a==="docword"){ wordDoc([b.dataset.d], DOCS[b.dataset.d].t); }
  else if(a==="docwordall"){ const w = Number(b.dataset.w); wordDoc(WD[w]||[], "hafta-"+(w+1)+"-"+W[w].title); }
  else if(a==="pvword"){ wordDoc(pvIds, pvIds.length===1 ? DOCS[pvIds[0]].t : "ciktilar"); }
  else if(a==="docprev"){ openPV([b.dataset.d]); }
  else if(a==="docprint"){ printIds([b.dataset.d]); }
  else if(a==="docall"){ printIds(WD[Number(b.dataset.w)]||[]); }
  else if(a==="pvprint"){ printIds(pvIds); }
  else if(a==="pvclose"){ closePV(); }
  else if(a==="printtext"){
    $("#printRoot").innerHTML = '<div class="paper" style="white-space:pre-wrap;font-size:15px;line-height:1.6">'+esc(textBody(ttab))+'</div>'; window.print();
  }
  else if(a==="printroad"){
    $("#printRoot").innerHTML = '<div class="paper"><h3>Oku-Yorum, Yazı-Yorum Yol Haritası</h3><p style="text-align:center">'+esc(OKUL)+' · Siyasetname/Ütopyalar</p>'+W.map((w,i)=>'<div style="margin-top:12px;page-break-inside:avoid"><b>'+(i+1)+'. '+esc(w.title)+'</b> <i>('+fmt(toD(w.s))+' – '+fmt(toD(w.e))+')</i><ul style="margin:4px 0">'+w.tasks.map(t=>'<li>'+(S.done[t.id]?'☑ ':'☐ ')+esc(t.t)+'</li>').join('')+'</ul></div>').join('')+'</div>'; window.print();
  }
  else if(a==="copytext"){
    const txt = textBody(ttab);
    const done = ()=>{ const c=$("#copied"); if(c){ c.textContent="Kopyalandı"; setTimeout(()=>{c.textContent="";},2000);} };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,()=>{ fallbackCopy(txt); done(); }); }
    else { fallbackCopy(txt); done(); }
  }
  else if(a==="aigo"){ aiRun(); }
  else if(a==="export"){
    const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const l = document.createElement("a"); l.href = URL.createObjectURL(blob); l.download = "oku-yorum-yedek-"+todayStr()+".json"; l.click();
  }
  else if(a==="reset"){ if(confirm("Tüm veriler silinecek. Emin misiniz?")){ S = defaults(); save(); render(); } }
});
function fallbackCopy(txt){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); }

render();
</script>
</body>
</html>
